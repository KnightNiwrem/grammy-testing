openapi: 3.1.1
info:
  title: grammY Testing Emulation Server
  version: 0.0.0
  description: >-
    HTTP interface for isolated Telegram Bot API test sessions. Objects marked with
    `x-implementation-status: unimplemented` describe agreed API surface that is not available
    from the server yet. Marked path items without operations record routing topology only.
servers:
  - url: http://{domain}:{port}
    variables:
      domain:
        default: localhost
        description: Domain advertised to clients.
      port:
        default: '8081'
        description: Port on which the standalone server listens.
paths:
  /sessions:
    description: Collection of isolated Telegram test sessions.
    post:
      operationId: createSession
      summary: Create an isolated test session
      responses:
        '201':
          description: The test session was created.
          headers:
            Location:
              description: Relative URL of the created test session.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessions/{sessionId}:
    description: One isolated Telegram test session and the lifecycle of everything it owns.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: deleteSession
      summary: End an isolated test session
      description: Discards the session and all virtual entities and state that it owns.
      responses:
        '204':
          description: The test session and all of its state were discarded.
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bots:
    description: Virtual bots owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createBot
      summary: Create a virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: The virtual bot was created.
          headers:
            Location:
              description: Relative URL of the created virtual bot.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBot'
        '400':
          description: The request body is malformed or does not match the bot creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/bots/{botId}:
    description: One virtual bot owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotId'
  /sessions/{sessionId}/accounts:
    description: Virtual Telegram accounts owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createAccount
      summary: Create a virtual Telegram account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The virtual account was created.
          headers:
            Location:
              description: Relative URL of the created virtual account.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          description: The request body is malformed or does not match the account creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/accounts/{accountId}:
    description: One virtual Telegram account owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
  /sessions/{sessionId}/bot-api/bot{token}/getMe:
    description: Telegram Bot API method for retrieving the authenticated virtual bot's profile.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getMe
      summary: Return the authenticated virtual bot's profile
      responses:
        '200':
          description: The virtual bot was authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/{method}:
    description: Telegram Bot API methods invoked for a virtual bot within a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/BotApiMethod'
components:
  schemas:
    Bot:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
        - username
        - can_join_groups
        - can_read_all_group_messages
        - supports_inline_queries
        - can_connect_to_business
        - has_main_web_app
        - has_topics_enabled
        - allows_users_to_create_topics
        - can_manage_bots
        - supports_join_request_queries
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 4503599627370495
          description: Server-assigned Telegram user identifier for the bot.
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        username:
          type: string
        can_join_groups:
          type: boolean
        can_read_all_group_messages:
          type: boolean
        supports_guest_queries:
          type: boolean
        supports_inline_queries:
          type: boolean
        can_connect_to_business:
          type: boolean
        has_main_web_app:
          type: boolean
        has_topics_enabled:
          type: boolean
        allows_users_to_create_topics:
          type: boolean
        can_manage_bots:
          type: boolean
        supports_join_request_queries:
          type: boolean
    CreateBotRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - username
      properties:
        first_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
    CreatedBot:
      type: object
      additionalProperties: false
      required:
        - token
        - bot
      properties:
        token:
          type: string
          description: Emulator-issued token used to call the Bot API as this bot.
        bot:
          $ref: '#/components/schemas/Bot'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 4503599627370495
          description: Server-assigned Telegram user identifier for the account.
        is_bot:
          type: boolean
          const: false
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        language_code:
          type: string
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        language_code:
          type: string
          minLength: 1
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          $ref: '#/components/schemas/Account'
    GetMeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Bot'
    BotApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error_code
        - description
      properties:
        ok:
          type: boolean
          const: false
        error_code:
          type: integer
        description:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - botApiRoot
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier of the test session.
        botApiRoot:
          type: string
          format: uri
          description: Absolute API root for bots operating in this test session.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the test session that owns the addressed state.
      schema:
        type: string
    BotToken:
      name: token
      in: path
      required: true
      description: Token of a virtual bot owned by the addressed test session.
      schema:
        type: string
    BotId:
      name: botId
      in: path
      required: true
      description: Server-assigned identifier of a virtual bot.
      schema:
        type: integer
        minimum: 1
        maximum: 4503599627370495
    AccountId:
      name: accountId
      in: path
      required: true
      description: Server-assigned Telegram user identifier for a virtual account.
      schema:
        type: integer
        minimum: 1
        maximum: 4503599627370495
    BotApiMethod:
      name: method
      in: path
      required: true
      description: Telegram Bot API method name.
      schema:
        type: string
