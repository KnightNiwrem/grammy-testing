      minute, which a service message from the bot records, then lifts the ban, and a removed
      bot receives a my_chat_member update for each step. A bot that names itself leaves the
      supergroup. Lifting the ban of a user that is not banned and not a member succeeds
      without rights, and with `only_if_banned`, so does any request about a user that is not
      banned.
    parameters:
      - $ref: '#/components/parameters/SessionId'
