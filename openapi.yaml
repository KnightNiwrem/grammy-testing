  /sessions/{sessionId}/bot-api/bot{token}/setMyDefaultAdministratorRights:
    description: >-
      Telegram Bot API method for replacing the rights the bot asks for by default when it is added
      to groups, or with `for_channels` to channels, as an administrator. As in TDLib, rights that
      do not apply to the kind of chat are dropped, as is anonymity in channels, and any right
      includes `can_manage_chat`. Missing or empty `rights` remove the defaults. The emulator has
      no workflow that grants these rights.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: setMyDefaultAdministratorRights
      summary: Replace the rights the authenticated virtual bot asks for by default as an administrator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMyDefaultAdministratorRightsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetMyDefaultAdministratorRightsRequest'
            encoding:
              rights:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetMyDefaultAdministratorRightsRequest'
            encoding:
              rights:
                contentType: application/json
      responses:
        '200':
          description: The default rights were replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, including a right Telegram
            does not know, or `rights` is not JSON (`Bad Request: can't parse
            ChatAdministratorRights JSON object`), not a JSON object (`Bad Request: can't parse
            ChatAdministratorRights: ChatAdministratorRights must be an Object`), or has a right
            that is not a JSON boolean (`Bad Request: can't parse ChatAdministratorRights: Field
            "<right>" must be of type Boolean`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/getMyDefaultAdministratorRights:
