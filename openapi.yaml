openapi: 3.1.1
info:
  title: tg-bot-api-emulator
  version: 0.0.0
  description: >-
    HTTP interface for isolated Telegram Bot API test sessions. Objects marked with
    `x-implementation-status: unimplemented` describe agreed API surface that is not available
    from the server yet. Marked path items without operations record routing topology only.


    Bot API paths follow Telegram's request conventions, so each listed POST operation also
    accepts GET, and method names match case-insensitively. Parameters can be supplied in the
    query string or in an `application/json`, `application/x-www-form-urlencoded`, or
    `multipart/form-data` body; a query-string parameter takes precedence over a body parameter
    of the same name. Any parameter value can be sent as text, with array parameters such as
    `allowed_updates` as JSON text. Methods that send a file read it from a `multipart/form-data`
    part with a file name: the part named after the file parameter, or the part that the
    parameter names as `attach://<part name>`. Telegram tolerates unknown parameters, malformed values, and
    bodies it cannot decode; the emulator rejects them with a `400` Bot API error so that tests
    surface the mistake.


    As on Telegram, a method the emulator does not implement is answered, after the token is
    authenticated, with a `404` Bot API error described as `Not Found: method not found`. A path
    under a session's Bot API root that does not name both a bot token and a method is answered
    with a `404` Bot API error described as `Not Found`, before any token is checked.


    The server is meant to run inside a test environment, such as CI, rather than as a public
    service, so admin routes require no credentials; each test session isolates its own state. Bot
    API routes authenticate the bot token in their path, as Telegram does, and answer a token that
    no bot of the session owns with a `401` Bot API error. OpenAPI security schemes cannot describe
    a credential in the path, so no operation declares one.
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
security: []
servers:
  - url: http://{domain}:{port}
    variables:
      domain:
        default: localhost
        description: Domain advertised to clients.
      port:
        default: '8081'
        description: Port on which the standalone server listens.
paths:
  /sessions:
    description: Collection of isolated Telegram test sessions.
    post:
      operationId: createSession
      summary: Create an isolated test session
      responses:
        '201':
          description: The test session was created.
          headers:
            Location:
              description: Relative URL of the created test session.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessions/{sessionId}:
    description: One isolated Telegram test session and the lifecycle of everything it owns.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: deleteSession
      summary: End an isolated test session
      description: >-
        Discards the session and all virtual entities and state that it owns. Long polls that its bots
        hold are answered at once without updates.
      responses:
        '204':
          description: The test session and all of its state were discarded.
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bots:
    description: Virtual bots owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createBot
      summary: Create a virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: The virtual bot was created.
          headers:
            Location:
              description: Relative URL of the created virtual bot.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBot'
        '400':
          description: The request body is malformed or does not match the bot creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/bots/{botId}:
    description: One virtual bot owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotId'
  /sessions/{sessionId}/bots/{botId}/rate-limit-responses:
    description: >-
      `429 Too Many Requests` answers queued for a bot's next Bot API calls, for testing how the
      bot handles Telegram's rate limits. The emulator reproduces none of Telegram's traffic
      thresholds. Each call takes one answer from the earliest queued answers that apply to its
      method, whatever its parameters, instead of running; webhook replies that call methods take
      them too. Answers that no call takes end with the session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotId'
    post:
      operationId: queueRateLimitResponses
      summary: Queue rate limit answers for a bot's next calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRateLimitResponsesRequest'
      responses:
        '201':
          description: The answers were queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponses'
        '400':
          description: >-
            The request body is malformed, or `method` names no Bot API method the emulator
            implements.
        '404':
          description: No active test session or virtual bot has the supplied identifier.
    get:
      operationId: listRateLimitResponses
      summary: List the rate limit answers still queued for a bot
      responses:
        '200':
          description: The queued answers, earliest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - rate_limit_responses
                properties:
                  rate_limit_responses:
                    type: array
                    items:
                      $ref: '#/components/schemas/RateLimitResponses'
        '404':
          description: No active test session or virtual bot has the supplied identifier.
  /sessions/{sessionId}/accounts:
    description: Virtual Telegram accounts owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createAccount
      summary: Create a virtual Telegram account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The virtual account was created.
          headers:
            Location:
              description: Relative URL of the created virtual account.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          description: The request body is malformed or does not match the account creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/accounts/{accountId}:
    description: One virtual Telegram account owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
  /sessions/{sessionId}/accounts/{accountId}/messages:
    description: Messages sent by one virtual account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: sendAccountMessage
      summary: Send a message as a virtual account
      description: >-
        Sends text, a photo, or a document to the account's private chat with a bot, or to a
        supergroup the account is a member of; or forwards a message of such a chat there, as the
        account's message that shows who first sent it. Messages protected from forwarding and
        service messages cannot be forwarded, and, as on Telegram, a forward cannot be edited. In
        a supergroup, the supergroup's bots receive the message unless it is not addressed to a
        bot in privacy mode. As on Telegram, a message reaches only the one bot in privacy mode it
        is meant for, if any, and replies take precedence: the bot a replied message was meant
        for (its author, the bot it was sent through, or the bot it was meant for in turn), then
        the bot the message is sent through, then the bot its leading command names. Only a
        message meant for no bot in particular reaches bots in privacy mode that it mentions, or
        all of them when its text or caption starts with a command without a bot's username. As
        on Telegram, a bot that is an administrator of the supergroup receives every message,
        privacy mode notwithstanding. Telegram documents that a command without a bot's username
        reaches only the bot that last wrote to the group; the emulator delivers it to every bot
        in privacy mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAccountMessageRequest'
      responses:
        '201':
          description: >-
            The message was stored and, unless a receiving bot's allowed_updates subscription
            excludes message updates, an update was enqueued for each bot that receives it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SentMessage'
                  - $ref: '#/components/schemas/SentSupergroupMessage'
        '400':
          description: >-
            The request, message text, or caption is invalid, the photo is not an image Telegram
            accepts, the file is empty, the replied message is not a message of the chat, or the
            forwarded message cannot be forwarded.
        '403':
          description: The account is not a member of a supergroup of the request.
        '404':
          description: >-
            The session, sending account, a bot or supergroup of the request, or the forwarded
            message does not exist.
        '409':
          description: The account blocks the target bot and must unblock it before writing to it.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/messages:
    description: Stored messages in a private conversation between an account and bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateMessageHistory
      summary: Return the private conversation's stored messages
      description: >-
        Returns the messages written by either participant, oldest first, as the bot sees them:
        each message carries the bot's message ID, and its chat is the account. Messages the bot
        deleted are omitted.
      responses:
        '200':
          description: The participants exist; the message list may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistory'
        '400':
          description: An account or bot path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/messages/{messageId}:
    description: One message of a private conversation, addressed by its ID as the bot sees it.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
      - $ref: '#/components/parameters/MessageId'
    patch:
      operationId: editAccountMessage
      summary: Edit the text or caption of a message the account sent
      description: >-
        Replaces the text of the account's text message, or the caption of its photo or document,
        normalized as when sending it, and dates the edit. Unless the bot's allowed_updates subscription excludes edited_message updates, the
        bot receives an edited_message update carrying the edited message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAccountMessageRequest'
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          description: >-
            The request, text, or caption is invalid, the bot wrote the message, the request gives
            text for a photo or document or a caption for a text message, or the normalized text or
            caption is the message's current one.
        '404':
          description: The session, account, bot, or message of their private chat does not exist.
    delete:
      operationId: deleteAccountMessage
      summary: Delete a message of the private chat for both participants
      description: >-
        Deletes the account's message or the bot's message for both participants, as Telegram's
        clients do when deleting for everyone; as TDLib's `can_revoke_message` allows users in
        private chats, either participant's messages can be deleted, without a time limit. As on
        Telegram, the bot receives no update, and then no longer finds the message, for example to
        edit or reply to it. Deleting the message that asked for the reply interface the client
        shows removes that interface.
      responses:
        '204':
          description: The message was deleted.
        '400':
          description: A path identifier is invalid.
        '404':
          description: >-
            The session, account, bot, or message of their private chat does not exist, including
            a deleted message.
  /sessions/{sessionId}/accounts/{accountId}/supergroups:
    description: Supergroups an account creates, which it owns.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: createSupergroup
      summary: Create a supergroup owned by a virtual account
      description: >-
        Creates a supergroup whose only member is the account, as its owner. The owner adds
        accounts and bots to it as members. With a `username`, the supergroup is public: bots see
        the username in its chat and can address it as `@username` wherever a Bot API method
        takes a chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupergroupRequest'
      responses:
        '201':
          description: The supergroup was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSupergroup'
        '400':
          description: The request body is malformed or does not match the supergroup schema.
        '404':
          description: The session or account does not exist.
        '409':
          description: Another account, bot, or supergroup of the session has the username.
        '507':
          description: The test session cannot allocate another supergroup identifier.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/members/{userId}:
    description: >-
      A member of a supergroup, as the supergroup's owner adds or removes it, or as the member
      itself leaves.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: addSupergroupMember
      summary: Add an account or a bot to a supergroup the account owns
      description: >-
        Adds the user as a member, which a service message from the account records with
        `new_chat_members`. An added bot first receives a my_chat_member update, to `member` from
        `left`, or from `kicked` for a bot removed before, whose ban adding it lifts. Every bot of
        the supergroup, the added one included, then receives the service message, privacy mode
        notwithstanding. Updates that a bot's allowed_updates subscription excludes are not sent.
        Adding a member again changes nothing.
      responses:
        '204':
          description: The user is a member of the supergroup.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user to add does not exist.
    delete:
      operationId: removeSupergroupMember
      summary: Leave a supergroup, or remove a member from a supergroup the account owns
      description: >-
        When the user is the account itself, the account leaves the supergroup; otherwise the
        account, as the owner, removes the user, which, as in Telegram's apps, bans it until it is
        added again. A service message from the account that left or removed the member records
        the change with `left_chat_member`, and the supergroup's bots receive it, privacy mode
        notwithstanding. A removed bot first receives a my_chat_member update, from `member` to
        `kicked`, and still receives the service message about itself; its later Bot API requests
        to the supergroup fail with `403 Forbidden: bot was kicked from the supergroup chat`. The
        owner cannot leave: Telegram keeps a creator who left as the owner, which the emulator does
        not support. Leaving or removing a user that is not a member changes nothing.
      responses:
        '204':
          description: The user is not a member of the supergroup.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account removes another user from a supergroup it does not own.
        '404':
          description: The session, account, supergroup, or user to remove does not exist.
        '409':
          description: The account owns the supergroup and cannot leave it.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/administrators/{userId}:
    description: >-
      An administrator of a supergroup, as the supergroup's owner promotes a member or demotes it.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: promoteSupergroupMember
      summary: Promote a member of a supergroup the account owns to administrator
      description: >-
        Makes the member, an account or a bot, an administrator holding the given rights, or
        replaces an administrator's rights; as on Telegram, any right includes `can_manage_chat`.
        A promoted bot receives a my_chat_member update from the account showing it as
        `administrator` with its rights. As on Telegram, an administrator bot receives every
        message of the supergroup, privacy mode notwithstanding; with `can_delete_messages` it
        deletes any message there, and with `can_restrict_members` it bans and unbans users. Bots
        see the other rights but the emulator does not enforce them. Promoting an administrator
        with the rights it holds changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteSupergroupMemberRequest'
      responses:
        '204':
          description: The member is an administrator with the given rights.
        '400':
          description: A path identifier or the body is invalid, or the body grants no right.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user to promote does not exist.
        '409':
          description: The user is not a member of the supergroup, or is its owner.
    delete:
      operationId: demoteSupergroupMember
      summary: Demote an administrator of a supergroup the account owns to a member
      description: >-
        Makes the administrator a member without rights. A demoted bot receives a my_chat_member
        update from the account showing it as `member`. Demoting a member that is no administrator
        changes nothing.
      responses:
        '204':
          description: The user is a member of the supergroup without administrator rights.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user to demote does not exist.
        '409':
          description: The user is not a member of the supergroup, or is its owner.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/administrators/{userId}/custom-title:
    description: >-
      The custom title that clients show for the owner of a supergroup or an administrator in place
      of its role.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setSupergroupCustomTitle
      summary: Set the custom title of the owner or an administrator of a supergroup the account owns
      description: >-
        Sets the owner's own custom title or an administrator's, as Telegram lets a supergroup's
        owner do; an empty title removes it. Bots see the title as `custom_title` in getChatMember,
        getChatAdministrators, and chat member updates, and a bot whose title changes receives a
        my_chat_member update. An administrator keeps its title when its rights change, and loses
        it when demoted. Setting the title a user has changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCustomTitleRequest'
      responses:
        '204':
          description: The user has the given title, or none for an empty title.
        '400':
          description: >-
            A path identifier or the body is invalid, such as a title longer than 16 characters or
            one with emoji.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user does not exist.
        '409':
          description: The user is not the owner or an administrator of the supergroup.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/content-protection:
    description: >-
      Whether a supergroup protects all its content from forwarding and saving, as Telegram's
      "Restrict saving content" setting does.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    put:
      operationId: protectSupergroupContent
      summary: Protect all content of a supergroup the account owns
      description: >-
        As TDLib's `get_message_has_protected_content` decides, every message of the supergroup,
        including earlier ones, is then protected while the setting lasts: bots see
        `has_protected_content`, neither bots nor accounts can forward the messages, and a bot's
        reply to one from another chat is sent without the reply, though bots may still copy them.
        As on Telegram, only the
        owner may change the setting, and bots receive no service message for it. Protecting a
        protected supergroup changes nothing.
      responses:
        '204':
          description: The supergroup protects all its content.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
    delete:
      operationId: unprotectSupergroupContent
      summary: Lift the content protection of a supergroup the account owns
      description: >-
        Messages are then protected only when their senders protected them. Lifting the protection
        of an unprotected supergroup changes nothing.
      responses:
        '204':
          description: The supergroup no longer protects all its content.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/messages:
    description: Stored messages of a supergroup the account is a member of.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    get:
      operationId: getSupergroupMessageHistory
      summary: Return the supergroup's stored messages
      description: >-
        Returns the messages every member wrote, oldest first, as the account sees them. A
        supergroup numbers its messages once, so every member, account or bot, sees the same
        message IDs; each member knows a file by a `file_id` of its own. Deleted messages are
        omitted.
      responses:
        '200':
          description: The account is a member; the message list may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupergroupMessageHistory'
        '400':
          description: An account or supergroup path identifier is invalid.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/commands:
    description: The bot commands an account's client suggests in a supergroup it is a member of.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    get:
      operationId: getSupergroupBotCommands
      summary: Return the commands the account sees in the supergroup, for each bot
      description: >-
        Resolves each bot member's command lists as Telegram documents for group chats: the list
        for the account as a member of the supergroup, for the supergroup's administrators, for the
        supergroup, for all groups' administrators, for all groups, then the default list, where
        administrator lists apply only to the owner and administrators. Each scope prefers the list
        in the account's language, taken from the primary subtag of its `language_code`, over the
        list without a language. As in TDLib, bots without commands are left out.
      responses:
        '200':
          description: The commands of each bot of the supergroup that has any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSupergroupBotCommands'
        '400':
          description: An account or supergroup path identifier is invalid.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/chat-actions:
    description: The chat actions, such as typing, a member's client shows in a supergroup.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    get:
      operationId: getSupergroupChatActions
      summary: Return the chat actions the supergroup's bots show
      description: >-
        Returns each bot's action in the order the bots last sent them. As for a private chat, an
        action lasts 5.5 seconds unless the bot sends it again, and ends when the bot cancels it
        or sends a message to the supergroup.
      responses:
        '200':
          description: The bots' actions, which may be none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountChatActions'
        '400':
          description: An account or supergroup path identifier is invalid.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/reply-interface:
    description: The reply keyboard or forced reply a member's client shows in a supergroup.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    get:
      operationId: getSupergroupReplyInterface
      summary: Return the reply interface the member sees in the supergroup
      description: >-
        As TDLib tracks it for a received message, a bot's reply keyboard or forced reply applies
        to every member, or, when selective, only to the members its message mentions and the
        sender of the message it replies to; the chat then shows it. A keyboard removal that
        applies to the member removes an interface the same bot set. The interface also
        disappears when its message is deleted or its bot leaves or is removed from the
        supergroup.
      responses:
        '200':
          description: The reply interface, or `null` when the client shows its usual input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountReplyInterface'
        '400':
          description: An account or supergroup path identifier is invalid.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/notifications:
    description: The notifications a member's client shows for the messages of a supergroup.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    get:
      operationId: getSupergroupNotifications
      summary: Return the notifications of other members' messages, and whether each is silent
      description: >-
        Returns a notification for each message another member sent to the supergroup, including
        service messages, in order. As for a private chat, a notification is silent when a bot
        sent its message with `disable_notification`.
      responses:
        '200':
          description: The supergroup's notifications, which may be none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotifications'
        '400':
          description: An account or supergroup path identifier is invalid.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/messages/{messageId}:
    description: One message of a supergroup, addressed by its ID in the supergroup.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/SupergroupMessageId'
    patch:
      operationId: editSupergroupAccountMessage
      summary: Edit the text or caption of a message the account sent to a supergroup
      description: >-
        Replaces the text or caption of the account's message, as for a private message, and
        dates the edit. The supergroup's bots receive an edited_message update as they would receive the
        message with its new text, unless their allowed_updates subscription excludes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAccountMessageRequest'
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentSupergroupMessage'
        '400':
          description: >-
            The request, text, or caption is invalid, another member wrote the message, the request
            gives text for a photo or document or a caption for a text message, or the normalized
            text or caption is the message's current one.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, supergroup, or message of the supergroup does not exist.
    delete:
      operationId: deleteSupergroupAccountMessage
      summary: Delete a message of a supergroup for every member
      description: >-
        Deletes a message for every member, as TDLib's `can_delete_channel_message` allows: the
        account deletes the messages it wrote, and the owner or an administrator with the
        `can_delete_messages` right deletes any message, service messages included. As on
        Telegram, no bot receives an update for the deletion.
      responses:
        '204':
          description: The message was deleted.
        '400':
          description: A path identifier is invalid.
        '403':
          description: >-
            The account is not a member of the supergroup, or may not delete the message.
        '404':
          description: >-
            The session, account, supergroup, or message of the supergroup does not exist,
            including a deleted message.
  /sessions/{sessionId}/accounts/{accountId}/blocked-bots/{botId}:
    description: >-
      A bot on the account's block list. Telegram calls blocking a bot stopping it. While the
      account blocks the bot, the bot's messages and chat actions to the account fail with `403
      Forbidden: bot was blocked by the user`, and the account cannot write to the bot. Existing
      messages stay editable and deletable.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    put:
      operationId: blockBot
      summary: Block a bot as the account
      description: >-
        Unless the bot's allowed_updates subscription excludes my_chat_member updates, the bot
        receives a my_chat_member update in which its membership in the account's private chat
        changes from `member` to `kicked`. The account need not have written to the bot. Blocking
        a blocked bot has no effect.
      responses:
        '204':
          description: The account blocks the bot.
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
    delete:
      operationId: unblockBot
      summary: Unblock a bot as the account
      description: >-
        Unless the bot's allowed_updates subscription excludes my_chat_member updates, the bot
        receives a my_chat_member update in which its membership changes from `kicked` back to
        `member`. Unblocking a bot that is not blocked has no effect.
      responses:
        '204':
          description: The account does not block the bot.
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/commands:
    description: The bot commands an account's client suggests in its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatBotCommands
      summary: Return the commands the account sees in its private chat with the bot
      description: >-
        Resolves the bot's command lists as Telegram documents for private chats: the list for
        the chat, then for all private chats, then the default list, each preferring the list in
        the account's language, taken from the primary subtag of its `language_code`, over the
        list without a language. The account need not have written to the bot.
      responses:
        '200':
          description: The commands, which are empty if the bot set none that apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBotCommands'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/chat-actions:
    description: The chat action, such as typing, an account's client shows in its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatActions
      summary: Return the chat action the bot shows in its private chat with the account
      description: >-
        As TDLib's `DialogActionManager` shows them, a bot's action from `sendChatAction` lasts
        5.5 seconds unless the bot sends it again, and ends when the bot cancels it or sends a
        message to the chat.
      responses:
        '200':
          description: The bot's action, or none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountChatActions'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/notifications:
    description: >-
      The notifications an account's client shows for the messages of its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatNotifications
      summary: Return the notifications of the bot's messages, and whether each is silent
      description: >-
        Returns a notification for each message the bot sent to the chat, in order, as TDLib
        notifies of new messages. A notification is silent when the bot sent its message with
        `disable_notification`, as TDLib's `notification.is_silent` shows. Accounts have no
        notification settings, such as muted chats, and reading a message keeps its notification;
        a deleted message has none.
      responses:
        '200':
          description: The chat's notifications, which may be none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNotifications'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/reply-interface:
    description: >-
      The reply keyboard or forced reply an account's client shows in its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatReplyInterface
      summary: Return the reply interface the account sees in its private chat with the bot
      description: >-
        As TDLib tracks it, the chat shows the reply interface of the latest bot message that sent
        a reply keyboard or forced reply, until a later message removes the keyboard or that
        message is deleted. Messages with an inline keyboard or no reply markup leave it
        unchanged, and so do edits.
      responses:
        '200':
          description: The reply interface, or `null` when the client shows its usual input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountReplyInterface'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/reply-keyboard-presses:
    description: Reply keyboard buttons an account pressed.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: pressReplyKeyboardButton
      summary: Press a button of the reply keyboard a private chat or a supergroup shows
      description: >-
        Sends the button's text as the account's message, as a Telegram client does. In a
        supergroup, as Telegram Desktop's `HistoryWidget::sendBotCommand` does outside private
        chats, the message replies to the keyboard's message, so that the bot that sent it
        receives it even in privacy mode. The keyboard stays shown afterward, even a one-time
        keyboard, which Telegram clients only hide until the user shows it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PressReplyKeyboardButtonRequest'
      responses:
        '201':
          description: >-
            The button's text was sent as the account's message, and, unless the bot's
            allowed_updates subscription excludes message updates, an update was enqueued for the
            bot.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SentMessage'
                  - $ref: '#/components/schemas/SentSupergroupMessage'
        '400':
          description: >-
            The request is invalid, or the chat shows no reply keyboard with a button of that
            text.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, bot, or supergroup does not exist.
        '409':
          description: The account blocks the bot and must unblock it before writing to it.
  /sessions/{sessionId}/accounts/{accountId}/callback-queries:
    description: Callback queries an account created by pressing callback buttons.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: pressCallbackButton
      summary: Press a callback button on a bot message as a virtual account
      description: >-
        Presses the button with the given callback data on a bot message in the account's private
        chat with the bot, or in a supergroup the account is a member of. Unless the bot that sent
        the message has an allowed_updates subscription that excludes callback_query
        updates, the bot receives a callback_query update carrying the message as it is now. A
        button on a message sent through a bot's inline mode reaches that inline bot instead, with
        the message's `inline_message_id` in place of the message, as on Telegram. The
        bot answers asynchronously with answerCallbackQuery; read the answer from the created
        callback query. The press can create the query already expired, so that the bot receives
        it but cannot answer it, as when a bot that was offline catches up after the answer
        deadline has passed. The emulator never expires callback queries by time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PressCallbackButtonRequest'
      responses:
        '201':
          description: The button was pressed and the callback query created.
          headers:
            Location:
              description: Relative URL of the created callback query.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        '400':
          description: >-
            The request is invalid, or the message has no callback button with the given data.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: >-
            The session, account, bot, or supergroup does not exist, or the chat has no message
            with the given ID.
  /sessions/{sessionId}/accounts/{accountId}/callback-queries/{callbackQueryId}:
    description: One callback query created by an account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/CallbackQueryId'
    get:
      operationId: getCallbackQuery
      summary: Return a callback query with the bot's answer once given
      responses:
        '200':
          description: The callback query, answered or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        '400':
          description: The account path identifier is invalid.
        '404':
          description: The session does not exist, or the account created no such callback query.
  /sessions/{sessionId}/accounts/{accountId}/inline-queries:
    description: Inline queries an account typed for inline bots.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: sendInlineQuery
      summary: Type an inline query for a bot as a virtual account
      description: >-
        Sends an inline query, as typing the bot's username followed by the query does, from the
        account's private chat with a bot, the inline bot or another, or from a supergroup the
        account is a member of. The inline bot need not be a member of the chat, but must have been
        created with `supports_inline_queries`. Unless the bot's allowed_updates subscription
        excludes them, it receives an inline_query update whose `chat_type` is `sender` for the
        account's private chat with the inline bot itself, `private` for its chat with another
        bot, and `supergroup` for a supergroup. The bot answers asynchronously with
        answerInlineQuery; read the answer from the created inline query, and send one of its
        results to the chat with the query's chosen-results route. The emulator never expires
        inline queries by time.

        An account can share its location only with a bot created with
        `requests_inline_location`, as Telegram's apps do; the bot receives it in the inline_query
        update and in the chosen_inline_result update of a result sent from the query.

        A query that repeats one answered within the answer's `cache_time` is created already
        answered with the same answer, and the bot receives no update for it. A query repeats
        another when it is sent to the same bot from the same kind of chat, with the same offset,
        the same text apart from surrounding whitespace, and, as TDLib compares them, a location
        with the same coordinates in whole ten-thousandths of a degree, or no location. A personal
        answer is reused only for the account that received it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInlineQueryRequest'
      responses:
        '201':
          description: The inline query was sent.
          headers:
            Location:
              description: Relative URL of the created inline query.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineQueryResponse'
        '400':
          description: >-
            The request is invalid, such as a query longer than 256 characters or a location
            outside the valid coordinates.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: >-
            The session, account, inline bot, supergroup, or bot of the private chat does not
            exist.
        '409':
          description: >-
            The bot was not created with inline mode turned on, or the query shares a location
            with a bot not created with `requests_inline_location`.
  /sessions/{sessionId}/accounts/{accountId}/inline-queries/{inlineQueryId}:
    description: One inline query sent by an account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/InlineQueryId'
    get:
      operationId: getInlineQuery
      summary: Return an inline query with the bot's answer once given
      responses:
        '200':
          description: The inline query, answered or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineQueryResponse'
        '400':
          description: The account path identifier is invalid.
        '404':
          description: The session does not exist, or the account sent no such inline query.
  /sessions/{sessionId}/accounts/{accountId}/inline-queries/{inlineQueryId}/chosen-results:
    description: Results of an inline query's answer that the account sent to the query's chat.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/InlineQueryId'
    post:
      operationId: chooseInlineQueryResult
      summary: Send a result of the bot's answer as a virtual account
      description: >-
        Sends a result of the bot's answer to the chat where the account typed the query, as the
        account's own message sent through the inline bot, which its `via_bot` shows. The message
        holds the text of the result's `input_message_content`, or else its photo or document with
        its caption, and the result's inline keyboard. The chat's bots receive it as they receive
        the account's other messages; in a supergroup, the inline bot receives it in privacy mode
        too when it is a member. Then, if the inline bot was created with
        `receives_chosen_inline_results`, it receives a chosen_inline_result update, which carries
        the message's `inline_message_id` when the message has an inline keyboard. The inline bot
        edits the message by that identifier, and presses of its callback buttons reach the inline
        bot as callback queries carrying it instead of the message. As on Telegram, the account
        can send a result again, each time as a new message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChooseInlineQueryResultRequest'
      responses:
        '201':
          description: >-
            The result was sent. A private message is shown as the conversation's bot sees it, and
            a supergroup message as the account sees it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SentMessage'
                  - $ref: '#/components/schemas/SentSupergroupMessage'
        '400':
          description: The request is invalid, or the answer has no result with the given ID.
        '403':
          description: The account is no longer a member of the supergroup.
        '404':
          description: The session does not exist, or the account sent no such inline query.
        '409':
          description: >-
            The bot has not answered the query yet, or the account blocks the bot of the private
            chat and must unblock it before writing to it.
  /sessions/{sessionId}/bot-api/bot{token}/getMe:
    description: Telegram Bot API method for retrieving the authenticated virtual bot's profile.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getMe
      summary: Return the authenticated virtual bot's profile
      responses:
        '200':
          description: The virtual bot was authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeResponse'
        '400':
          description: The request body cannot be decoded, or getMe received a parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/getUpdates:
    description: Telegram Bot API long-polling method for receiving pending bot updates.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getUpdates
      summary: Return pending updates for the authenticated virtual bot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
            encoding:
              allowed_updates:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
            encoding:
              allowed_updates:
                contentType: application/json
      responses:
        '200':
          description: Pending updates, limited and confirmed according to the supplied offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUpdatesResponse'
        '400':
          description: The request body cannot be decoded, or the getUpdates parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '409':
          description: >-
            The bot has a webhook, so it cannot poll; or, while this request was waiting for
            updates, another getUpdates request for the same bot began waiting and replaced it, or
            the bot set a webhook. A bot has at most one waiting request; requests answered
            immediately do not replace it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/setWebhook:
    description: >-
      Telegram Bot API method for delivering the bot's updates to a webhook, or, with an empty URL,
      for removing it. The emulator posts each update to the URL as JSON, with the
      `X-Telegram-Bot-Api-Secret-Token` header when a secret token is set, and confirms it once the
      webhook answers with a 2xx status. As the official server's `WebhookActor` does, updates
      wait in queues: messages and their edits by chat, inline queries, chosen inline results, and
      callback queries by the sending user, and membership updates by chat or by member. Each
      queue sends one update at a time and in order, and up to `max_connections` queues send at
      once. An update the webhook has not answered after 60 seconds fails with `Read timeout
      expired`. A failed update is sent again at once, then after delays doubling from 2 up to 60
      seconds, and holds back the later updates of its queue. As on Telegram, a 2xx response may
      call a Bot API method, named by its `method` parameter, with the response's other
      parameters in any encoding a request may use; the method runs before the queue sends its
      next update, and nothing receives its answer.
      `setWebhook`, `deleteWebhook`, `close`, `logOut`, and methods whose names start with `get`
      are ignored. Unlike Telegram, the emulator delivers to plain HTTP URLs on any port. Setting
      a new webhook
      ends the bot's waiting getUpdates request with a conflict. Ending the session stops
      delivery; undelivered updates stay pending.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: setWebhook
      summary: Set, replace, or remove the authenticated virtual bot's webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetWebhookRequest'
            encoding:
              allowed_updates:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetWebhookRequest'
            encoding:
              allowed_updates:
                contentType: application/json
      responses:
        '200':
          description: >-
            The webhook was set, removed, or already as requested. A request that changes no
            webhook still applies `allowed_updates`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetWebhookResponse'
        '400':
          description: >-
            The request body cannot be decoded, the parameters are invalid, the URL is not an HTTP
            or HTTPS URL, or the secret token is too long or has characters Telegram does not
            allow. The emulator also rejects `ip_address` and a custom `certificate`, which it
            does not support. A rejected request leaves the webhook unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/deleteWebhook:
    description: >-
      Telegram Bot API method for removing the bot's webhook, as setWebhook does with an empty
      URL. Undelivered updates stay pending unless dropped, and a waiting getUpdates request is not
      interrupted.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteWebhook
      summary: Remove the authenticated virtual bot's webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
      responses:
        '200':
          description: The bot has no webhook, and pending updates were discarded if requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookResponse'
        '400':
          description: The request body cannot be decoded, or the deleteWebhook parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/getWebhookInfo:
    description: >-
      Telegram Bot API method for reading the bot's webhook, its pending updates, and the latest
      failure to deliver to it, which a test can read to find why a bot's webhook rejects updates.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getWebhookInfo
      summary: Return the authenticated virtual bot's webhook status
      responses:
        '200':
          description: The webhook status; a bot without a webhook has an empty URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookInfoResponse'
        '400':
          description: The request body cannot be decoded, or getWebhookInfo received a parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/sendMessage:
    description: >-
      Telegram Bot API method for sending a text message. The emulator supports text sent to a
      private chat with an account that has written to the bot, formatted with `parse_mode` or
      `entities`, optionally as a reply to a message of the chat, protected from forwarding and
      saving, and with reply markup: an inline keyboard of callback, URL, copy-text, switch-inline
      and disabled buttons, a reply keyboard of text buttons, a reply keyboard removal, or a forced
      reply. As on Telegram, the
      message a bot receives in the response never shows reply markup other than an inline
      keyboard; a test reads the reply interface the account's client shows instead. Link preview
      options are validated and have no effect, because the emulator generates no link previews.
      `disable_notification` makes the recipients' notifications silent, which tests read from the
      chat's notifications. As on Telegram, the text and
      its entities are normalized before the message is stored, and the bot receives no update
      for its own message.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendMessage
      summary: Send text from the authenticated virtual bot to an account or a supergroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: >-
            The message was stored in the private conversation or supergroup. No bot receives an
            update for a bot's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the text is empty (`Bad Request: message text is empty`);
            the text or its formatting cannot be read (for example `Bad Request: unsupported
            parse_mode`, `Bad Request: can't parse entities: …`, or `Bad Request: can't parse
            MessageEntity: …`); `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is
            neither a private chat with an account that has written to the bot nor a supergroup the
            bot is or was a member of (`Bad Request: chat not found`); the replied message is not a
            message of the chat, for example because it was deleted, and sending without a reply is
            not allowed (`Bad Request: message to be replied not found`); a message effect is
            requested for a supergroup (`Bad Request: can't use message effects in the chat`); the
            text and its entities cannot be normalized (for example `Bad Request: text must be
            non-empty`, `Bad Request: entity URL '…' is invalid: …`, or `Bad Request: user not
            found`); the normalized text is longer than 4096 characters (`Bad Request: message is
            too long`); or a button's callback data exceeds 64 bytes (`Bad Request:
            BUTTON_DATA_INVALID`). A reply to a message of another chat is checked before all of
            these, while Telegram checks the text and the chat first: the replied message's chat is
            not one the bot can read (`Bad Request: chat not found`, or the membership errors of
            a supergroup the bot left or was removed from), or the replied message is not found
            and sending without a reply is not allowed (`Bad Request: message to be replied not
            found`). A chosen quote that is not an exact part of the replied message fails last,
            as Telegram's servers check it (`Bad Request: QUOTE_TEXT_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), which, as on
            Telegram, is checked after every check that answers 400; or the bot left the supergroup
            (`Forbidden: bot is not a member of the supergroup chat`) or was removed from it
            (`Forbidden: bot was kicked from the supergroup chat`), which is checked in place of
            the chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/files/{fileUniqueId}:
    description: >-
      The content of a photo or document of the session's messages, addressed by its
      `file_unique_id`, which, unlike `file_id`, is the same for every user.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/FileUniqueId'
    get:
      operationId: downloadFile
      summary: Return a file's content by its unique identifier
      responses:
        '200':
          description: >-
            The file's content, as it was sent, with its document's MIME type or its photo's
            image type.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: The session or the file does not exist.
  /sessions/{sessionId}/bot-api/bot{token}/sendPhoto:
    description: >-
      Telegram Bot API method for sending a photo with an optional caption. The photo is a file
      uploaded with the request, or a photo the bot knows by its `file_id`, which, as on Telegram,
      is the bot's own. The emulator reads the dimensions of JPEG, PNG, GIF, WebP, and BMP images
      and keeps the photo in the one size and format it was sent in, whereas Telegram converts a
      photo to JPEG in several sizes and accepts other image formats too. Files sent by URL are not
      supported. The caption is read, formatted, and normalized as `sendMessage` reads text, and
      the other parameters work as for `sendMessage`.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendPhoto
      summary: Send a photo from the authenticated virtual bot to an account or a supergroup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendPhotoRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhotoRequest'
      responses:
        '200':
          description: >-
            The photo was stored in the private conversation or supergroup. No bot receives an
            update for a bot's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the request names no uploaded file and no `file_id` (`Bad
            Request: there is no photo in the request`); the caption or its formatting cannot be
            read, as for `sendMessage`; `chat_id` is missing (`Bad Request: chat_id is empty`); the
            uploaded file is empty (`Bad Request: file must be non-empty`), is not an image
            (`Bad Request: IMAGE_PROCESS_FAILED`), or has dimensions Telegram refuses (`Bad
            Request: PHOTO_INVALID_DIMENSIONS`); the `file_id` identifies no file the bot knows
            (`Bad Request: wrong file identifier/HTTP URL specified`) or identifies a document
            (`Bad Request: can't use file of type Document as Photo`); then the checks of
            `sendMessage` from the chat on, with a caption longer than 1024 characters rejected
            (`Bad Request: message caption is too long`). Telegram checks the chat before the file.
            Files sent by URL are not supported (`Bad Request: sending files by URL is not
            supported`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
            the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
            from it (`Forbidden: bot was kicked from the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/sendDocument:
    description: >-
      Telegram Bot API method for sending a file as a document with an optional caption, as
      `sendPhoto` sends a photo. The Bot API server cleans the name of an uploaded file, and the
      name's extension decides the document's MIME type. Telegram sends some files, such as videos
      and GIF animations, as other media unless `disable_content_type_detection` is set; the
      emulator always sends a document. Document thumbnails are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendDocument
      summary: Send a document from the authenticated virtual bot to an account or a supergroup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
      responses:
        '200':
          description: >-
            The document was stored in the private conversation or supergroup. No bot receives an
            update for a bot's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it for the reasons `sendPhoto` gives, apart from those about images: the request names
            no file (`Bad Request: there is no document in the request`), the uploaded file is
            empty, or the `file_id` identifies no file the bot knows or identifies a photo (`Bad
            Request: can't use file of type Photo as Document`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
            the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
            from it (`Forbidden: bot was kicked from the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/forwardMessage:
    description: >-
      Telegram Bot API method for forwarding a message of one of the bot's chats, a private chat
      with an account that has written to it or a supergroup it is a member of, to another such
      chat. As TDLib does, the forward repeats the message's content and the bot through whose
      inline mode it was sent, and shows who first sent it and when in `forward_origin` and the
      legacy `forward_from` and `forward_date`; a forward of a forward shows the original's origin.
      As TDLib's `hide_sender_if_needed` does, the origin of an account created with
      `has_private_forwards` is a hidden user that shows only the account's name, also in the legacy
      `forward_sender_name`. As TDLib's `dup_reply_markup` does, it keeps the inline keyboard only
      when every button works away from the original message: URL, copy-text and disabled buttons,
      and the switch-inline buttons of a message sent through an inline bot, which then let the user
      choose any chat. As on Telegram, a forward cannot be edited and the bot receives no update for it. Topics, paid
      broadcasts, suggested posts, and video start timestamps are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: forwardMessage
      summary: Forward a message from one of the authenticated virtual bot's chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForwardMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForwardMessageRequest'
      responses:
        '200':
          description: The forward was stored in the chat it was sent to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `from_chat_id` is missing (`Bad Request: parameter
            "from_chat_id" is required`); `chat_id` is missing (`Bad Request: chat_id is empty`),
            which Telegram checks after the forwarded message; the chat of the forwarded message is
            unknown to the bot (`Bad Request: chat not found`); `message_id` is missing or
            identifies no message of that chat (`Bad Request: message to forward not found`); the
            message's sender protected it, or it is a service message (`Bad Request: the message
            can't be forwarded`), which Telegram checks after the chat the forward goes to; or that
            chat is unknown to the bot (`Bad Request: chat not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The bot left a supergroup of the request (`Forbidden: bot is not a member of the
            supergroup chat`) or was removed from it (`Forbidden: bot was kicked from the
            supergroup chat`), which is checked in place of that chat; or the account the forward
            goes to blocks the bot (`Forbidden: bot was blocked by the user`), which is checked
            last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/copyMessage:
    description: >-
      Telegram Bot API method for copying a message of one of the bot's chats to a private chat
      or a supergroup, as `forwardMessage` addresses them. The copy is the bot's own message: it
      repeats the content but, unlike a forward, shows neither where it came from nor the bot the
      original was sent through, and takes its reply and reply markup from the request. A
      `caption`, even an empty one, replaces the caption of a photo or document, formatted and
      normalized as by `sendPhoto`, with `show_caption_above_media` for a photo; text stays as it
      is. As TDLib lets bots do, a bot may copy a message whose sender protected it. The bot
      receives no update for the copy. Topics, paid broadcasts, suggested posts, and video start
      timestamps are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: copyMessage
      summary: Copy a message from one of the authenticated virtual bot's chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopyMessageRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopyMessageRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: >-
            The copy was stored in the chat it was sent to. As on Telegram, the response holds only
            the copy's message ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageIdResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `from_chat_id` is missing (`Bad Request: parameter
            "from_chat_id" is required`); the new caption or its formatting cannot be read, as for
            `sendPhoto`; `chat_id` is missing (`Bad Request: chat_id is empty`), which Telegram
            checks after the copied message; the chat of the copied message is unknown to the bot
            (`Bad Request: chat not found`); `message_id` is missing or identifies no message of
            that chat (`Bad Request: message to copy not found`); the message is a service message
            (`Bad Request: the message can't be copied`), which Telegram checks after the rest of
            the request; or the request fails as `sendPhoto` does for the chat the copy goes to,
            its reply, the new caption, or the reply markup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: As for `forwardMessage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/forwardMessages:
    description: >-
      Telegram Bot API method for forwarding up to 100 messages of one of the bot's chats at once,
      each as `forwardMessage` forwards it, to a chat that `forwardMessage` can address. As TDLib
      does, identifiers of no message are skipped, as are messages that cannot be forwarded, and a
      message that replies to an earlier message of the request replies to that message's forward.
      Topics, paid broadcasts, and suggested posts are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: forwardMessages
      summary: Forward several messages from one of the authenticated virtual bot's chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardMessagesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForwardMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForwardMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
      responses:
        '200':
          description: >-
            The forwards were stored in the chat they were sent to. As on Telegram, the response
            holds only their message IDs, in the order of the forwarded messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageIdsResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `from_chat_id` is missing (`Bad Request: parameter
            "from_chat_id" is required`); `message_ids` is missing or empty (`Bad Request: message
            identifiers are not specified`); it has more than 100 identifiers (`Bad Request: too
            many message identifiers specified`); an identifier is not positive (`Bad Request:
            invalid message identifier specified`); `chat_id` is missing (`Bad Request: chat_id is
            empty`); the chat of the forwarded messages is unknown to the bot (`Bad Request: chat
            not found`); no identifier identifies a message of that chat (`Bad Request: there are
            no messages to forward`); a message effect is requested for a supergroup (`Bad Request:
            can't use message effects in the chat`) or for more than one found message (`Bad
            Request: can't use message effects in the method`); the identifiers of its messages do
            not increase (`Bad Request: message identifiers must be in a strictly increasing
            order`); none of its messages can be forwarded (`Bad Request: messages can't be
            forwarded`); or the chat the forwards go to is unknown to the bot (`Bad Request: chat
            not found`). Telegram checks the chat the forwards go to before the forwarded
            messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: As for `forwardMessage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/copyMessages:
    description: >-
      Telegram Bot API method for copying up to 100 messages of one of the bot's chats at once, as
      `forwardMessages` forwards them. Each copy repeats its message's content as `copyMessage`
      does; as TDLib does for copies of several messages, the copies keep no reply markup, and
      `remove_caption` sends photos and documents without their captions. As TDLib lets bots do,
      a bot may copy messages whose sender protected them. Topics, paid broadcasts, and suggested
      posts are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: copyMessages
      summary: Copy several messages from one of the authenticated virtual bot's chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyMessagesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CopyMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CopyMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
      responses:
        '200':
          description: >-
            The copies were stored in the chat they were sent to. As on Telegram, the response
            holds only their message IDs, in the order of the copied messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageIdsResponse'
        '400':
          description: >-
            As for `forwardMessages`, whose descriptions Telegram uses for copies too. Only service
            messages cannot be copied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: As for `forwardMessage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/editMessageCaption:
    description: >-
      Telegram Bot API method for editing the caption of a photo or document the bot sent to a
      private chat or a supergroup; an empty caption removes it. The caption is formatted and
      normalized as by `sendPhoto`, `show_caption_above_media` applies only to photos, and, as on
      Telegram, the edited message keeps only the inline keyboard given in `reply_markup` and the
      bot receives no update for its own edit. The edit date changes only when the caption, its
      entities, or where it shows do. Without `chat_id` and `message_id`, the method edits a
      message an account sent through the bot's inline mode, which `inline_message_id` identifies,
      as `editMessageText` does.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageCaption
      summary: Edit the caption of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageCaptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageCaptionRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageCaptionRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: >-
            The message was edited: the edited message for a message of a chat, or `true` for an
            inline message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditMessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it for the reasons `editMessageText` gives, with the caption in place of the text: the
            caption or its formatting cannot be read or normalized, the message is a text message
            (`Bad Request: there is no caption in the message to edit`), or the caption is longer
            than 1024 characters (`Bad Request: message caption is too long`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The chat is a supergroup that the bot left the supergroup (`Forbidden: bot is not a
            member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/getFile:
    description: >-
      Telegram Bot API method for preparing a file the bot knows by its `file_id` for download.
      The result's `file_path` addresses the file under the session's Bot API file route, as
      `https://api.telegram.org/file/bot<token>/<file_path>` does on Telegram; the path stays valid
      for the whole session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getFile
      summary: Return a file the authenticated virtual bot knows, with its download path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetFileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetFileRequest'
      responses:
        '200':
          description: The file with its download path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, `file_id` is missing
            (`Bad Request: file_id not specified`), no file the bot knows has that `file_id` (`Bad
            Request: invalid file_id`), or the file is larger than 20 MB (`Bad Request: file is too
            big`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/file/bot{token}/{fileDirectory}/{fileName}:
    description: >-
      Where a bot downloads a file whose `file_path`, `<fileDirectory>/<fileName>`, getFile
      returned, as Telegram serves files at `https://api.telegram.org/file/bot<token>/<file_path>`.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/FileDirectory'
      - $ref: '#/components/parameters/FileName'
    get:
      operationId: downloadBotFile
      summary: Download a file the authenticated virtual bot prepared with getFile
      responses:
        '200':
          description: >-
            The file's content, as it was sent, with its document's MIME type or its photo's
            image type.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: >-
            No active test session has the supplied identifier, or no bot of the session owns the
            token or has the file path (`Not Found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
  /sessions/{sessionId}/bot-api/bot{token}/editMessageText:
    description: >-
      Telegram Bot API method for editing the text of a message the bot sent to a private chat or a
      supergroup, or that an account sent there through the bot's inline mode. As on Telegram, the text is formatted and normalized as by `sendMessage`, the edited message
      keeps only the inline keyboard given in `reply_markup`, and the bot receives no update for
      its own edit. The edit date changes only when the text or its entities do. Without `chat_id`
      and `message_id`, the method edits a message an account sent through the bot's inline mode,
      which `inline_message_id` identifies, whether or not the bot is a member of its chat, and
      answers `true` rather than the message. As an account's message, the edited inline message
      reaches the chat's bots that received it as an edited_message update.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageText
      summary: Edit the text of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: >-
            The message was edited: the edited message for a message of a chat, or `true` for an
            inline message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditMessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the text is empty (`Bad Request: message text is empty`);
            the text or its formatting cannot be read, as for `sendMessage`; neither `chat_id` nor
            a positive `message_id` is given, and no `inline_message_id` either (`Bad Request:
            message identifier is not specified`); `inline_message_id` identifies no message sent
            through the bot's inline mode, including a deleted one or another bot's (`Bad Request:
            MESSAGE_ID_INVALID`); `chat_id` is missing (`Bad Request: chat_id is empty`); the chat
            is not one the bot can
            address, as for `sendMessage` (`Bad Request: chat not found`); the chat has no message
            with that ID (`Bad Request: message to edit not found`); as in TDLib, the bot may not
            edit the message, because another user wrote it and it was not sent through the bot's
            inline mode, another bot's inline mode sent it, it is a forward, or it carries a reply
            keyboard, a forced reply, or a keyboard removal (`Bad Request: message can't be
            edited`); the message is a photo or document (`Bad
            Request: there is no text in the message to edit`); the text and its entities
            cannot be normalized, as for `sendMessage`; the normalized text is longer than 4096
            characters (`Bad Request: message is too long`); a button's callback data exceeds 64
            bytes (`Bad Request: BUTTON_DATA_INVALID`); or the text, entities, and keyboard are
            unchanged (`Bad Request: message is not modified: specified new message content and
            reply markup are exactly the same as a current content and reply markup of the
            message`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The chat is a supergroup that the bot left the supergroup (`Forbidden: bot is not a
            member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/editMessageReplyMarkup:
    description: >-
      Telegram Bot API method for replacing the inline keyboard of a message the bot sent to a
      private chat or a supergroup. Omitting `reply_markup` removes the keyboard. The content and edit
      date are unchanged, and the bot receives no update for its own edit. Without `chat_id` and
      `message_id`, the method edits a message an account sent through the bot's inline mode, which
      `inline_message_id` identifies, as `editMessageText` does.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageReplyMarkup
      summary: Replace the inline keyboard of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageReplyMarkupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageReplyMarkupRequest'
            encoding:
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageReplyMarkupRequest'
            encoding:
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: >-
            The message's keyboard was replaced: the edited message for a message of a chat, or
            `true` for an inline message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditMessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it for the reasons editMessageText gives, apart from those about the text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The chat is a supergroup that the bot left the supergroup (`Forbidden: bot is not a
            member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/deleteMessage:
    description: >-
      Telegram Bot API method for deleting a message of a private chat or a supergroup for every
      member. As on Telegram, a bot can delete messages either participant of a private chat
      wrote; in a supergroup, it deletes its own messages, and any message, service messages
      included, as an administrator with the `can_delete_messages` right. It receives no update
      for the deletion. The deleted message leaves the conversation history, and its buttons can no
      longer be pressed; message IDs are never reused. The emulator does not age messages, so
      Telegram's 48-hour deletion limit never applies.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteMessage
      summary: Delete a message of one of the authenticated virtual bot's chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
      responses:
        '200':
          description: The message was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeletionResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `chat_id` is missing (`Bad Request: chat_id is empty`);
            the chat is not one the bot can address, as for `sendMessage` (`Bad Request: chat not
            found`); `message_id` identifies another member's message of a supergroup (`Bad
            Request: message can't be deleted`); or `message_id` is missing, not positive, or
            identifies no message of the chat, including a deleted one (`Bad Request: message to
            delete not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The chat is a supergroup that the bot left the supergroup (`Forbidden: bot is not a
            member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/deleteMessages:
    description: >-
      Telegram Bot API method for deleting several messages of a chat at once, as deleteMessage
      deletes one. As on Telegram, identifiers that identify no message of the chat are skipped,
      and none is deleted when one identifies a message the bot cannot delete.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteMessages
      summary: Delete several messages of one of the authenticated virtual bot's chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessagesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
      responses:
        '200':
          description: The messages that the identifiers found were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeletionResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `message_ids` is missing (`Bad Request: message
            identifiers are not specified`); it has more than 100 identifiers (`Bad Request: too
            many message identifiers specified`); an identifier is not positive (`Bad Request:
            invalid message identifier specified`); `chat_id` is missing (`Bad Request: chat_id is
            empty`); the chat is not one the bot can address, as for `sendMessage` (`Bad Request:
            chat not found`); or an identifier identifies another member's message of a supergroup
            (`Bad Request: message can't be deleted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The chat is a supergroup that the bot left the supergroup (`Forbidden: bot is not a
            member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/answerCallbackQuery:
    description: >-
      Telegram Bot API method for answering a callback query the bot received. The account that
      pressed the button can read the answer from its callback query, including a URL for its
      client to open.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: answerCallbackQuery
      summary: Answer a callback query sent to the authenticated virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCallbackQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerCallbackQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerCallbackQueryRequest'
      responses:
        '200':
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCallbackQueryResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or the callback query
            does not exist, was sent to another bot, is already answered, or has expired (`Bad
            Request: query is too old and response timeout expired or query ID is invalid`), or
            the URL does not start the bot (`Bad Request: URL_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/answerInlineQuery:
    description: >-
      Telegram Bot API method for answering an inline query an account sent to the bot, once, with
      up to 50 results that the account's client lists and sends. Article results, and photo and
      document results with files the bot knows by `file_id`, are supported. Results of other
      types (`Bad Request: inline query results of type "<type>" are not supported`), files given
      by URL (`Bad Request: sending files by URL is not supported`), and `input_message_content`
      of a location, venue, contact, invoice, or rich message (`Bad Request: inline query results
      sending a location, venue, contact, invoice, or rich message are not supported`) are
      rejected with these emulator errors. Thumbnails, and the dimensions of
      a photo, are validated and ignored. Text and captions are read and normalized as by
      `sendMessage` and `sendPhoto`. The older `switch_pm_text` and `switch_pm_parameter`
      parameters form the `button` when it is omitted.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: answerInlineQuery
      summary: Answer an inline query sent to the authenticated virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInlineQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerInlineQueryRequest'
            encoding:
              results:
                contentType: application/json
              button:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerInlineQueryRequest'
            encoding:
              results:
                contentType: application/json
              button:
                contentType: application/json
      responses:
        '200':
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it. The Bot API server reads the results first: a result of an unknown type (`Bad
            Request: can't parse InlineQueryResult: type "<type>" is unsupported for the inline
            query result`), an article without message text (`Bad Request: can't parse
            InlineQueryResult: Input message content is not specified`), or text or formatting it
            cannot read, described as for `sendMessage` after `Bad Request: can't parse
            InlineQueryResult: `. Every result's file is then resolved: a `file_id` the bot does
            not know (`Bad Request: wrong remote file identifier specified: can't unserialize it`)
            or of another file type (`Bad Request: can't use file of type Document as Photo`).
            TDLib then checks the button's `start_parameter` for being empty (`Bad Request: can't
            use empty start_parameter`), longer than 64 characters (`Bad Request: too long
            start_parameter specified`), or holding characters other than letters, digits, `_`,
            and `-` (`Bad Request: unallowed characters in start_parameter are used`); more than
            50 results (`Bad Request: too many inline query results specified`); and each
            result's message content as when sending it, where normalized text longer than 4096
            characters fails with `Bad Request: MESSAGE_TOO_LONG` and a caption longer than 1024
            characters with `Bad Request: MEDIA_CAPTION_TOO_LONG`. Telegram's servers finally
            check the query, which must exist, have been sent to this bot, and be unanswered
            (`Bad Request: query is too old and response timeout expired or query ID is
            invalid`); a `next_offset` longer than 64 bytes (`Bad Request: NEXT_OFFSET_INVALID`);
            and each result for an empty identifier (`Bad Request: RESULT_ID_EMPTY`), one longer
            than 64 bytes (`Bad Request: RESULT_ID_INVALID`), a repeated one (`Bad Request:
            RESULT_ID_DUPLICATE`), an empty article title (`Bad Request: ARTICLE_TITLE_EMPTY`), an
            empty document title (`Bad Request: FILE_TITLE_EMPTY`), and callback data longer than
            64 bytes (`Bad Request: BUTTON_DATA_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/sendChatAction:
    description: >-
      Telegram Bot API method for showing a chat action, such as typing, in a private chat with an
      account that has written to the bot or in a supergroup the bot is a member of. Accounts see
      the action through their conversation's `chat-actions` for 5.5 seconds, until the bot
      cancels it or sends a message to the chat. Topics and business connections are not
      supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendChatAction
      summary: Show a chat action from the authenticated virtual bot in one of its chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendChatActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendChatActionRequest'
      responses:
        '200':
          description: The chat action was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the action is missing or unknown (`Bad Request: wrong
            parameter action in request`); `chat_id` is missing (`Bad Request: chat_id is empty`);
            or the chat is not one the bot can address, as for `sendMessage` (`Bad Request: chat
            not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
            the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
            from it (`Forbidden: bot was kicked from the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
        '429':
          $ref: '#/components/responses/BotApiRateLimited'
  /sessions/{sessionId}/bot-api/bot{token}/leaveChat:
    description: >-
      Telegram Bot API method for leaving a supergroup the bot is a member of. The bot receives a
      my_chat_member update, from `member` to `left`, from itself, and then the service message
      from itself that records the change with `left_chat_member`, which, as a service message,
      the supergroup's other bots receive too. The bot's later requests to
      the supergroup fail with `403 Forbidden: bot is not a member of the supergroup chat`.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: leaveChat
      summary: Leave a supergroup as the authenticated virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveChatRequest'
          application/x-www-form-urlencoded:
