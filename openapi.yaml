      responses:
        '200':
          description: The default rights for the kind of chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultAdministratorRightsResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
