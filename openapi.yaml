      Telegram Bot API method for leaving a supergroup the bot is a member of. The bot receives a
      my_chat_member update, from `member` to `left`, from itself, and then the service message
      from itself that records the change with `left_chat_member`; as on Telegram, other bots never
      receive a bot's messages, so they do not learn of the departure. The bot's later requests to
      the supergroup fail with `403 Forbidden: bot is not a member of the supergroup chat`.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
