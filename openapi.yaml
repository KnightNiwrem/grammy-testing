      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/{method}:
    description: Telegram Bot API methods invoked for a virtual bot within a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/BotApiMethod'
components:
  schemas:
    TelegramUserId:
      type: integer
      minimum: 1
      maximum: 1099511627775
    SupergroupChatId:
      type: integer
      minimum: -1997852516352
      maximum: -1000000000001
      description: Bot API chat identifier of a supergroup, which carries Telegram's `-100` prefix.
    Bot:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
        - username
        - can_join_groups
        - can_read_all_group_messages
        - supports_inline_queries
        - can_connect_to_business
        - has_main_web_app
        - has_topics_enabled
        - allows_users_to_create_topics
        - can_manage_bots
        - supports_join_request_queries
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the bot.
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        username:
          type: string
        can_join_groups:
          type: boolean
        can_read_all_group_messages:
          type: boolean
        supports_guest_queries:
          type: boolean
        supports_inline_queries:
          type: boolean
        can_connect_to_business:
          type: boolean
        has_main_web_app:
          type: boolean
        has_topics_enabled:
          type: boolean
        allows_users_to_create_topics:
          type: boolean
        can_manage_bots:
          type: boolean
        supports_join_request_queries:
          type: boolean
    CreateBotRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - username
      properties:
        first_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        can_read_all_group_messages:
          type: boolean
          default: false
          description: >-
            Turns off the bot's privacy mode, as BotFather does, so that it receives every account
            message of its supergroups rather than only those addressed to it.
    CreatedBot:
      type: object
      additionalProperties: false
      required:
        - token
        - bot
      properties:
        token:
          type: string
          description: Emulator-issued token used to call the Bot API as this bot.
        bot:
          $ref: '#/components/schemas/Bot'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the account.
        is_bot:
          type: boolean
          const: false
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        language_code:
          type: string
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        language_code:
          type: string
          minLength: 1
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          $ref: '#/components/schemas/Account'
    PrivateMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - botId
      properties:
        type:
          type: string
          const: private
        botId:
          $ref: '#/components/schemas/TelegramUserId'
    SupergroupMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - chatId
      properties:
        type:
          type: string
          const: supergroup
        chatId:
          $ref: '#/components/schemas/SupergroupChatId'
    MessageTarget:
      description: The account's private chat with a bot, or a supergroup it is a member of.
      oneOf:
        - $ref: '#/components/schemas/PrivateMessageTarget'
        - $ref: '#/components/schemas/SupergroupMessageTarget'
      discriminator:
        propertyName: type
        mapping:
          private: '#/components/schemas/PrivateMessageTarget'
          supergroup: '#/components/schemas/SupergroupMessageTarget'
    CreateSupergroupRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    CreatedSupergroup:
      type: object
      additionalProperties: false
      required:
        - supergroup
      properties:
        supergroup:
          type: object
          additionalProperties: false
          required:
            - id
            - type
            - title
          properties:
            id:
              $ref: '#/components/schemas/SupergroupChatId'
            type:
              type: string
              const: supergroup
            title:
              type: string
            description:
              type: string
    SendAccountMessageRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - text
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Plain text, normalized as a Telegram client does: control characters become spaces,
            carriage returns are removed, and leading and trailing whitespace is trimmed. Text with
            no visible characters is rejected.
        reply_to_message_id:
          type: integer
          minimum: 1
          description: >-
            ID of the chat's message to reply to, as message history shows it. Omit it to send a
            message that replies to none.
    PrivateChat:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        type:
          type: string
          const: private
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    SupergroupChat:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - type
      properties:
        id:
          $ref: '#/components/schemas/SupergroupChatId'
        title:
          type: string
        type:
          type: string
          const: supergroup
    SupergroupTextMessage:
      type: object
      additionalProperties: false
      description: >-
        A supergroup message, which every member sees alike. Its other fields mean what they mean
        for a private message.
      required:
        - message_id
        - from
        - chat
        - date
        - text
      properties:
        message_id:
          type: integer
          minimum: 1
          description: Message ID in the supergroup's own message sequence.
        from:
          description: The member, an account or a bot, that wrote the message.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        date:
          type: integer
          minimum: 0
        edit_date:
          type: integer
          minimum: 0
        reply_to_message:
          $ref: '#/components/schemas/SupergroupTextMessage'
        text:
          type: string
        entities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageEntity'
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
        has_protected_content:
          type: boolean
          const: true
    TextMessage:
      description: A text message of a private chat or a supergroup.
      oneOf:
        - $ref: '#/components/schemas/PrivateTextMessage'
        - $ref: '#/components/schemas/SupergroupTextMessage'
    PrivateTextMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - from
        - chat
        - date
        - text
      properties:
        message_id:
          type: integer
          minimum: 1
          description: >-
            Message ID in the conversation bot's message sequence, which spans all of that bot's
            private chats. Other observers can number the same message differently.
        from:
          description: The account or bot that wrote the message.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/PrivateChat'
          description: The account's private chat, whichever participant wrote the message.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp when the emulator accepted the message.
        edit_date:
          type: integer
          minimum: 0
          description: >-
            Unix timestamp of the last edit of the text by its author, omitted if the text was
            never edited. Replacing only the inline keyboard does not change it.
        reply_to_message:
          $ref: '#/components/schemas/PrivateTextMessage'
          description: >-
            The current state of the message this one replies to, which never has a
            `reply_to_message` of its own. Omitted when the message is no reply or the replied
            message was deleted.
        text:
          type: string
        entities:
          type: array
          minItems: 1
          description: >-
            Entities marked in the text, omitted when there are none: formatting the bot applied,
            and bot commands, which, as Telegram does in chats with bots, the emulator marks in text
            written by either participant. Other entity types Telegram detects, such
            as URLs and mentions, are not detected.
          items:
            $ref: '#/components/schemas/MessageEntity'
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: The inline keyboard the bot attached, omitted when there is none.
        has_protected_content:
          type: boolean
          const: true
          description: >-
            Present when the bot protected the message from forwarding and saving with
            `protect_content`.
    InlineKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - inline_keyboard
      properties:
        inline_keyboard:
          type: array
          description: >-
            Rows of buttons. As a request parameter, an empty array attaches no keyboard, as on
            Telegram; empty rows are rejected.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/InlineKeyboardButton'
    InlineKeyboardButton:
      description: >-
        A button with exactly one action. Telegram also accepts other button types and buttons
        with several actions, using the first action it recognizes; the emulator rejects them.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
            - callback_data
          properties:
            text:
              type: string
              minLength: 1
            callback_data:
              type: string
              minLength: 1
              description: >-
                Data sent to the bot in a callback query, at most 64 bytes when UTF-8 encoded.
        - type: object
          additionalProperties: false
          required:
            - text
            - url
          properties:
            text:
              type: string
              minLength: 1
            url:
              type: string
              format: uri
              description: An absolute URL.
    MessageSenderBot:
      type: object
      additionalProperties: false
      description: A bot as a message sender, without the capabilities that only getMe reports.
      required:
        - id
        - is_bot
        - first_name
        - username
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    MessageEntity:
      type: object
      additionalProperties: false
      description: >-
        A marked span of message text. Formatting that overlaps other entities is split so that
        entities nest properly, as on Telegram.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
          enum:
            - bot_command
            - bold
            - italic
            - underline
            - strikethrough
            - spoiler
            - code
            - pre
            - text_link
            - text_mention
            - custom_emoji
            - blockquote
            - expandable_blockquote
        offset:
          type: integer
          minimum: 0
          description: Offset in UTF-16 code units to the start of the entity.
        length:
          type: integer
          minimum: 1
          description: Length of the entity in UTF-16 code units.
        language:
          type: string
          description: For `pre`, the programming language of the code, when one is given.
        url:
          type: string
          description: For `text_link`, the link as Telegram normalized it.
        user:
          description: For `text_mention`, the mentioned user.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        custom_emoji_id:
          type: string
          description: For `custom_emoji`, the custom emoji's identifier.
    MessageEntityParameter:
      type: object
      additionalProperties: false
      description: >-
        An entity a bot specifies, as a Bot API `MessageEntity`. Types that Telegram detects by
        itself (`mention`, `hashtag`, `cashtag`, `bot_command`, `url`, `email`, `phone_number`,
        and `bank_card_number`) are accepted and ignored, so entities of a received message can be
        sent back. `date_time` entities are not supported. Telegram reads numbers written as
        strings; the emulator rejects them.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
        offset:
          type: integer
        length:
          type: integer
        language:
          type: string
        url:
          type: string
          description: For `text_link`; a `tg://user?id=` link makes a text mention.
        user:
          type: object
          description: For `text_mention`; only its `id` is read, and it must be a session user.
          required:
            - id
          properties:
            id:
              type: integer
        custom_emoji_id:
          type: string
    ParseMode:
      type: string
      description: >-
        Markup to read the text as, matched case-insensitively: `HTML`, `MarkdownV2`, or the
        legacy `Markdown`, parsed as Telegram does. `none` or omitting it leaves the text as it is.
        Date and time markup (`<tg-time>` or a `tg://time` link) is not supported.
    SentMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/PrivateTextMessage'
    MessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PrivateTextMessage'
    SentSupergroupMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/SupergroupTextMessage'
    SupergroupMessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SupergroupTextMessage'
    MessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - message
      properties:
        update_id:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/TextMessage'
    EditedMessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - edited_message
      properties:
        update_id:
          type: integer
          minimum: 1
        edited_message:
          $ref: '#/components/schemas/TextMessage'
          description: >-
            An account's message as its edit left it. A bot receives no update for bots' edits.
    MyChatMemberUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - my_chat_member
      properties:
        update_id:
          type: integer
          minimum: 1
        my_chat_member:
          oneOf:
            - $ref: '#/components/schemas/PrivateChatMemberUpdated'
            - $ref: '#/components/schemas/SupergroupChatMemberUpdated'
    PrivateChatMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        A change of the bot's membership in an account's private chat: `member` becomes `kicked`
        when the account blocks the bot, and `kicked` becomes `member` when it unblocks the bot.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/PrivateChat'
        from:
          $ref: '#/components/schemas/Account'
          description: The account that blocked or unblocked the bot.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/PrivateChatBotMember'
        new_chat_member:
          $ref: '#/components/schemas/PrivateChatBotMember'
    SupergroupChatMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        The bot's addition to a supergroup: `left` becomes `member` when an account adds the bot.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        from:
          $ref: '#/components/schemas/Account'
          description: The account that added the bot.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/SupergroupBotMember'
        new_chat_member:
          $ref: '#/components/schemas/SupergroupBotMember'
    SupergroupBotMember:
      type: object
      additionalProperties: false
      required:
        - user
        - status
      properties:
        user:
          $ref: '#/components/schemas/MessageSenderBot'
        status:
          type: string
          enum:
            - left
            - member
    PrivateChatBotMember:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - user
            - status
          properties:
            user:
              $ref: '#/components/schemas/MessageSenderBot'
            status:
              type: string
              const: member
        - type: object
          additionalProperties: false
          description: The bot while the account blocks it, which Telegram shows as banned forever.
          required:
            - user
            - status
            - until_date
          properties:
            user:
              $ref: '#/components/schemas/MessageSenderBot'
            status:
              type: string
              const: kicked
            until_date:
              type: integer
              const: 0
    CallbackQueryUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - callback_query
      properties:
        update_id:
          type: integer
          minimum: 1
        callback_query:
          $ref: '#/components/schemas/BotApiCallbackQuery'
    BotApiCallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - from
        - message
        - chat_instance
        - data
      properties:
        id:
          type: string
          description: Identifier to pass to answerCallbackQuery.
        from:
          $ref: '#/components/schemas/Account'
          description: The account that pressed the button.
        message:
          $ref: '#/components/schemas/TextMessage'
          description: The message carrying the button, as it was when the button was pressed.
        chat_instance:
          type: string
          description: >-
            Opaque signed 64-bit decimal identifying the message's chat, fixed for each private
            chat and each supergroup.
        data:
          type: string
          description: The pressed button's callback data.
    GetUpdatesRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          description: >-
            Identifier of the first update to return; earlier updates are confirmed and
            forgotten. A negative offset returns that many updates from the end of the queue and
            forgets the rest. As on Telegram, an offset more than 10 beyond the identifier the next
            update will receive is ignored, so a stale offset does not discard pending updates.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        timeout:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
        allowed_updates:
          description: >-
            Update types the bot subscribes to, matched case-insensitively. The subscription
            persists until a later request supplies this parameter and applies only to updates
            created afterward. Unrecognized names are ignored; a list with no recognized name
            selects Telegram's default, which excludes chat_member, message_reaction, and
            message_reaction_count.
          type: array
          items:
            type: string
    DeleteWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        drop_pending_updates:
          type: boolean
          default: false
          description: >-
            Discards the bot's pending updates; later updates continue its update ID sequence. As
            on Telegram, text values `true`, `yes`, and `1` are true, compared case-insensitively;
            the emulator also accepts `false`, `no`, and `0`, and rejects any other text.
    DeleteWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
        - description
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
        description:
          type: string
          const: Webhook is already deleted
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - text
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID. Telegram's `@username` form is not accepted, because Telegram
            resolves it only for bots and public supergroups and channels.
        text:
          type: string
          minLength: 1
          description: >-
            Message text, at most 32768 bytes before formatting is applied and 4096 characters
            after. As on Telegram, control characters become spaces, carriage returns are removed,
            and leading and trailing whitespace is trimmed, but leading whitespace only up to the
            first entity.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
        disable_notification:
          type: boolean
          description: Validated and without effect, because notifications are not modeled.
        protect_content:
          type: boolean
          default: false
          description: >-
            Protects the message from forwarding and saving, which its `has_protected_content`
            shows.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: >-
            The older form of `reply_parameters.message_id`, which Telegram still accepts; ignored
            when `reply_parameters` is given.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: >-
            The older form of `reply_parameters.allow_sending_without_reply`; ignored when
            `reply_parameters` is given.
        reply_markup:
          description: >-
            An inline keyboard to attach, or, in a private chat, a change of the reply interface
            the account's client shows. Markup that combines kinds is rejected. `selective` is
            accepted and, as on Telegram in private chats, has no effect.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    ReplyKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - keyboard
      properties:
        keyboard:
          type: array
          description: >-
            Rows of buttons. As on Telegram, an empty array sends no reply markup; empty rows are
            rejected.
          items:
            type: array
            minItems: 1
            items:
              description: >-
                A text button, written as its text or as an object. Buttons that request a
                contact, location, poll, users, chat, or web app are not supported.
              oneOf:
                - type: string
                  minLength: 1
                - $ref: '#/components/schemas/ReplyKeyboardButton'
        is_persistent:
          type: boolean
          default: false
        resize_keyboard:
          type: boolean
          default: false
        one_time_keyboard:
          type: boolean
          default: false
        input_field_placeholder:
          type: string
          minLength: 1
          maxLength: 64
        selective:
          type: boolean
    ReplyKeyboardButton:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
    ReplyKeyboardRemove:
      type: object
      additionalProperties: false
      required:
        - remove_keyboard
      properties:
        remove_keyboard:
          type: boolean
          const: true
        selective:
          type: boolean
    ForceReply:
      type: object
      additionalProperties: false
      required:
        - force_reply
      properties:
        force_reply:
          type: boolean
          const: true
        input_field_placeholder:
          type: string
          minLength: 1
          maxLength: 64
        selective:
          type: boolean
    AccountReplyInterface:
      type: object
      additionalProperties: false
      required:
        - reply_interface
      properties:
        reply_interface:
          oneOf:
            - $ref: '#/components/schemas/ReplyKeyboardInterface'
            - $ref: '#/components/schemas/ForceReplyInterface'
            - type: 'null'
    ReplyKeyboardInterface:
      type: object
      additionalProperties: false
      required:
        - type
        - message_id
        - keyboard
        - is_persistent
        - resize_keyboard
        - one_time_keyboard
      properties:
        type:
          type: string
          const: keyboard
        message_id:
          type: integer
          minimum: 1
          description: The ID of the bot message that sent the keyboard, as the bot sees it.
        keyboard:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/ReplyKeyboardButton'
        is_persistent:
          type: boolean
        resize_keyboard:
          type: boolean
        one_time_keyboard:
          type: boolean
          description: >-
            Whether clients hide the keyboard once it is used. The keyboard stays available, so
            its buttons can still be pressed.
        input_field_placeholder:
          type: string
    ForceReplyInterface:
      type: object
      additionalProperties: false
      required:
        - type
        - message_id
      properties:
        type:
          type: string
          const: force_reply
        message_id:
          type: integer
          minimum: 1
          description: >-
            The ID of the bot message the client shows a reply interface to, as the bot sees it.
        input_field_placeholder:
          type: string
    EditAccountMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            The new plain text, normalized as when sending a message. It must differ from the
            message's current text after normalization.
    PressReplyKeyboardButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - text
      properties:
        chat:
          $ref: '#/components/schemas/PrivateMessageTarget'
        text:
          type: string
          minLength: 1
          description: The text of the button to press.
    ReplyParameters:
      type: object
      additionalProperties: false
      description: >-
        The message of the chat to reply to. An empty object, or a `message_id` that is not
        positive, specifies no reply. Quotes, checklist tasks, and poll options are not supported.
      properties:
        message_id:
          type: integer
          description: Identifier of the replied message in the bot's chat.
        chat_id:
          type: integer
          description: >-
            Identifier of the replied message's chat, which must be the chat the message is sent
            to; replies to messages of other chats are not supported.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: >-
            Sends the message as no reply, instead of failing, when the replied message is not
            found.
    LinkPreviewOptions:
      type: object
      additionalProperties: false
      description: >-
        Telegram's link preview options, validated and without effect, because the emulator
        generates no link previews.
      properties:
        is_disabled:
          type: boolean
        url:
          type: string
        prefer_small_media:
          type: boolean
        prefer_large_media:
          type: boolean
        show_above_text:
          type: boolean
    EditMessageTextRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
        - text
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        text:
          type: string
          minLength: 1
          description: New message text, read and normalized as by `sendMessage`.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the edited message shows; omitting it removes the keyboard.
    EditMessageReplyMarkupRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the message shows; omitting it removes the keyboard.
    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/TextMessage'
    DeleteMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
    DeleteMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_ids
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_ids:
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 1
          description: Identifiers of the messages in the bot's chat.
    MessageDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AnswerCallbackQueryRequest:
      type: object
      additionalProperties: false
      required:
        - callback_query_id
      properties:
        callback_query_id:
          type: string
        text:
          type: string
          maxLength: 200
          description: Notification text; omitted or empty text shows no notification.
        show_alert:
          type: boolean
          default: false
          description: Shows the text as an alert instead of a transient notification.
        cache_time:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 0
          description: Seconds for which the account's client may reuse the answer.
    AnswerCallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    SendChatActionRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - action
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        action:
          type: string
          description: >-
            The action, matched case-insensitively. Telegram's older names `record_audio`,
            `upload_audio`, and `pick_up_location` are accepted too.
          enum:
            - typing
            - upload_photo
            - record_video
            - upload_video
            - record_voice
            - upload_voice
            - upload_document
            - choose_sticker
            - find_location
            - record_video_note
            - upload_video_note
            - cancel
    BotCommand:
      type: object
      additionalProperties: false
      required:
        - command
        - description
      properties:
        command:
          type: string
          description: >-
            The command, 1-32 lowercase English letters, digits, and underscores. As a request
            parameter, a leading slash and surrounding whitespace are removed first.
        description:
          type: string
          description: The description, 1-256 characters after surrounding whitespace is removed.
        is_ephemeral:
          type: boolean
          description: Telegram's ephemeral command flag, stored as given; omitted when false.
    BotCommandScope:
      type: object
      additionalProperties: false
      description: >-
        The users and chats a command list applies to; a missing scope is the default scope.
        Chat IDs must be numbers, and chat scopes can name only private chats.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - default
            - all_private_chats
            - all_group_chats
            - all_chat_administrators
            - chat
            - chat_administrators
            - chat_member
        chat_id:
          type: integer
          description: Required for `chat`, `chat_administrators`, and `chat_member`.
        user_id:
          type: integer
          minimum: 1
          description: Required for `chat_member`.
    MyCommandsTargetRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the list, or empty for users whose language has
            no dedicated list.
    SetMyCommandsRequest:
      type: object
      additionalProperties: false
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
    BotCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
    TrueResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AccountBotCommands:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - command
              - description
              - is_ephemeral
            properties:
              command:
                type: string
              description:
                type: string
              is_ephemeral:
                type: boolean
    PressCallbackButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - message_id
        - callback_data
      properties:
        chat:
          $ref: '#/components/schemas/MessageTarget'
        message_id:
          type: integer
          minimum: 1
          description: >-
            Identifier of the message carrying the button, as message history shows it, which is
            its identifier in the bot's chat.
        callback_data:
          type: string
          minLength: 1
          description: Callback data of the button to press.
        expired:
          type: boolean
          default: false
          description: >-
            Creates the callback query already expired: the bot still receives it but cannot
            answer it.
    CallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - callback_data
        - status
        - answer
      properties:
        id:
          type: string
          description: Identifier the bot receives in its callback_query update.
        callback_data:
          type: string
        status:
          type: string
          enum:
            - awaiting_answer
            - answered
            - expired
          description: >-
            Whether the bot can still answer the query. A query is created awaiting an answer or
            already expired; the bot's accepted answer moves an awaiting query to answered. An
            answered or expired query accepts no answer.
        answer:
          description: The bot's answer when the status is `answered`, and null otherwise.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - show_alert
                - cache_time
              properties:
                text:
                  type: string
                  description: Notification text, omitted when the answer shows none.
                show_alert:
                  type: boolean
                cache_time:
                  type: integer
                  minimum: 0
    CallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - callback_query
      properties:
        callback_query:
          $ref: '#/components/schemas/CallbackQuery'
    GetUpdatesResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageUpdate'
              - $ref: '#/components/schemas/EditedMessageUpdate'
              - $ref: '#/components/schemas/CallbackQueryUpdate'
              - $ref: '#/components/schemas/MyChatMemberUpdate'
    GetMeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Bot'
    BotApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error_code
        - description
      properties:
        ok:
          type: boolean
          const: false
        error_code:
          type: integer
        description:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - botApiRoot
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier of the test session.
        botApiRoot:
          type: string
          format: uri
          description: Absolute API root for bots operating in this test session.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the test session that owns the addressed state.
      schema:
        type: string
    BotToken:
      name: token
      in: path
      required: true
      description: Token of a virtual bot owned by the addressed test session.
      schema:
        type: string
    BotId:
      name: botId
      in: path
      required: true
      description: Server-assigned identifier of a virtual bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    AccountId:
      name: accountId
      in: path
      required: true
      description: Server-assigned Telegram user identifier for a virtual account.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    MessageId:
      name: messageId
      in: path
      required: true
      description: >-
        ID of a message of the private conversation, as the conversation's bot and message
        history see it.
      schema:
        type: integer
        minimum: 1
    SupergroupChatId:
      name: chatId
      in: path
      required: true
      description: Bot API chat identifier of a supergroup.
      schema:
        $ref: '#/components/schemas/SupergroupChatId'
    SupergroupMessageId:
      name: messageId
      in: path
      required: true
      description: ID of a message of the supergroup, which every member sees alike.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Telegram user identifier of a virtual account or bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    CallbackQueryId:
      name: callbackQueryId
      in: path
      required: true
      description: Identifier of a callback query created by the addressed account.
      schema:
        type: string
    BotApiMethod:
      name: method
      in: path
      required: true
      description: Telegram Bot API method name.
      schema:
        type: string
