openapi: 3.1.1
info:
  title: tg-bot-api-emulator
  version: 0.0.0
  description: >-
    HTTP interface for isolated Telegram Bot API test sessions. Objects marked with
    `x-implementation-status: unimplemented` describe agreed API surface that is not available
    from the server yet. Marked path items without operations record routing topology only.


    Bot API paths follow Telegram's request conventions, so each listed POST operation also
    accepts GET, and method names match case-insensitively. Parameters can be supplied in the
    query string or in an `application/json`, `application/x-www-form-urlencoded`, or
    `multipart/form-data` body; a query-string parameter takes precedence over a body parameter
    of the same name. Any parameter value can be sent as text, with array parameters such as
    `allowed_updates` as JSON text. Methods that send a file read it from a `multipart/form-data`
    part with a file name: the part named after the file parameter, or the part that the
    parameter names as `attach://<part name>`. Telegram tolerates unknown parameters, malformed values, and
    bodies it cannot decode; the emulator rejects them with a `400` Bot API error so that tests
    surface the mistake.


    As on Telegram, a method the emulator does not implement is answered, after the token is
    authenticated, with a `404` Bot API error described as `Not Found: method not found`. A path
    under a session's Bot API root that does not name both a bot token and a method is answered
    with a `404` Bot API error described as `Not Found`, before any token is checked.


    The server is meant to run inside a test environment, such as CI, rather than as a public
    service, so admin routes require no credentials; each test session isolates its own state. Bot
    API routes authenticate the bot token in their path, as Telegram does, and answer a token that
    no bot of the session owns with a `401` Bot API error. OpenAPI security schemes cannot describe
    a credential in the path, so no operation declares one.
  license:
    name: CC0 1.0 Universal
    identifier: CC0-1.0
security: []
servers:
  - url: http://{domain}:{port}
    variables:
      domain:
        default: localhost
        description: Domain advertised to clients.
      port:
        default: '8081'
        description: Port on which the standalone server listens.
paths:
  /sessions:
    description: Collection of isolated Telegram test sessions.
    post:
      operationId: createSession
      summary: Create an isolated test session
      responses:
        '201':
          description: The test session was created.
          headers:
            Location:
              description: Relative URL of the created test session.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessions/{sessionId}:
    description: One isolated Telegram test session and the lifecycle of everything it owns.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: deleteSession
      summary: End an isolated test session
      description: >-
        Discards the session and all virtual entities and state that it owns. Long polls that its bots
        hold are answered at once without updates.
      responses:
        '204':
          description: The test session and all of its state were discarded.
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bots:
    description: Virtual bots owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createBot
      summary: Create a virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: The virtual bot was created.
          headers:
            Location:
              description: Relative URL of the created virtual bot.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBot'
        '400':
          description: The request body is malformed or does not match the bot creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/bots/{botId}:
    description: One virtual bot owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotId'
  /sessions/{sessionId}/accounts:
    description: Virtual Telegram accounts owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createAccount
      summary: Create a virtual Telegram account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The virtual account was created.
          headers:
            Location:
              description: Relative URL of the created virtual account.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          description: The request body is malformed or does not match the account creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/accounts/{accountId}:
    description: One virtual Telegram account owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
  /sessions/{sessionId}/accounts/{accountId}/messages:
    description: Messages sent by one virtual account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: sendAccountMessage
      summary: Send a message as a virtual account
      description: >-
        Sends text, a photo, or a document to the account's private chat with a bot, or to a
        supergroup the account is a member of. In a supergroup, the supergroup's bots receive the
        message unless it is not addressed to a bot in privacy mode: such a bot receives only
        messages whose text or caption starts with a command not addressed to another bot, replies
        to one of its messages, or mentions it. As on Telegram, a bot that is an administrator of
        the supergroup receives every message, privacy mode notwithstanding.
        Telegram documents that a command without a bot's username reaches only the bot that last
        wrote to the group; the emulator delivers it to every bot in privacy mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAccountMessageRequest'
      responses:
        '201':
          description: >-
            The message was stored and, unless a receiving bot's allowed_updates subscription
            excludes message updates, an update was enqueued for each bot that receives it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SentMessage'
                  - $ref: '#/components/schemas/SentSupergroupMessage'
        '400':
          description: >-
            The request, message text, or caption is invalid, the photo is not an image Telegram
            accepts, the file is empty, or the replied message is not a message of the chat.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, sending account, target bot, or supergroup does not exist.
        '409':
          description: The account blocks the target bot and must unblock it before writing to it.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/messages:
    description: Stored messages in a private conversation between an account and bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateMessageHistory
      summary: Return the private conversation's stored messages
      description: >-
        Returns the messages written by either participant, oldest first, as the bot sees them:
        each message carries the bot's message ID, and its chat is the account. Messages the bot
        deleted are omitted.
      responses:
        '200':
          description: The participants exist; the message list may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistory'
        '400':
          description: An account or bot path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/messages/{messageId}:
    description: One message of a private conversation, addressed by its ID as the bot sees it.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
      - $ref: '#/components/parameters/MessageId'
    patch:
      operationId: editAccountMessage
      summary: Edit the text or caption of a message the account sent
      description: >-
        Replaces the text of the account's text message, or the caption of its photo or document,
        normalized as when sending it, and dates the edit. Unless the bot's allowed_updates subscription excludes edited_message updates, the
        bot receives an edited_message update carrying the edited message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAccountMessageRequest'
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          description: >-
            The request, text, or caption is invalid, the bot wrote the message, the request gives
            text for a photo or document or a caption for a text message, or the normalized text or
            caption is the message's current one.
        '404':
          description: The session, account, bot, or message of their private chat does not exist.
  /sessions/{sessionId}/accounts/{accountId}/supergroups:
    description: Supergroups an account creates, which it owns.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: createSupergroup
      summary: Create a supergroup owned by a virtual account
      description: >-
        Creates a supergroup whose only member is the account, as its owner. The owner adds
        accounts and bots to it as members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupergroupRequest'
      responses:
        '201':
          description: The supergroup was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedSupergroup'
        '400':
          description: The request body is malformed or does not match the supergroup schema.
        '404':
          description: The session or account does not exist.
        '507':
          description: The test session cannot allocate another supergroup identifier.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/members/{userId}:
    description: >-
      A member of a supergroup, as the supergroup's owner adds or removes it, or as the member
      itself leaves.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: addSupergroupMember
      summary: Add an account or a bot to a supergroup the account owns
      description: >-
        Adds the user as a member, which a service message from the account records with
        `new_chat_members`. An added bot first receives a my_chat_member update, to `member` from
        `left`, or from `kicked` for a bot removed before, whose ban adding it lifts. Every bot of
        the supergroup, the added one included, then receives the service message, privacy mode
        notwithstanding. Updates that a bot's allowed_updates subscription excludes are not sent.
        Adding a member again changes nothing.
      responses:
        '204':
          description: The user is a member of the supergroup.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user to add does not exist.
    delete:
      operationId: removeSupergroupMember
      summary: Leave a supergroup, or remove a member from a supergroup the account owns
      description: >-
        When the user is the account itself, the account leaves the supergroup; otherwise the
        account, as the owner, removes the user, which, as in Telegram's apps, bans it until it is
        added again. A service message from the account that left or removed the member records
        the change with `left_chat_member`, and the supergroup's bots receive it, privacy mode
        notwithstanding. A removed bot first receives a my_chat_member update, from `member` to
        `kicked`, and still receives the service message about itself; its later Bot API requests
        to the supergroup fail with `403 Forbidden: bot was kicked from the supergroup chat`. The
        owner cannot leave: Telegram keeps a creator who left as the owner, which the emulator does
        not support. Leaving or removing a user that is not a member changes nothing.
      responses:
        '204':
          description: The user is not a member of the supergroup.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account removes another user from a supergroup it does not own.
        '404':
          description: The session, account, supergroup, or user to remove does not exist.
        '409':
          description: The account owns the supergroup and cannot leave it.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/administrators/{userId}:
    description: >-
      An administrator of a supergroup, as the supergroup's owner promotes a member or demotes it.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: promoteSupergroupMember
      summary: Promote a member of a supergroup the account owns to administrator
      description: >-
        Makes the member, an account or a bot, an administrator holding the given rights, or
        replaces an administrator's rights; as on Telegram, any right includes `can_manage_chat`.
        A promoted bot receives a my_chat_member update from the account showing it as
        `administrator` with its rights. As on Telegram, an administrator bot receives every
        message of the supergroup, privacy mode notwithstanding; with `can_delete_messages` it
        deletes any message there, and with `can_restrict_members` it bans and unbans users. Bots
        see the other rights but the emulator does not enforce them. Promoting an administrator
        with the rights it holds changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteSupergroupMemberRequest'
      responses:
        '204':
          description: The member is an administrator with the given rights.
        '400':
          description: A path identifier or the body is invalid, or the body grants no right.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user to promote does not exist.
        '409':
          description: The user is not a member of the supergroup, or is its owner.
    delete:
      operationId: demoteSupergroupMember
      summary: Demote an administrator of a supergroup the account owns to a member
      description: >-
        Makes the administrator a member without rights. A demoted bot receives a my_chat_member
        update from the account showing it as `member`. Demoting a member that is no administrator
        changes nothing.
      responses:
        '204':
          description: The user is a member of the supergroup without administrator rights.
        '400':
          description: A path identifier is invalid.
        '403':
          description: The account does not own the supergroup.
        '404':
          description: The session, account, supergroup, or user to demote does not exist.
        '409':
          description: The user is not a member of the supergroup, or is its owner.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/messages:
    description: Stored messages of a supergroup the account is a member of.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
    get:
      operationId: getSupergroupMessageHistory
      summary: Return the supergroup's stored messages
      description: >-
        Returns the messages every member wrote, oldest first, as the account sees them. A
        supergroup numbers its messages once, so every member, account or bot, sees the same
        message IDs; each member knows a file by a `file_id` of its own. Deleted messages are
        omitted.
      responses:
        '200':
          description: The account is a member; the message list may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupergroupMessageHistory'
        '400':
          description: An account or supergroup path identifier is invalid.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, or supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/supergroup/{chatId}/messages/{messageId}:
    description: One message of a supergroup, addressed by its ID in the supergroup.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/SupergroupChatId'
      - $ref: '#/components/parameters/SupergroupMessageId'
    patch:
      operationId: editSupergroupAccountMessage
      summary: Edit the text or caption of a message the account sent to a supergroup
      description: >-
        Replaces the text or caption of the account's message, as for a private message, and
        dates the edit. The supergroup's bots receive an edited_message update as they would receive the
        message with its new text, unless their allowed_updates subscription excludes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAccountMessageRequest'
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentSupergroupMessage'
        '400':
          description: >-
            The request, text, or caption is invalid, another member wrote the message, the request
            gives text for a photo or document or a caption for a text message, or the normalized
            text or caption is the message's current one.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: The session, account, supergroup, or message of the supergroup does not exist.
  /sessions/{sessionId}/accounts/{accountId}/blocked-bots/{botId}:
    description: >-
      A bot on the account's block list. Telegram calls blocking a bot stopping it. While the
      account blocks the bot, the bot's messages and chat actions to the account fail with `403
      Forbidden: bot was blocked by the user`, and the account cannot write to the bot. Existing
      messages stay editable and deletable.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    put:
      operationId: blockBot
      summary: Block a bot as the account
      description: >-
        Unless the bot's allowed_updates subscription excludes my_chat_member updates, the bot
        receives a my_chat_member update in which its membership in the account's private chat
        changes from `member` to `kicked`. The account need not have written to the bot. Blocking
        a blocked bot has no effect.
      responses:
        '204':
          description: The account blocks the bot.
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
    delete:
      operationId: unblockBot
      summary: Unblock a bot as the account
      description: >-
        Unless the bot's allowed_updates subscription excludes my_chat_member updates, the bot
        receives a my_chat_member update in which its membership changes from `kicked` back to
        `member`. Unblocking a bot that is not blocked has no effect.
      responses:
        '204':
          description: The account does not block the bot.
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/commands:
    description: The bot commands an account's client suggests in its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatBotCommands
      summary: Return the commands the account sees in its private chat with the bot
      description: >-
        Resolves the bot's command lists as Telegram documents for private chats: the list for
        the chat, then for all private chats, then the default list, each preferring the list in
        the account's language, taken from the primary subtag of its `language_code`, over the
        list without a language. The account need not have written to the bot.
      responses:
        '200':
          description: The commands, which are empty if the bot set none that apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBotCommands'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/reply-interface:
    description: >-
      The reply keyboard or forced reply an account's client shows in its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatReplyInterface
      summary: Return the reply interface the account sees in its private chat with the bot
      description: >-
        As TDLib tracks it, the chat shows the reply interface of the latest bot message that sent
        a reply keyboard or forced reply, until a later message removes the keyboard or that
        message is deleted. Messages with an inline keyboard or no reply markup leave it
        unchanged, and so do edits.
      responses:
        '200':
          description: The reply interface, or `null` when the client shows its usual input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountReplyInterface'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/reply-keyboard-presses:
    description: Reply keyboard buttons an account pressed.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: pressReplyKeyboardButton
      summary: Press a button of the reply keyboard a private chat shows
      description: >-
        Sends the button's text to the bot as the account's message, as a Telegram client does.
        The keyboard stays shown afterward, even a one-time keyboard, which Telegram clients only
        hide until the user shows it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PressReplyKeyboardButtonRequest'
      responses:
        '201':
          description: >-
            The button's text was sent as the account's message, and, unless the bot's
            allowed_updates subscription excludes message updates, an update was enqueued for the
            bot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          description: >-
            The request is invalid, or the chat shows no reply keyboard with a button of that
            text.
        '404':
          description: The session, account, or bot does not exist.
        '409':
          description: The account blocks the bot and must unblock it before writing to it.
  /sessions/{sessionId}/accounts/{accountId}/callback-queries:
    description: Callback queries an account created by pressing callback buttons.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: pressCallbackButton
      summary: Press a callback button on a bot message as a virtual account
      description: >-
        Presses the button with the given callback data on a bot message in the account's private
        chat with the bot, or in a supergroup the account is a member of. Unless the bot that sent
        the message has an allowed_updates subscription that excludes callback_query
        updates, the bot receives a callback_query update carrying the message as it is now. The
        bot answers asynchronously with answerCallbackQuery; read the answer from the created
        callback query. The press can create the query already expired, so that the bot receives
        it but cannot answer it, as when a bot that was offline catches up after the answer
        deadline has passed. The emulator never expires callback queries by time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PressCallbackButtonRequest'
      responses:
        '201':
          description: The button was pressed and the callback query created.
          headers:
            Location:
              description: Relative URL of the created callback query.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        '400':
          description: >-
            The request is invalid, or the message has no callback button with the given data.
        '403':
          description: The account is not a member of the supergroup.
        '404':
          description: >-
            The session, account, bot, or supergroup does not exist, or the chat has no message
            with the given ID.
  /sessions/{sessionId}/accounts/{accountId}/callback-queries/{callbackQueryId}:
    description: One callback query created by an account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/CallbackQueryId'
    get:
      operationId: getCallbackQuery
      summary: Return a callback query with the bot's answer once given
      responses:
        '200':
          description: The callback query, answered or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        '400':
          description: The account path identifier is invalid.
        '404':
          description: The session does not exist, or the account created no such callback query.
  /sessions/{sessionId}/bot-api/bot{token}/getMe:
    description: Telegram Bot API method for retrieving the authenticated virtual bot's profile.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getMe
      summary: Return the authenticated virtual bot's profile
      responses:
        '200':
          description: The virtual bot was authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeResponse'
        '400':
          description: The request body cannot be decoded, or getMe received a parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/getUpdates:
    description: Telegram Bot API long-polling method for receiving pending bot updates.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getUpdates
      summary: Return pending updates for the authenticated virtual bot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
            encoding:
              allowed_updates:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
            encoding:
              allowed_updates:
                contentType: application/json
      responses:
        '200':
          description: Pending updates, limited and confirmed according to the supplied offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUpdatesResponse'
        '400':
          description: The request body cannot be decoded, or the getUpdates parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '409':
          description: >-
            The bot has a webhook, so it cannot poll; or, while this request was waiting for
            updates, another getUpdates request for the same bot began waiting and replaced it, or
            the bot set a webhook. A bot has at most one waiting request; requests answered
            immediately do not replace it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/setWebhook:
    description: >-
      Telegram Bot API method for delivering the bot's updates to a webhook, or, with an empty URL,
      for removing it. The emulator posts each update to the URL as JSON, with the
      `X-Telegram-Bot-Api-Secret-Token` header when a secret token is set, one update at a time
      and in order, and confirms it once the webhook answers with a 2xx status. A failed update
      is sent again at once, then after delays doubling from 2 up to 60 seconds, and holds back
      later updates. Unlike Telegram, the emulator delivers to plain HTTP URLs on any port, and
      ignores a Bot API method that the webhook names in its response. Setting a new webhook
      ends the bot's waiting getUpdates request with a conflict. Ending the session stops
      delivery; undelivered updates stay pending.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: setWebhook
      summary: Set, replace, or remove the authenticated virtual bot's webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetWebhookRequest'
            encoding:
              allowed_updates:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetWebhookRequest'
            encoding:
              allowed_updates:
                contentType: application/json
      responses:
        '200':
          description: >-
            The webhook was set, removed, or already as requested. A request that changes no
            webhook still applies `allowed_updates`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetWebhookResponse'
        '400':
          description: >-
            The request body cannot be decoded, the parameters are invalid, the URL is not an HTTP
            or HTTPS URL, or the secret token is too long or has characters Telegram does not
            allow. The emulator also rejects `ip_address` and a custom `certificate`, which it
            does not support. A rejected request leaves the webhook unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/deleteWebhook:
    description: >-
      Telegram Bot API method for removing the bot's webhook, as setWebhook does with an empty
      URL. Undelivered updates stay pending unless dropped, and a waiting getUpdates request is not
      interrupted.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteWebhook
      summary: Remove the authenticated virtual bot's webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
      responses:
        '200':
          description: The bot has no webhook, and pending updates were discarded if requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookResponse'
        '400':
          description: The request body cannot be decoded, or the deleteWebhook parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/getWebhookInfo:
    description: >-
      Telegram Bot API method for reading the bot's webhook, its pending updates, and the latest
      failure to deliver to it, which a test can read to find why a bot's webhook rejects updates.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getWebhookInfo
      summary: Return the authenticated virtual bot's webhook status
      responses:
        '200':
          description: The webhook status; a bot without a webhook has an empty URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookInfoResponse'
        '400':
          description: The request body cannot be decoded, or getWebhookInfo received a parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/sendMessage:
    description: >-
      Telegram Bot API method for sending a text message. The emulator supports text sent to a
      private chat with an account that has written to the bot, formatted with `parse_mode` or
      `entities`, optionally as a reply to a message of the chat, protected from forwarding and
      saving, and with reply markup: an inline keyboard of callback and URL buttons, a reply
      keyboard of text buttons, a reply keyboard removal, or a forced reply. As on Telegram, the
      message a bot receives in the response never shows reply markup other than an inline
      keyboard; a test reads the reply interface the account's client shows instead. Link preview
      options and `disable_notification` are validated and have no effect, because the emulator
      generates no link previews and does not model notifications. As on Telegram, the text and
      its entities are normalized before the message is stored, and the bot receives no update
      for its own message.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendMessage
      summary: Send text from the authenticated virtual bot to an account or a supergroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: >-
            The message was stored in the private conversation or supergroup. No bot receives an
            update for a bot's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the text is empty (`Bad Request: message text is empty`);
            the text or its formatting cannot be read (for example `Bad Request: unsupported
            parse_mode`, `Bad Request: can't parse entities: …`, or `Bad Request: can't parse
            MessageEntity: …`); `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is
            neither a private chat with an account that has written to the bot nor a supergroup the
            bot is or was a member of (`Bad Request: chat not found`); the replied message is not a message of the chat, for example because it was
            deleted, and sending without a reply is not allowed (`Bad Request: message to be
            replied not found`); the text and its entities cannot be normalized (for example `Bad
            Request: text must be non-empty`, `Bad Request: entity URL '…' is invalid: …`, or `Bad
            Request: user not found`); the normalized text is longer than 4096 characters (`Bad
            Request: message is too long`); or a button's callback data exceeds 64 bytes (`Bad
            Request: BUTTON_DATA_INVALID`). Date and time entities are not supported (`Bad Request:
            date_time entities are not supported`), and neither are replies to messages of other
            chats (`Bad Request: replies to messages of other chats are not supported`) or reply
            keyboards, keyboard removals, and forced replies in supergroups (`Bad Request: reply
            keyboards, keyboard removals, and forced replies are not supported in groups`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), which, as on
            Telegram, is checked after every check that answers 400; or the bot left the supergroup
            (`Forbidden: bot is not a member of the supergroup chat`) or was removed from it
            (`Forbidden: bot was kicked from the supergroup chat`), which is checked in place of
            the chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/files/{fileUniqueId}:
    description: >-
      The content of a photo or document of the session's messages, addressed by its
      `file_unique_id`, which, unlike `file_id`, is the same for every user.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/FileUniqueId'
    get:
      operationId: downloadFile
      summary: Return a file's content by its unique identifier
      responses:
        '200':
          description: >-
            The file's content, as it was sent, with its document's MIME type or its photo's
            image type.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: The session or the file does not exist.
  /sessions/{sessionId}/bot-api/bot{token}/sendPhoto:
    description: >-
      Telegram Bot API method for sending a photo with an optional caption. The photo is a file
      uploaded with the request, or a photo the bot knows by its `file_id`, which, as on Telegram,
      is the bot's own. The emulator reads the dimensions of JPEG, PNG, GIF, WebP, and BMP images
      and keeps the photo in the one size and format it was sent in, whereas Telegram converts a
      photo to JPEG in several sizes and accepts other image formats too. Files sent by URL are not
      supported. The caption is read, formatted, and normalized as `sendMessage` reads text, and
      the other parameters work as for `sendMessage`.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendPhoto
      summary: Send a photo from the authenticated virtual bot to an account or a supergroup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendPhotoRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhotoRequest'
      responses:
        '200':
          description: >-
            The photo was stored in the private conversation or supergroup. No bot receives an
            update for a bot's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the request names no uploaded file and no `file_id` (`Bad
            Request: there is no photo in the request`); the caption or its formatting cannot be
            read, as for `sendMessage`; `chat_id` is missing (`Bad Request: chat_id is empty`); the
            uploaded file is empty (`Bad Request: file must be non-empty`), is not an image
            (`Bad Request: IMAGE_PROCESS_FAILED`), or has dimensions Telegram refuses (`Bad
            Request: PHOTO_INVALID_DIMENSIONS`); the `file_id` identifies no file the bot knows
            (`Bad Request: wrong file identifier/HTTP URL specified`) or identifies a document
            (`Bad Request: can't use file of type Document as Photo`); then the checks of
            `sendMessage` from the chat on, with a caption longer than 1024 characters rejected
            (`Bad Request: message caption is too long`). Telegram checks the chat before the file.
            Files sent by URL are not supported (`Bad Request: sending files by URL is not
            supported`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
            the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
            from it (`Forbidden: bot was kicked from the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/sendDocument:
    description: >-
      Telegram Bot API method for sending a file as a document with an optional caption, as
      `sendPhoto` sends a photo. The Bot API server cleans the name of an uploaded file, and the
      name's extension decides the document's MIME type. Telegram sends some files, such as videos
      and GIF animations, as other media unless `disable_content_type_detection` is set; the
      emulator always sends a document. Document thumbnails are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendDocument
      summary: Send a document from the authenticated virtual bot to an account or a supergroup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_parameters:
                contentType: application/json
              reply_markup:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
      responses:
        '200':
          description: >-
            The document was stored in the private conversation or supergroup. No bot receives an
            update for a bot's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it for the reasons `sendPhoto` gives, apart from those about images: the request names
            no file (`Bad Request: there is no document in the request`), the uploaded file is
            empty, or the `file_id` identifies no file the bot knows or identifies a photo (`Bad
            Request: can't use file of type Photo as Document`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The account blocks the bot (`Forbidden: bot was blocked by the user`), or the bot left
            the supergroup (`Forbidden: bot is not a member of the supergroup chat`) or was removed
            from it (`Forbidden: bot was kicked from the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/editMessageCaption:
    description: >-
      Telegram Bot API method for editing the caption of a photo or document the bot sent to a
      private chat or a supergroup; an empty caption removes it. The caption is formatted and
      normalized as by `sendPhoto`, `show_caption_above_media` applies only to photos, and, as on
      Telegram, the edited message keeps only the inline keyboard given in `reply_markup` and the
      bot receives no update for its own edit. The edit date changes only when the caption, its
      entities, or where it shows do. Messages sent through inline mode are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageCaption
      summary: Edit the caption of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageCaptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageCaptionRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageCaptionRequest'
            encoding:
              caption_entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it for the reasons `editMessageText` gives, with the caption in place of the text: the
            caption or its formatting cannot be read or normalized, the message is a text message
            (`Bad Request: there is no caption in the message to edit`), or the caption is longer
            than 1024 characters (`Bad Request: message caption is too long`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The chat is a supergroup that the bot left the supergroup (`Forbidden: bot is not a
            member of the supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/getFile:
    description: >-
      Telegram Bot API method for preparing a file the bot knows by its `file_id` for download.
      The result's `file_path` addresses the file under the session's Bot API file route, as
      `https://api.telegram.org/file/bot<token>/<file_path>` does on Telegram; the path stays valid
      for the whole session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getFile
      summary: Return a file the authenticated virtual bot knows, with its download path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetFileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetFileRequest'
      responses:
        '200':
          description: The file with its download path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, `file_id` is missing
            (`Bad Request: file_id not specified`), no file the bot knows has that `file_id` (`Bad
            Request: invalid file_id`), or the file is larger than 20 MB (`Bad Request: file is too
            big`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/file/bot{token}/{fileDirectory}/{fileName}:
    description: >-
      Where a bot downloads a file whose `file_path`, `<fileDirectory>/<fileName>`, getFile
      returned, as Telegram serves files at `https://api.telegram.org/file/bot<token>/<file_path>`.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/FileDirectory'
      - $ref: '#/components/parameters/FileName'
    get:
      operationId: downloadBotFile
      summary: Download a file the authenticated virtual bot prepared with getFile
      responses:
        '200':
          description: >-
            The file's content, as it was sent, with its document's MIME type or its photo's
            image type.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: >-
            No active test session has the supplied identifier, or no bot of the session owns the
            token or has the file path (`Not Found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
  /sessions/{sessionId}/bot-api/bot{token}/editMessageText:
    description: >-
      Telegram Bot API method for editing the text of a message the bot sent to a private chat or a
      supergroup. As on Telegram, the text is formatted and normalized as by `sendMessage`, the edited message
      keeps only the inline keyboard given in `reply_markup`, and the bot receives no update for
      its own edit. The edit date changes only when the text or its entities do. Messages sent
      through inline mode, which `inline_message_id` identifies, are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageText
      summary: Edit the text of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
            encoding:
              entities:
                contentType: application/json
              link_preview_options:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the text is empty (`Bad Request: message text is empty`);
            the text or its formatting cannot be read, as for `sendMessage`; neither `chat_id` nor
            a positive `message_id` is given (`Bad Request: message identifier is not specified`);
            `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is not one the bot can
            address, as for `sendMessage` (`Bad Request: chat not found`); the chat has no message
            with that ID (`Bad Request: message to edit not found`); another user wrote the message
            (`Bad Request: message can't be edited`); the message is a photo or document (`Bad
            Request: there is no text in the message to edit`); the text and its entities
            cannot be normalized, as for `sendMessage`; the normalized text is longer than 4096
            characters (`Bad Request: message is too long`); a button's callback data exceeds 64
            bytes (`Bad Request: BUTTON_DATA_INVALID`); or the text, entities, and keyboard are
            unchanged (`Bad Request: message is not modified: specified new message content and
            reply markup are exactly the same as a current content and reply markup of the
            message`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
