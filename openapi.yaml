  /sessions/{sessionId}/bot-api/bot{token}/banChatMember:
    description: >-
      Telegram Bot API method for banning a user from a supergroup, which needs the
      `can_restrict_members` administrator right. A member is removed, which a service message
      from the bot records with `left_chat_member`; as on Telegram, only the bot receives it,
      since bots never receive other bots' messages. A removed bot receives a my_chat_member
      update showing it as `kicked`. A user that is not a member is banned before it can join.
      A ban shorter than 30 seconds or longer than 366 days lasts until it is lifted, as on
      Telegram; the emulator never lifts a ban when its `until_date` passes. Banning a user as
      it is already banned succeeds without rights. `revoke_messages` is accepted and ignored.
      Telegram's older name, `kickChatMember`, is accepted too.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: banChatMember
      summary: Ban a user from a supergroup as the authenticated virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BanChatMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BanChatMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BanChatMemberRequest'
      responses:
        '200':
          description: The user is banned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram
            would reject it, in this order: `user_id` is missing or not positive (`Bad
            Request: invalid user_id specified`); `chat_id` is missing (`Bad Request:
            chat_id is empty`); the chat is neither a private chat with an account that
            has written to the bot nor a supergroup the bot is or was a member of (`Bad
            Request: chat not found`); the chat is a private chat (`Bad Request: can't
            ban members in private chats`); the user is the bot itself (`Bad Request:
            can't restrict self`) or no user of the session (`Bad Request: member not
            found`); the user is the owner (`Bad Request: can't remove chat owner`); the
            bot lacks the right (`Bad Request: not enough rights to restrict/unrestrict
            chat member`); or the user is an administrator, which Telegram lets a bot
            ban only if it promoted it, and bots promote none here (`Bad Request: user
            is an administrator of the chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The bot left the supergroup (`Forbidden: bot is not a member of the
            supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/unbanChatMember:
    description: >-
      Telegram Bot API method for lifting a user's ban from a supergroup, so that it may be
      added again, which needs the `can_restrict_members` administrator right. As on Telegram,
      unless `only_if_banned` is set, this also removes a member: the bot bans it for a
      minute, which a service message from the bot records, then lifts the ban, and a removed
      bot receives a my_chat_member update for each step. A bot that names itself leaves the
      supergroup. Lifting the ban of a user that is not banned and not a member succeeds
      without rights, and with `only_if_banned`, so does any request about a user that is not
      banned.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: unbanChatMember
      summary: Lift a user's ban from a supergroup as the authenticated virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnbanChatMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnbanChatMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnbanChatMemberRequest'
      responses:
        '200':
          description: The user is not banned and not a member, or, with `only_if_banned`, was not banned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram
            would reject it, in this order: `user_id` is missing or not positive (`Bad
            Request: invalid user_id specified`); `chat_id` is missing (`Bad Request:
            chat_id is empty`); the chat is neither a private chat with an account that
            has written to the bot nor a supergroup the bot is or was a member of (`Bad
            Request: chat not found`); the chat is a private chat (`Bad Request: method
            is available only in supergroup and channel chats`); the user is no user of
            the session (`Bad Request: member not found`); the user is the owner (`Bad
            Request: can't remove chat owner`); the bot lacks the right (`Bad Request:
            not enough rights to restrict/unrestrict chat member`); or the user is an
            administrator (`Bad Request: user is an administrator of the chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '403':
          description: >-
            The bot left the supergroup (`Forbidden: bot is not a member of the
            supergroup chat`) or was removed from it (`Forbidden: bot was kicked from
            the supergroup chat`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/setMyCommands:
    description: >-
      Telegram Bot API method for replacing the bot's command list for a scope and language. As on
      Telegram, commands are cleaned of control characters, trimmed, and stripped of a leading
      slash, and an empty or missing `commands` list deletes the list. Chat scopes can address only
      private chats with accounts that have written to the bot; they cannot address supergroups
      yet.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: setMyCommands
      summary: Replace one of the authenticated virtual bot's command lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMyCommandsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetMyCommandsRequest'
            encoding:
              commands:
                contentType: application/json
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetMyCommandsRequest'
            encoding:
              commands:
                contentType: application/json
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`). Each command is then checked for UTF-8 text, a nonempty command of at most
            32 characters (`Bad Request: command must be non-empty`, `Bad Request: command length
            must not exceed 32`), and a nonempty description of at most 256 characters (`Bad
            Request: command description must be non-empty`, `Bad Request: command description
            length must not exceed 256`); finally, more than 100 commands (`Bad Request:
            BOT_COMMANDS_TOO_MUCH`) or a command with characters other than lowercase English
            letters, digits, and underscores (`Bad Request: BOT_COMMAND_INVALID`) are rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/getMyCommands:
    description: >-
      Telegram Bot API method for reading the bot's command list for exactly one scope and
      language, without falling back to other scopes or languages.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getMyCommands
      summary: Return one of the authenticated virtual bot's command lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list, which is empty if none is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/deleteMyCommands:
    description: >-
      Telegram Bot API method for deleting the bot's command list for a scope and language, so
      that users see the list of the next broader scope.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteMyCommands
      summary: Delete one of the authenticated virtual bot's command lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/{method}:
    description: Telegram Bot API methods invoked for a virtual bot within a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/BotApiMethod'
components:
  schemas:
    TelegramUserId:
      type: integer
      minimum: 1
      maximum: 1099511627775
    SupergroupChatId:
      type: integer
      minimum: -1997852516352
      maximum: -1000000000001
      description: Bot API chat identifier of a supergroup, which carries Telegram's `-100` prefix.
    Bot:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
        - username
        - can_join_groups
        - can_read_all_group_messages
        - supports_inline_queries
        - can_connect_to_business
        - has_main_web_app
        - has_topics_enabled
        - allows_users_to_create_topics
        - can_manage_bots
        - supports_join_request_queries
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the bot.
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        username:
          type: string
        can_join_groups:
          type: boolean
        can_read_all_group_messages:
          type: boolean
        supports_guest_queries:
          type: boolean
        supports_inline_queries:
          type: boolean
        can_connect_to_business:
          type: boolean
        has_main_web_app:
          type: boolean
        has_topics_enabled:
          type: boolean
        allows_users_to_create_topics:
          type: boolean
        can_manage_bots:
          type: boolean
        supports_join_request_queries:
          type: boolean
    CreateBotRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - username
      properties:
        first_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        can_read_all_group_messages:
          type: boolean
          default: false
          description: >-
            Turns off the bot's privacy mode, as BotFather does, so that it receives every account
            message of its supergroups rather than only those addressed to it.
    CreatedBot:
      type: object
      additionalProperties: false
      required:
        - token
        - bot
      properties:
        token:
          type: string
          description: Emulator-issued token used to call the Bot API as this bot.
        bot:
          $ref: '#/components/schemas/Bot'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the account.
        is_bot:
          type: boolean
          const: false
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        language_code:
          type: string
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        language_code:
          type: string
          minLength: 1
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          $ref: '#/components/schemas/Account'
    PrivateMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - botId
      properties:
        type:
          type: string
          const: private
        botId:
          $ref: '#/components/schemas/TelegramUserId'
    SupergroupMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - chatId
      properties:
        type:
          type: string
          const: supergroup
        chatId:
          $ref: '#/components/schemas/SupergroupChatId'
    MessageTarget:
      description: The account's private chat with a bot, or a supergroup it is a member of.
      oneOf:
        - $ref: '#/components/schemas/PrivateMessageTarget'
        - $ref: '#/components/schemas/SupergroupMessageTarget'
      discriminator:
        propertyName: type
        mapping:
          private: '#/components/schemas/PrivateMessageTarget'
          supergroup: '#/components/schemas/SupergroupMessageTarget'
    CreateSupergroupRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
    CreatedSupergroup:
      type: object
      additionalProperties: false
      required:
        - supergroup
      properties:
        supergroup:
          type: object
          additionalProperties: false
          required:
            - id
            - type
            - title
          properties:
            id:
              $ref: '#/components/schemas/SupergroupChatId'
            type:
              type: string
              const: supergroup
            title:
              type: string
            description:
              type: string
    SendAccountMessageRequest:
      description: Text, a photo, or a document to send.
      oneOf:
        - $ref: '#/components/schemas/SendAccountTextRequest'
        - $ref: '#/components/schemas/SendAccountPhotoRequest'
        - $ref: '#/components/schemas/SendAccountDocumentRequest'
    SendAccountTextRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - text
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Plain text, normalized as a Telegram client does: control characters become spaces,
            carriage returns are removed, and leading and trailing whitespace is trimmed. Text with
            no visible characters is rejected.
        reply_to_message_id:
          $ref: '#/components/schemas/AccountReplyToMessageId'
    SendAccountPhotoRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - photo
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        photo:
          type: object
          additionalProperties: false
          required:
            - content_base64
          properties:
            content_base64:
              type: string
              contentEncoding: base64
              description: >-
                A JPEG, PNG, GIF, WebP, or BMP image, which Telegram accepts as a photo when its
                width and height add up to at most 10000 and neither is more than 20 times the
                other. Telegram also accepts other image formats, such as TIFF, which the emulator
                rejects.
        caption:
          $ref: '#/components/schemas/AccountCaption'
        reply_to_message_id:
          $ref: '#/components/schemas/AccountReplyToMessageId'
    SendAccountDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - document
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        document:
          type: object
          additionalProperties: false
          required:
            - content_base64
            - file_name
          properties:
            content_base64:
              type: string
              contentEncoding: base64
              description: The file's content, which must not be empty.
            file_name:
              type: string
              minLength: 1
              description: The file's name, whose extension decides the document's MIME type.
        caption:
          $ref: '#/components/schemas/AccountCaption'
        reply_to_message_id:
          $ref: '#/components/schemas/AccountReplyToMessageId'
    AccountCaption:
      type: string
      default: ''
      description: >-
        Plain text shown with the media, normalized as message text is; a caption with no visible
        characters is none. At most 1024 characters are accepted.
    AccountReplyToMessageId:
      type: integer
      minimum: 1
      description: >-
        ID of the chat's message to reply to, as message history shows it. Omit it to send a
        message that replies to none.
    PrivateChat:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        type:
          type: string
          const: private
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    SupergroupChat:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - type
      properties:
        id:
          $ref: '#/components/schemas/SupergroupChatId'
        title:
          type: string
        type:
          type: string
          const: supergroup
    SupergroupMessage:
      type: object
      additionalProperties: false
      description: >-
        A supergroup message as the requesting member sees it: one a member wrote, or a service
        message recording that members joined (`new_chat_members`) or that a member left or was
        removed (`left_chat_member`). As Telegram does, a service message also carries the legacy
        fields `new_chat_participant` and `new_chat_member`, or `left_chat_participant`. Members see
        the same message, apart from the `file_id` of its file and the legacy `new_chat_member`.
        Its other fields mean what they mean for a private message.
      required:
        - message_id
        - from
        - chat
        - date
      oneOf:
        - required:
            - text
        - required:
            - photo
        - required:
            - document
        - required:
            - new_chat_participant
            - new_chat_member
            - new_chat_members
        - required:
            - left_chat_participant
            - left_chat_member
      properties:
        message_id:
          type: integer
          minimum: 1
          description: Message ID in the supergroup's own message sequence.
        from:
          description: >-
            The member, an account or a bot, that wrote the message, or that added, removed, or
            left as a service message records.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        date:
          type: integer
          minimum: 0
        edit_date:
          type: integer
          minimum: 0
        reply_to_message:
          $ref: '#/components/schemas/SupergroupMessage'
        text:
          type: string
        entities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageEntity'
        photo:
          type: array
          minItems: 1
          description: >-
            The sizes of a photo message's photo, smallest first. Telegram converts a photo to
            JPEG and keeps it in several sizes; the emulator keeps the one size and the format it
            was sent in.
          items:
            $ref: '#/components/schemas/PhotoSize'
        document:
          $ref: '#/components/schemas/Document'
        caption:
          type: string
          minLength: 1
          description: The caption of a photo or document, omitted when it has none.
        caption_entities:
          type: array
          minItems: 1
          description: Entities marked in the caption, as in text; omitted when there are none.
          items:
            $ref: '#/components/schemas/MessageEntity'
        show_caption_above_media:
          type: boolean
          const: true
          description: Present when clients show the photo's caption above the photo.
        has_media_spoiler:
          type: boolean
          const: true
          description: Present when clients cover the photo until the user reveals it.
        new_chat_participant:
          $ref: '#/components/schemas/MessageUser'
          description: Legacy alias of `new_chat_member`.
        new_chat_member:
          $ref: '#/components/schemas/MessageUser'
          description: >-
            Legacy field: the requesting member if it is among the new members, otherwise the first
            of them.
        new_chat_members:
          type: array
          minItems: 1
          description: The accounts and bots that joined.
          items:
            $ref: '#/components/schemas/MessageUser'
        left_chat_participant:
          $ref: '#/components/schemas/MessageUser'
          description: Legacy alias of `left_chat_member`.
        left_chat_member:
          $ref: '#/components/schemas/MessageUser'
          description: The account or bot that left or was removed.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
        has_protected_content:
          type: boolean
          const: true
    MessageUser:
      description: An account or a bot as a message shows it.
      oneOf:
        - $ref: '#/components/schemas/Account'
        - $ref: '#/components/schemas/MessageSenderBot'
    Message:
      description: A message of a private chat or a supergroup.
      oneOf:
        - $ref: '#/components/schemas/PrivateMessage'
        - $ref: '#/components/schemas/SupergroupMessage'
    PrivateMessage:
      type: object
      additionalProperties: false
      description: >-
        A private-chat message as the conversation's bot sees it: text, a photo, or a document,
        each with the fields Telegram shows for it.
      required:
        - message_id
        - from
        - chat
        - date
      oneOf:
        - required:
            - text
        - required:
            - photo
        - required:
            - document
      properties:
        message_id:
          type: integer
          minimum: 1
          description: >-
            Message ID in the conversation bot's message sequence, which spans all of that bot's
            private chats. Other observers can number the same message differently.
        from:
          description: The account or bot that wrote the message.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/PrivateChat'
          description: The account's private chat, whichever participant wrote the message.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp when the emulator accepted the message.
        edit_date:
          type: integer
          minimum: 0
          description: >-
            Unix timestamp of the last edit of the text or caption by its author, omitted if the
            message's content was never edited. Replacing only the inline keyboard does not change
            it.
        reply_to_message:
          $ref: '#/components/schemas/PrivateMessage'
          description: >-
            The current state of the message this one replies to, which never has a
            `reply_to_message` of its own. Omitted when the message is no reply or the replied
            message was deleted.
        text:
          type: string
          description: The text of a text message.
        entities:
          type: array
          minItems: 1
          description: >-
            Entities marked in the text, omitted when there are none: formatting the bot applied,
            and bot commands, which, as Telegram does in chats with bots, the emulator marks in text
            written by either participant. Other entity types Telegram detects, such
            as URLs and mentions, are not detected.
          items:
            $ref: '#/components/schemas/MessageEntity'
        photo:
          type: array
          minItems: 1
          description: >-
            The sizes of a photo message's photo, smallest first. Telegram converts a photo to
            JPEG and keeps it in several sizes; the emulator keeps the one size and the format it
            was sent in.
          items:
            $ref: '#/components/schemas/PhotoSize'
        document:
          $ref: '#/components/schemas/Document'
        caption:
          type: string
          minLength: 1
          description: The caption of a photo or document, omitted when it has none.
        caption_entities:
          type: array
          minItems: 1
          description: Entities marked in the caption, as in text; omitted when there are none.
          items:
            $ref: '#/components/schemas/MessageEntity'
        show_caption_above_media:
          type: boolean
          const: true
          description: Present when clients show the photo's caption above the photo.
        has_media_spoiler:
          type: boolean
          const: true
          description: Present when clients cover the photo until the user reveals it.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: The inline keyboard the bot attached, omitted when there is none.
        has_protected_content:
          type: boolean
          const: true
          description: >-
            Present when the bot protected the message from forwarding and saving with
            `protect_content`.
    PhotoSize:
      type: object
      additionalProperties: false
      required:
        - file_id
        - file_unique_id
        - file_size
        - width
        - height
      properties:
        file_id:
          $ref: '#/components/schemas/FileId'
        file_unique_id:
          $ref: '#/components/schemas/FileUniqueId'
        file_size:
          type: integer
          minimum: 1
          description: Size of the file in bytes.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Document:
      type: object
      additionalProperties: false
      required:
        - file_name
        - mime_type
        - file_id
        - file_unique_id
        - file_size
      properties:
        file_name:
          type: string
          minLength: 1
          description: >-
            The file's name. The Bot API server cleans the name of a file a bot uploads, as TDLib's
            `clean_filename` does, and names a file whose name cleans to nothing `file`.
        mime_type:
          type: string
          minLength: 1
          description: >-
            The MIME type Telegram derives from the file name's extension, matched
            case-insensitively; `application/octet-stream` for an extension the emulator does not
            recognize.
        file_id:
          $ref: '#/components/schemas/FileId'
        file_unique_id:
          $ref: '#/components/schemas/FileUniqueId'
        file_size:
          type: integer
          minimum: 1
          description: Size of the file in bytes.
    FileId:
      type: string
      minLength: 1
      description: >-
        Identifier of a file for the user that sees it. As on Telegram, each user knows a file by a
        `file_id` of its own, so a bot can send or download a file only by its own `file_id`.
    FileUniqueId:
      type: string
      minLength: 1
      description: >-
        Identifier of a file that is the same for every user; it can neither send nor, through the
        Bot API, download the file.
    InlineKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - inline_keyboard
      properties:
        inline_keyboard:
          type: array
          description: >-
            Rows of buttons. As a request parameter, an empty array attaches no keyboard, as on
            Telegram; empty rows are rejected.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/InlineKeyboardButton'
    InlineKeyboardButton:
      description: >-
        A button with exactly one action. Telegram also accepts other button types and buttons
        with several actions, using the first action it recognizes; the emulator rejects them.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
            - callback_data
          properties:
            text:
              type: string
              minLength: 1
            callback_data:
              type: string
              minLength: 1
              description: >-
                Data sent to the bot in a callback query, at most 64 bytes when UTF-8 encoded.
        - type: object
          additionalProperties: false
          required:
            - text
            - url
          properties:
            text:
              type: string
              minLength: 1
            url:
              type: string
              format: uri
              description: An absolute URL.
    MessageSenderBot:
      type: object
      additionalProperties: false
      description: A bot as a message sender, without the capabilities that only getMe reports.
      required:
        - id
        - is_bot
        - first_name
        - username
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    MessageEntity:
      type: object
      additionalProperties: false
      description: >-
        A marked span of message text. Formatting that overlaps other entities is split so that
        entities nest properly, as on Telegram.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
          enum:
            - bot_command
            - bold
            - italic
            - underline
            - strikethrough
            - spoiler
            - code
            - pre
            - text_link
            - text_mention
            - custom_emoji
            - blockquote
            - expandable_blockquote
        offset:
          type: integer
          minimum: 0
          description: Offset in UTF-16 code units to the start of the entity.
        length:
          type: integer
          minimum: 1
          description: Length of the entity in UTF-16 code units.
        language:
          type: string
          description: For `pre`, the programming language of the code, when one is given.
        url:
          type: string
          description: For `text_link`, the link as Telegram normalized it.
        user:
          description: For `text_mention`, the mentioned user.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        custom_emoji_id:
          type: string
          description: For `custom_emoji`, the custom emoji's identifier.
    MessageEntityParameter:
      type: object
      additionalProperties: false
      description: >-
        An entity a bot specifies, as a Bot API `MessageEntity`. Types that Telegram detects by
        itself (`mention`, `hashtag`, `cashtag`, `bot_command`, `url`, `email`, `phone_number`,
        and `bank_card_number`) are accepted and ignored, so entities of a received message can be
        sent back. `date_time` entities are not supported. Telegram reads numbers written as
        strings; the emulator rejects them.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
        offset:
          type: integer
        length:
          type: integer
        language:
          type: string
        url:
          type: string
          description: For `text_link`; a `tg://user?id=` link makes a text mention.
        user:
          type: object
          description: For `text_mention`; only its `id` is read, and it must be a session user.
          required:
            - id
          properties:
            id:
              type: integer
        custom_emoji_id:
          type: string
    ParseMode:
      type: string
      description: >-
        Markup to read the text as, matched case-insensitively: `HTML`, `MarkdownV2`, or the
        legacy `Markdown`, parsed as Telegram does. `none` or omitting it leaves the text as it is.
        Date and time markup (`<tg-time>` or a `tg://time` link) is not supported.
    SentMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/PrivateMessage'
    MessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PrivateMessage'
    SentSupergroupMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/SupergroupMessage'
    SupergroupMessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SupergroupMessage'
    MessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - message
      properties:
        update_id:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/Message'
    EditedMessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - edited_message
      properties:
        update_id:
          type: integer
          minimum: 1
        edited_message:
          $ref: '#/components/schemas/Message'
          description: >-
            An account's message as its edit left it. A bot receives no update for bots' edits.
    MyChatMemberUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - my_chat_member
      properties:
        update_id:
          type: integer
          minimum: 1
        my_chat_member:
          oneOf:
            - $ref: '#/components/schemas/PrivateChatMemberUpdated'
            - $ref: '#/components/schemas/SupergroupChatMemberUpdated'
    PrivateChatMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        A change of the bot's membership in an account's private chat: `member` becomes `kicked`
        when the account blocks the bot, and `kicked` becomes `member` when it unblocks the bot.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/PrivateChat'
        from:
          $ref: '#/components/schemas/Account'
          description: The account that blocked or unblocked the bot.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/PrivateChatBotMember'
        new_chat_member:
          $ref: '#/components/schemas/PrivateChatBotMember'
    SupergroupChatMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        A change of the bot's standing in a supergroup: it becomes `member` from `left`, or from
        `kicked` after a ban, when an account adds it; `administrator` when the owner promotes it
        or changes its rights, and `member` again when the owner demotes it; `left` when it leaves
        or a bot lifts its ban; and `kicked` when an account removes it or a bot bans it.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        from:
          $ref: '#/components/schemas/MessageUser'
          description: >-
            The account or bot that changed the bot's standing, or the bot itself when it left.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/ChatMember'
          description: The bot's standing before the change; a bot never owns a supergroup.
        new_chat_member:
          $ref: '#/components/schemas/ChatMember'
          description: The bot's standing after the change.
    ChatMember:
      description: >-
        A user's standing in a chat, in the field order Telegram uses. Custom titles and member tags
        are not supported.
      oneOf:
        - type: object
          additionalProperties: false
          description: The supergroup's owner.
          required:
            - user
            - status
            - is_anonymous
          properties:
            user:
              $ref: '#/components/schemas/MessageUser'
            status:
              type: string
              const: creator
            is_anonymous:
              type: boolean
              const: false
        - $ref: '#/components/schemas/ChatAdministrator'
        - type: object
          additionalProperties: false
          description: >-
            A member without administrator rights, or a user that left the supergroup or never
            joined it.
          required:
            - user
            - status
          properties:
            user:
              $ref: '#/components/schemas/MessageUser'
            status:
              type: string
              enum:
                - member
                - left
        - type: object
          additionalProperties: false
          description: A banned user, which cannot be a member until its ban is lifted.
          required:
            - user
            - status
            - until_date
          properties:
            user:
              $ref: '#/components/schemas/MessageUser'
            status:
              type: string
              const: kicked
            until_date:
              type: integer
              minimum: 0
              description: >-
                Unix timestamp when the ban ends, or 0 for a ban that lasts until it is lifted.
    ChatAdministrator:
      type: object
      additionalProperties: false
      description: >-
        A supergroup administrator with every right Telegram shows, held or not. No bot may change
        an administrator's rights, since only the owner promotes administrators here.
      required:
        - user
        - status
        - can_be_edited
        - can_manage_chat
        - can_change_info
        - can_delete_messages
        - can_invite_users
        - can_restrict_members
        - can_pin_messages
        - can_manage_topics
        - can_promote_members
        - can_manage_video_chats
        - can_post_stories
        - can_edit_stories
        - can_delete_stories
        - can_manage_tags
        - can_send_welcome_messages
        - is_anonymous
        - can_manage_voice_chats
      properties:
        user:
          $ref: '#/components/schemas/MessageUser'
        status:
          type: string
          const: administrator
        can_be_edited:
          type: boolean
          const: false
        can_manage_chat:
          type: boolean
        can_change_info:
          type: boolean
        can_delete_messages:
          type: boolean
        can_invite_users:
          type: boolean
        can_restrict_members:
          type: boolean
        can_pin_messages:
          type: boolean
        can_manage_topics:
          type: boolean
        can_promote_members:
          type: boolean
        can_manage_video_chats:
          type: boolean
        can_post_stories:
          type: boolean
        can_edit_stories:
          type: boolean
        can_delete_stories:
          type: boolean
        can_manage_tags:
          type: boolean
        can_send_welcome_messages:
          type: boolean
        is_anonymous:
          type: boolean
          const: false
        can_manage_voice_chats:
          type: boolean
          description: Legacy alias of `can_manage_video_chats`.
    PrivateChatBotMember:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - user
            - status
          properties:
            user:
              $ref: '#/components/schemas/MessageSenderBot'
            status:
              type: string
              const: member
        - type: object
          additionalProperties: false
          description: The bot while the account blocks it, which Telegram shows as banned forever.
          required:
            - user
            - status
            - until_date
          properties:
            user:
              $ref: '#/components/schemas/MessageSenderBot'
            status:
              type: string
              const: kicked
            until_date:
              type: integer
              const: 0
    CallbackQueryUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - callback_query
      properties:
        update_id:
          type: integer
          minimum: 1
        callback_query:
          $ref: '#/components/schemas/BotApiCallbackQuery'
    BotApiCallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - from
        - message
        - chat_instance
        - data
      properties:
        id:
          type: string
          description: Identifier to pass to answerCallbackQuery.
        from:
          $ref: '#/components/schemas/Account'
          description: The account that pressed the button.
        message:
          $ref: '#/components/schemas/Message'
          description: The message carrying the button, as it was when the button was pressed.
        chat_instance:
          type: string
          description: >-
            Opaque signed 64-bit decimal identifying the message's chat, fixed for each private
            chat and each supergroup.
        data:
          type: string
          description: The pressed button's callback data.
    GetUpdatesRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          description: >-
            Identifier of the first update to return; earlier updates are confirmed and
            forgotten. A negative offset returns that many updates from the end of the queue and
            forgets the rest. As on Telegram, an offset more than 10 beyond the identifier the next
            update will receive is ignored, so a stale offset does not discard pending updates.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        timeout:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
        allowed_updates:
          description: >-
            Update types the bot subscribes to, matched case-insensitively. The subscription
            persists until a later request supplies this parameter and applies only to updates
            created afterward. Unrecognized names are ignored; a list with no recognized name
            selects Telegram's default, which excludes chat_member, message_reaction, and
            message_reaction_count.
          type: array
          items:
            type: string
    DeleteWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        drop_pending_updates:
          type: boolean
          default: false
          description: >-
            Discards the bot's pending updates; later updates continue its update ID sequence. As
            on Telegram, text values `true`, `yes`, and `1` are true, compared case-insensitively;
            the emulator also accepts `false`, `no`, and `0`, and rejects any other text.
    DeleteWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
        - description
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
        description:
          type: string
          enum:
            - Webhook was deleted
            - Webhook is already deleted
    SetWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          default: ''
          description: >-
            Where to post updates: an HTTP or HTTPS URL, with a missing scheme meaning HTTPS.
            Credentials in the URL are sent as a Basic `Authorization` header. An empty URL
            removes the webhook.
        max_connections:
          type: integer
          default: 40
          description: >-
            Reported by getWebhookInfo; values outside 1 to 100 are clamped, as on Telegram. The
            emulator sends one update at a time regardless.
        allowed_updates:
          description: >-
            Update types the bot subscribes to, as for getUpdates. Omitting it keeps the current
            subscription.
          type: array
          items:
            type: string
        drop_pending_updates:
          type: boolean
          default: false
          description: >-
            Discards the bot's pending updates, as for deleteWebhook. A request that drops
            updates always restarts delivery.
        secret_token:
          type: string
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]*$'
          default: ''
          description: Sent in the `X-Telegram-Bot-Api-Secret-Token` header of every webhook request.
    SetWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
        - description
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
        description:
          type: string
          enum:
            - Webhook was set
            - Webhook is already set
            - Webhook was deleted
            - Webhook is already deleted
    WebhookInfo:
      type: object
      additionalProperties: false
      required:
        - url
        - has_custom_certificate
        - pending_update_count
      properties:
        url:
          type: string
          description: The webhook URL as the bot specified it; empty without a webhook.
        has_custom_certificate:
          type: boolean
          const: false
        pending_update_count:
          type: integer
          description: Updates not yet delivered to the webhook or confirmed through getUpdates.
        last_error_date:
          type: integer
          description: Unix time of the latest failure to deliver an update to the current webhook.
        last_error_message:
          type: string
          description: >-
            Telegram's description of that failure, such as `Wrong response from the webhook: 500
            Internal Server Error` or `Can't connect to the webhook`.
        max_connections:
          type: integer
          description: Present while a webhook is set.
        allowed_updates:
          type: array
          items:
            type: string
          description: The bot's subscription, present only when it differs from Telegram's default.
    GetWebhookInfoResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/WebhookInfo'
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - text
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID. Telegram's `@username` form is not accepted, because Telegram
            resolves it only for bots and public supergroups and channels.
        text:
          type: string
          minLength: 1
          description: >-
            Message text, at most 32768 bytes before formatting is applied and 4096 characters
            after. As on Telegram, control characters become spaces, carriage returns are removed,
            and leading and trailing whitespace is trimmed, but leading whitespace only up to the
            first entity.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
        disable_notification:
          type: boolean
          description: Validated and without effect, because notifications are not modeled.
        protect_content:
          type: boolean
          default: false
          description: >-
            Protects the message from forwarding and saving, which its `has_protected_content`
            shows.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: >-
            The older form of `reply_parameters.message_id`, which Telegram still accepts; ignored
            when `reply_parameters` is given.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: >-
            The older form of `reply_parameters.allow_sending_without_reply`; ignored when
            `reply_parameters` is given.
        reply_markup:
          description: >-
            An inline keyboard to attach, or, in a private chat, a change of the reply interface
            the account's client shows. Markup that combines kinds is rejected. `selective` is
            accepted and, as on Telegram in private chats, has no effect.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    ReplyKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - keyboard
      properties:
        keyboard:
          type: array
          description: >-
            Rows of buttons. As on Telegram, an empty array sends no reply markup; empty rows are
            rejected.
          items:
            type: array
            minItems: 1
            items:
              description: >-
                A text button, written as its text or as an object. Buttons that request a
                contact, location, poll, users, chat, or web app are not supported.
              oneOf:
                - type: string
                  minLength: 1
                - $ref: '#/components/schemas/ReplyKeyboardButton'
        is_persistent:
          type: boolean
          default: false
        resize_keyboard:
          type: boolean
          default: false
        one_time_keyboard:
          type: boolean
          default: false
        input_field_placeholder:
          type: string
          minLength: 1
          maxLength: 64
        selective:
          type: boolean
    ReplyKeyboardButton:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
    ReplyKeyboardRemove:
      type: object
      additionalProperties: false
      required:
        - remove_keyboard
      properties:
        remove_keyboard:
          type: boolean
          const: true
        selective:
          type: boolean
    ForceReply:
      type: object
      additionalProperties: false
      required:
        - force_reply
      properties:
        force_reply:
          type: boolean
          const: true
        input_field_placeholder:
          type: string
          minLength: 1
          maxLength: 64
        selective:
          type: boolean
    AccountReplyInterface:
      type: object
      additionalProperties: false
      required:
        - reply_interface
      properties:
        reply_interface:
          oneOf:
            - $ref: '#/components/schemas/ReplyKeyboardInterface'
            - $ref: '#/components/schemas/ForceReplyInterface'
            - type: 'null'
    ReplyKeyboardInterface:
      type: object
      additionalProperties: false
      required:
        - type
        - message_id
        - keyboard
        - is_persistent
        - resize_keyboard
        - one_time_keyboard
      properties:
        type:
          type: string
          const: keyboard
        message_id:
          type: integer
          minimum: 1
          description: The ID of the bot message that sent the keyboard, as the bot sees it.
        keyboard:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/ReplyKeyboardButton'
        is_persistent:
          type: boolean
        resize_keyboard:
          type: boolean
        one_time_keyboard:
          type: boolean
          description: >-
            Whether clients hide the keyboard once it is used. The keyboard stays available, so
            its buttons can still be pressed.
        input_field_placeholder:
          type: string
    ForceReplyInterface:
      type: object
      additionalProperties: false
      required:
        - type
        - message_id
      properties:
        type:
          type: string
          const: force_reply
        message_id:
          type: integer
          minimum: 1
          description: >-
            The ID of the bot message the client shows a reply interface to, as the bot sees it.
        input_field_placeholder:
          type: string
    EditAccountMessageRequest:
      description: New text for a text message, or a new caption for a photo or document.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 4096
              description: >-
                The new plain text, normalized as when sending a message. It must differ from the
                message's current text after normalization.
        - type: object
          additionalProperties: false
          required:
            - caption
          properties:
            caption:
              type: string
              description: >-
                The new plain caption, normalized as when sending media; empty removes the
                caption. It must differ from the message's current caption after
                normalization.
    PressReplyKeyboardButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - text
      properties:
        chat:
          $ref: '#/components/schemas/PrivateMessageTarget'
        text:
          type: string
          minLength: 1
          description: The text of the button to press.
    ReplyParameters:
      type: object
      additionalProperties: false
      description: >-
        The message of the chat to reply to. An empty object, or a `message_id` that is not
        positive, specifies no reply. Quotes, checklist tasks, and poll options are not supported.
      properties:
        message_id:
          type: integer
          description: Identifier of the replied message in the bot's chat.
        chat_id:
          type: integer
          description: >-
            Identifier of the replied message's chat, which must be the chat the message is sent
            to; replies to messages of other chats are not supported.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: >-
            Sends the message as no reply, instead of failing, when the replied message is not
            found.
    LinkPreviewOptions:
      type: object
      additionalProperties: false
      description: >-
        Telegram's link preview options, validated and without effect, because the emulator
        generates no link previews.
      properties:
        is_disabled:
          type: boolean
        url:
          type: string
        prefer_small_media:
          type: boolean
        prefer_large_media:
          type: boolean
        show_above_text:
          type: boolean
    EditMessageTextRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
        - text
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        text:
          type: string
          minLength: 1
          description: New message text, read and normalized as by `sendMessage`.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the edited message shows; omitting it removes the keyboard.
    SendPhotoRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat, as for `sendMessage`: for a private chat, the account's user
            ID; for a supergroup, its negative chat ID.
        photo:
          type: string
          description: >-
            The `file_id` of a photo the bot knows, or `attach://<part name>` for a photo uploaded
            in that part. Without it, the photo is the part named `photo`.
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        show_caption_above_media:
          type: boolean
          default: false
          description: Shows the caption above the photo, which the message's field shows.
        has_spoiler:
          type: boolean
          default: false
          description: Covers the photo until the user reveals it, which `has_media_spoiler` shows.
        disable_notification:
          type: boolean
          description: Validated and without effect, because notifications are not modeled.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: As for `sendMessage`.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_markup:
          description: As for `sendMessage`.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    SendDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          type: integer
          description: Identifier of the chat, as for `sendMessage`.
        document:
          type: string
          description: >-
            The `file_id` of a document the bot knows, or `attach://<part name>` for a file
            uploaded in that part. Without it, the document is the part named `document`.
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        disable_content_type_detection:
          type: boolean
          description: >-
            Validated and without effect, because the emulator always sends files as documents.
        disable_notification:
          type: boolean
          description: Validated and without effect, because notifications are not modeled.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: As for `sendMessage`.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_markup:
          description: As for `sendMessage`.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    Caption:
      type: string
      default: ''
      description: >-
        Text shown with the media, read and normalized as `sendMessage` reads text, and at most
        1024 characters after formatting. As on Telegram, a caption of only whitespace is none.
    CaptionEntitiesParameter:
      type: array
      description: Entities marking the caption; ignored when `parse_mode` formats it.
      items:
        $ref: '#/components/schemas/MessageEntityParameter'
    EditMessageCaptionRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        show_caption_above_media:
          type: boolean
          default: false
          description: Shows a photo's caption above the photo; a document ignores it.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the edited message shows; omitting it removes the keyboard.
    GetFileRequest:
      type: object
      additionalProperties: false
      required:
        - file_id
      properties:
        file_id:
          $ref: '#/components/schemas/FileId'
    FileResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: false
          required:
            - file_id
            - file_unique_id
            - file_size
            - file_path
          properties:
            file_id:
              $ref: '#/components/schemas/FileId'
            file_unique_id:
              $ref: '#/components/schemas/FileUniqueId'
            file_size:
              type: integer
              minimum: 1
              description: Size of the file in bytes.
            file_path:
              type: string
              description: >-
                Where the bot downloads the file under the Bot API file route: a directory for
                the file's type, `photos` or `documents`, and a numbered name, such as
                `documents/file_0.pdf`.
    EditMessageReplyMarkupRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the message shows; omitting it removes the keyboard.
    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Message'
    DeleteMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
    DeleteMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_ids
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_ids:
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 1
          description: Identifiers of the messages in the bot's chat.
    MessageDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AnswerCallbackQueryRequest:
      type: object
      additionalProperties: false
      required:
        - callback_query_id
      properties:
        callback_query_id:
          type: string
        text:
          type: string
          maxLength: 200
          description: Notification text; omitted or empty text shows no notification.
        show_alert:
          type: boolean
          default: false
          description: Shows the text as an alert instead of a transient notification.
        cache_time:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 0
          description: Seconds for which the account's client may reuse the answer.
    AnswerCallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    PromoteSupergroupMemberRequest:
      type: object
      additionalProperties: false
      description: >-
        The rights the administrator holds, by the Bot API's names, of which at least one must be
        `true`; an omitted right is not held. Anonymous administrators are not supported.
      properties:
        can_manage_chat:
          type: boolean
          default: false
        can_change_info:
          type: boolean
          default: false
        can_delete_messages:
          type: boolean
          default: false
        can_invite_users:
          type: boolean
          default: false
        can_restrict_members:
          type: boolean
          default: false
        can_pin_messages:
          type: boolean
          default: false
        can_manage_topics:
          type: boolean
          default: false
        can_promote_members:
          type: boolean
          default: false
        can_manage_video_chats:
          type: boolean
          default: false
        can_post_stories:
          type: boolean
          default: false
        can_edit_stories:
          type: boolean
          default: false
        can_delete_stories:
          type: boolean
          default: false
        can_manage_tags:
          type: boolean
          default: false
        can_send_welcome_messages:
          type: boolean
          default: false
    GetChatMemberRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
    GetChatAdministratorsRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            which has no administrators, the account's user ID.
        return_bots:
          type: boolean
          default: false
          description: Whether to list administrators that are other bots too.
    GetChatMemberCountRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
    BanChatMemberRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            whose members cannot be banned, the account's user ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
        until_date:
          type: integer
          description: >-
            Unix timestamp when the ban ends; a ban shorter than 30 seconds or longer than 366 days
            lasts until it is lifted, as does one without an end.
        revoke_messages:
          type: boolean
          description: Accepted and ignored; Telegram always revokes access in supergroups.
    UnbanChatMemberRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            where the method is unavailable, the account's user ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
        only_if_banned:
          type: boolean
          default: false
          description: Changes nothing unless the user is banned, rather than removing a member.
    ChatMemberResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/ChatMember'
    ChatMembersResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
    IntegerResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: integer
          minimum: 0
    LeaveChatRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            which cannot be left, the account's user ID.
    SendChatActionRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - action
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        action:
          type: string
          description: >-
            The action, matched case-insensitively. Telegram's older names `record_audio`,
            `upload_audio`, and `pick_up_location` are accepted too.
          enum:
            - typing
            - upload_photo
            - record_video
            - upload_video
            - record_voice
            - upload_voice
            - upload_document
            - choose_sticker
            - find_location
            - record_video_note
            - upload_video_note
            - cancel
    BotCommand:
      type: object
      additionalProperties: false
      required:
        - command
        - description
      properties:
        command:
          type: string
          description: >-
            The command, 1-32 lowercase English letters, digits, and underscores. As a request
            parameter, a leading slash and surrounding whitespace are removed first.
        description:
          type: string
          description: The description, 1-256 characters after surrounding whitespace is removed.
        is_ephemeral:
          type: boolean
          description: Telegram's ephemeral command flag, stored as given; omitted when false.
    BotCommandScope:
      type: object
      additionalProperties: false
      description: >-
        The users and chats a command list applies to; a missing scope is the default scope.
        Chat IDs must be numbers, and chat scopes can name only private chats.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - default
            - all_private_chats
            - all_group_chats
            - all_chat_administrators
            - chat
            - chat_administrators
            - chat_member
        chat_id:
          type: integer
          description: Required for `chat`, `chat_administrators`, and `chat_member`.
        user_id:
          type: integer
          minimum: 1
          description: Required for `chat_member`.
    MyCommandsTargetRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the list, or empty for users whose language has
            no dedicated list.
    SetMyCommandsRequest:
      type: object
      additionalProperties: false
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
    BotCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
    TrueResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AccountBotCommands:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - command
              - description
              - is_ephemeral
            properties:
              command:
                type: string
              description:
                type: string
              is_ephemeral:
                type: boolean
    PressCallbackButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - message_id
        - callback_data
      properties:
        chat:
          $ref: '#/components/schemas/MessageTarget'
        message_id:
          type: integer
          minimum: 1
          description: >-
            Identifier of the message carrying the button, as message history shows it, which is
            its identifier in the bot's chat.
        callback_data:
          type: string
          minLength: 1
          description: Callback data of the button to press.
        expired:
          type: boolean
          default: false
          description: >-
            Creates the callback query already expired: the bot still receives it but cannot
            answer it.
    CallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - callback_data
        - status
        - answer
      properties:
        id:
          type: string
          description: Identifier the bot receives in its callback_query update.
        callback_data:
          type: string
        status:
          type: string
          enum:
            - awaiting_answer
            - answered
            - expired
          description: >-
            Whether the bot can still answer the query. A query is created awaiting an answer or
            already expired; the bot's accepted answer moves an awaiting query to answered. An
            answered or expired query accepts no answer.
        answer:
          description: The bot's answer when the status is `answered`, and null otherwise.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - show_alert
                - cache_time
              properties:
                text:
                  type: string
                  description: Notification text, omitted when the answer shows none.
                show_alert:
                  type: boolean
                cache_time:
                  type: integer
                  minimum: 0
    CallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - callback_query
      properties:
        callback_query:
          $ref: '#/components/schemas/CallbackQuery'
    GetUpdatesResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageUpdate'
              - $ref: '#/components/schemas/EditedMessageUpdate'
              - $ref: '#/components/schemas/CallbackQueryUpdate'
              - $ref: '#/components/schemas/MyChatMemberUpdate'
    GetMeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Bot'
    BotApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error_code
        - description
      properties:
        ok:
          type: boolean
          const: false
        error_code:
          type: integer
        description:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - botApiRoot
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier of the test session.
        botApiRoot:
          type: string
          format: uri
          description: Absolute API root for bots operating in this test session.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the test session that owns the addressed state.
      schema:
        type: string
    BotToken:
      name: token
      in: path
      required: true
      description: Token of a virtual bot owned by the addressed test session.
      schema:
        type: string
    BotId:
      name: botId
      in: path
      required: true
      description: Server-assigned identifier of a virtual bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    AccountId:
      name: accountId
      in: path
      required: true
      description: Server-assigned Telegram user identifier for a virtual account.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    MessageId:
      name: messageId
      in: path
      required: true
      description: >-
        ID of a message of the private conversation, as the conversation's bot and message
        history see it.
      schema:
        type: integer
        minimum: 1
    SupergroupChatId:
      name: chatId
      in: path
      required: true
      description: Bot API chat identifier of a supergroup.
      schema:
        $ref: '#/components/schemas/SupergroupChatId'
    SupergroupMessageId:
      name: messageId
      in: path
      required: true
      description: ID of a message of the supergroup, which every member sees alike.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Telegram user identifier of a virtual account or bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    CallbackQueryId:
      name: callbackQueryId
      in: path
      required: true
      description: Identifier of a callback query created by the addressed account.
      schema:
        type: string
    FileUniqueId:
      name: fileUniqueId
      in: path
      required: true
      description: The `file_unique_id` of a file of the session's messages.
      schema:
        $ref: '#/components/schemas/FileUniqueId'
    FileDirectory:
      name: fileDirectory
      in: path
      required: true
      description: The directory part of a `file_path` that getFile returned.
      schema:
        type: string
        enum:
          - photos
          - documents
    FileName:
      name: fileName
      in: path
      required: true
      description: The file name part of a `file_path` that getFile returned.
      schema:
        type: string
    BotApiMethod:
      name: method
      in: path
      required: true
      description: Telegram Bot API method name.
      schema:
        type: string
