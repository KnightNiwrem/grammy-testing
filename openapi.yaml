  /sessions/{sessionId}/bot-api/bot{token}/unbanChatMember:
    description: >-
      Telegram Bot API method for lifting a user's ban from a supergroup, so that it may be
      added again, which needs the `can_restrict_members` administrator right. As on Telegram,
