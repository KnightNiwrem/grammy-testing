  /sessions/{sessionId}/bot-api/bot{token}/{method}:
    description: Telegram Bot API methods invoked for a virtual bot within a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/BotApiMethod'
components:
  schemas:
    TelegramUserId:
      type: integer
      minimum: 1
      maximum: 1099511627775
    SupergroupChatId:
      type: integer
      minimum: -1997852516352
      maximum: -1000000000001
      description: Bot API chat identifier of a supergroup, which carries Telegram's `-100` prefix.
    Bot:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
        - username
        - can_join_groups
        - can_read_all_group_messages
        - supports_inline_queries
        - can_connect_to_business
        - has_main_web_app
        - has_topics_enabled
        - allows_users_to_create_topics
        - can_manage_bots
        - supports_join_request_queries
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the bot.
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        username:
          type: string
        can_join_groups:
          type: boolean
        can_read_all_group_messages:
          type: boolean
        supports_guest_queries:
          type: boolean
        supports_inline_queries:
          type: boolean
          description: Whether the bot was created with inline mode turned on.
        can_connect_to_business:
          type: boolean
        has_main_web_app:
          type: boolean
        has_topics_enabled:
          type: boolean
        allows_users_to_create_topics:
          type: boolean
        can_manage_bots:
          type: boolean
        supports_join_request_queries:
          type: boolean
    CreateBotRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - username
      properties:
        first_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        can_read_all_group_messages:
          type: boolean
          default: false
          description: >-
            Turns off the bot's privacy mode, as BotFather does, so that it receives every account
            message of its supergroups rather than only those addressed to it.
        supports_inline_queries:
          type: boolean
          default: false
          description: >-
            Turns on the bot's inline mode, as BotFather does, so that accounts can send it inline
            queries. `getMe` reports it.
        receives_chosen_inline_results:
          type: boolean
          default: false
          description: >-
            Turns on the bot's inline feedback, as BotFather does, so that it receives a
            `chosen_inline_result` update for each inline query result an account sends. It has
            effect only with inline mode.
        requests_inline_location:
          type: boolean
          default: false
          description: >-
            Turns on the bot's inline location requests, as BotFather does, so that accounts can
            share their location with its inline queries. It has effect only with inline mode.
    CreatedBot:
      type: object
      additionalProperties: false
      required:
        - token
        - bot
      properties:
        token:
          type: string
          description: Emulator-issued token used to call the Bot API as this bot.
        bot:
          $ref: '#/components/schemas/Bot'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the account.
        is_bot:
          type: boolean
          const: false
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        language_code:
          type: string
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        language_code:
          type: string
          minLength: 1
        has_private_forwards:
          type: boolean
          default: false
          description: >-
            Sets the account's "Forwarded messages" privacy setting so that forwards of its
            messages, and replies to them from other chats, do not link to it. Their origin is a
            hidden user that shows only the account's first and last name.
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          $ref: '#/components/schemas/Account'
    PrivateMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - botId
      properties:
        type:
          type: string
          const: private
        botId:
          $ref: '#/components/schemas/TelegramUserId'
    SupergroupMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - chatId
      properties:
        type:
          type: string
          const: supergroup
        chatId:
          $ref: '#/components/schemas/SupergroupChatId'
    MessageTarget:
      description: The account's private chat with a bot, or a supergroup it is a member of.
      oneOf:
        - $ref: '#/components/schemas/PrivateMessageTarget'
        - $ref: '#/components/schemas/SupergroupMessageTarget'
      discriminator:
        propertyName: type
        mapping:
          private: '#/components/schemas/PrivateMessageTarget'
          supergroup: '#/components/schemas/SupergroupMessageTarget'
    CreateSupergroupRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          description: >-
            Makes the supergroup public under this username, which must be unique among the
            session's usernames, compared without case; omitted for a private supergroup.
        description:
          type: string
          minLength: 1
    CreatedSupergroup:
      type: object
      additionalProperties: false
      required:
        - supergroup
      properties:
        supergroup:
          type: object
          additionalProperties: false
          required:
            - id
            - type
            - title
          properties:
            id:
              $ref: '#/components/schemas/SupergroupChatId'
            type:
              type: string
              const: supergroup
            title:
              type: string
            username:
              type: string
              description: The username of a public supergroup; omitted for a private one.
            description:
              type: string
    SendAccountMessageRequest:
      description: Text, a photo, or a document to send, or a message to forward.
      oneOf:
        - $ref: '#/components/schemas/SendAccountTextRequest'
        - $ref: '#/components/schemas/SendAccountPhotoRequest'
        - $ref: '#/components/schemas/SendAccountDocumentRequest'
        - $ref: '#/components/schemas/ForwardAccountMessageRequest'
    ForwardAccountMessageRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - forward
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        forward:
          type: object
          additionalProperties: false
          required:
            - chat
            - message_id
          description: >-
            The message to forward. As in Telegram's clients, a forward replies to no message.
          properties:
            chat:
              $ref: '#/components/schemas/MessageTarget'
            message_id:
              type: integer
              minimum: 1
              description: The message's ID as the chat's message history shows it.
    SendAccountTextRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - text
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Plain text, normalized as a Telegram client does: control characters become spaces,
            carriage returns are removed, and leading and trailing whitespace is trimmed. Text with
            no visible characters is rejected.
        reply_to_message_id:
          $ref: '#/components/schemas/AccountReplyToMessageId'
    SendAccountPhotoRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - photo
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        photo:
          type: object
          additionalProperties: false
          required:
            - content_base64
          properties:
            content_base64:
              type: string
              contentEncoding: base64
              description: >-
                A JPEG, PNG, GIF, WebP, or BMP image, which Telegram accepts as a photo when its
                width and height add up to at most 10000 and neither is more than 20 times the
                other. Telegram also accepts other image formats, such as TIFF, which the emulator
                rejects.
        caption:
          $ref: '#/components/schemas/AccountCaption'
        reply_to_message_id:
          $ref: '#/components/schemas/AccountReplyToMessageId'
    SendAccountDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - document
      properties:
        to:
          $ref: '#/components/schemas/MessageTarget'
        document:
          type: object
          additionalProperties: false
          required:
            - content_base64
            - file_name
          properties:
            content_base64:
              type: string
              contentEncoding: base64
              description: The file's content, which must not be empty.
            file_name:
              type: string
              minLength: 1
              description: The file's name, whose extension decides the document's MIME type.
        caption:
          $ref: '#/components/schemas/AccountCaption'
        reply_to_message_id:
          $ref: '#/components/schemas/AccountReplyToMessageId'
    AccountCaption:
      type: string
      default: ''
      description: >-
        Plain text shown with the media, normalized as message text is; a caption with no visible
        characters is none. At most 1024 characters are accepted.
    AccountReplyToMessageId:
      type: integer
      minimum: 1
      description: >-
        ID of the chat's message to reply to, as message history shows it. Omit it to send a
        message that replies to none.
    PrivateChat:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        type:
          type: string
          const: private
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    SupergroupChat:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - type
      properties:
        id:
          $ref: '#/components/schemas/SupergroupChatId'
        title:
          type: string
        username:
          type: string
          description: The username of a public supergroup; omitted for a private one.
        type:
          type: string
          const: supergroup
    SupergroupMessage:
      type: object
      additionalProperties: false
      description: >-
        A supergroup message as the requesting member sees it: one a member wrote, or a service
        message recording that members joined (`new_chat_members`) or that a member left or was
        removed (`left_chat_member`). As Telegram does, a service message also carries the legacy
        fields `new_chat_participant` and `new_chat_member`, or `left_chat_participant`. Members see
        the same message, apart from the `file_id` of its file and the legacy `new_chat_member`.
        Its other fields mean what they mean for a private message.
      required:
        - message_id
        - from
        - chat
        - date
      oneOf:
        - required:
            - text
        - required:
            - photo
        - required:
            - document
        - required:
            - new_chat_participant
            - new_chat_member
            - new_chat_members
        - required:
            - left_chat_participant
            - left_chat_member
      properties:
        message_id:
          type: integer
          minimum: 1
          description: Message ID in the supergroup's own message sequence.
        from:
          description: >-
            The member, an account or a bot, that wrote the message, or that added, removed, or
            left as a service message records.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        date:
          type: integer
          minimum: 0
        edit_date:
          type: integer
          minimum: 0
        forward_origin:
          $ref: '#/components/schemas/MessageOrigin'
        forward_from:
          $ref: '#/components/schemas/MessageUser'
          description: >-
            Legacy form of `forward_origin.sender_user`, present only for a forward whose origin is
            a user.
        forward_sender_name:
          type: string
          minLength: 1
          description: >-
            Legacy form of `forward_origin.sender_user_name`, present only for a forward whose
            origin is a hidden user.
        forward_date:
          type: integer
          minimum: 0
          description: Legacy form of `forward_origin.date`, present only for a forward.
        reply_to_message:
          $ref: '#/components/schemas/SupergroupMessage'
        external_reply:
          $ref: '#/components/schemas/ExternalReplyInfo'
        quote:
          $ref: '#/components/schemas/TextQuote'
        text:
          type: string
        entities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageEntity'
        photo:
          type: array
          minItems: 1
          description: >-
            The sizes of a photo message's photo, smallest first. Telegram converts a photo to
            JPEG and keeps it in several sizes; the emulator keeps the one size and the format it
            was sent in.
          items:
            $ref: '#/components/schemas/PhotoSize'
        document:
          $ref: '#/components/schemas/Document'
        caption:
          type: string
          minLength: 1
          description: The caption of a photo or document, omitted when it has none.
        caption_entities:
          type: array
          minItems: 1
          description: Entities marked in the caption, as in text; omitted when there are none.
          items:
            $ref: '#/components/schemas/MessageEntity'
        show_caption_above_media:
          type: boolean
          const: true
          description: Present when clients show the photo's caption above the photo.
        has_media_spoiler:
          type: boolean
          const: true
          description: Present when clients cover the photo until the user reveals it.
        new_chat_participant:
          $ref: '#/components/schemas/MessageUser'
          description: Legacy alias of `new_chat_member`.
        new_chat_member:
          $ref: '#/components/schemas/MessageUser'
          description: >-
            Legacy field: the requesting member if it is among the new members, otherwise the first
            of them.
        new_chat_members:
          type: array
          minItems: 1
          description: The accounts and bots that joined.
          items:
            $ref: '#/components/schemas/MessageUser'
        left_chat_participant:
          $ref: '#/components/schemas/MessageUser'
          description: Legacy alias of `left_chat_member`.
        left_chat_member:
          $ref: '#/components/schemas/MessageUser'
          description: The account or bot that left or was removed.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
        via_bot:
          $ref: '#/components/schemas/MessageSenderBot'
        has_protected_content:
          type: boolean
          const: true
    ExternalReplyInfo:
      type: object
      additionalProperties: false
      description: >-
        The message of another chat that a message replies to, present only for such a reply. As
        TDLib's `RepliedMessageInfo` keeps it, it shows where the replied message first appeared,
        its supergroup and ID when it is a supergroup message, and a photo or document without
        its caption. The replied text or caption appears as the reply's `quote` instead.
      required:
        - origin
      properties:
        origin:
          $ref: '#/components/schemas/MessageOrigin'
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        message_id:
          type: integer
          minimum: 1
        photo:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PhotoSize'
        has_media_spoiler:
          type: boolean
          const: true
        document:
          $ref: '#/components/schemas/Document'
    TextQuote:
      type: object
      additionalProperties: false
      description: >-
        The quoted part of the replied message's text or caption: the part the sender chose, or,
        for a reply to another chat's message without one, up to its first 1,024 characters.
        Quotes keep only bold, italic, underline, strikethrough, spoiler, custom emoji, and date
        and time entities.
      required:
        - text
        - position
      properties:
        text:
          type: string
          minLength: 1
        entities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageEntity'
        position:
          type: integer
          minimum: 0
          description: Where the quote starts in the replied text, in UTF-16 code units.
        is_manual:
          type: boolean
          const: true
          description: Present when the sender chose the quote.
    MessageOrigin:
      description: >-
        Where a forward, or a message of another chat that a message replies to, first appeared.
      oneOf:
        - $ref: '#/components/schemas/MessageOriginUser'
        - $ref: '#/components/schemas/MessageOriginHiddenUser'
      discriminator:
        propertyName: type
        mapping:
          user: '#/components/schemas/MessageOriginUser'
          hidden_user: '#/components/schemas/MessageOriginHiddenUser'
    MessageOriginHiddenUser:
      type: object
      additionalProperties: false
      description: >-
        The origin of a message of an account created with `has_private_forwards`: only the
        account's name, and when it sent the original message.
      required:
        - type
        - sender_user_name
        - date
      properties:
        type:
          type: string
          const: hidden_user
        sender_user_name:
          type: string
          minLength: 1
        date:
          type: integer
          minimum: 0
    MessageOriginUser:
      type: object
      additionalProperties: false
      description: >-
        Where a forward, or a message of another chat that a message replies to, first appeared:
        the account or bot that sent the original message, and when.
      required:
        - type
        - sender_user
        - date
      properties:
        type:
          type: string
          const: user
        sender_user:
          $ref: '#/components/schemas/MessageUser'
        date:
          type: integer
          minimum: 0
    MessageUser:
      description: An account or a bot as a message shows it.
      oneOf:
        - $ref: '#/components/schemas/Account'
        - $ref: '#/components/schemas/MessageSenderBot'
    Message:
      description: A message of a private chat or a supergroup.
      oneOf:
        - $ref: '#/components/schemas/PrivateMessage'
        - $ref: '#/components/schemas/SupergroupMessage'
    PrivateMessage:
      type: object
      additionalProperties: false
      description: >-
        A private-chat message as the conversation's bot sees it: text, a photo, or a document,
        each with the fields Telegram shows for it.
      required:
        - message_id
        - from
        - chat
        - date
      oneOf:
        - required:
            - text
        - required:
            - photo
        - required:
            - document
      properties:
        message_id:
          type: integer
          minimum: 1
          description: >-
            Message ID in the conversation bot's message sequence, which spans all of that bot's
            private chats. Other observers can number the same message differently.
        from:
          description: The account or bot that wrote the message.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/PrivateChat'
          description: The account's private chat, whichever participant wrote the message.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp when the emulator accepted the message.
        edit_date:
          type: integer
          minimum: 0
          description: >-
            Unix timestamp of the last edit of the text or caption by its author, omitted if the
            message's content was never edited. Replacing only the inline keyboard does not change
            it.
        forward_origin:
          $ref: '#/components/schemas/MessageOrigin'
        forward_from:
          $ref: '#/components/schemas/MessageUser'
          description: >-
            Legacy form of `forward_origin.sender_user`, present only for a forward whose origin is
            a user.
        forward_sender_name:
          type: string
          minLength: 1
          description: >-
            Legacy form of `forward_origin.sender_user_name`, present only for a forward whose
            origin is a hidden user.
        forward_date:
          type: integer
          minimum: 0
          description: Legacy form of `forward_origin.date`, present only for a forward.
        reply_to_message:
          $ref: '#/components/schemas/PrivateMessage'
          description: >-
            The current state of the message this one replies to, which never has a
            `reply_to_message` of its own. Omitted when the message is no reply or the replied
            message was deleted.
        external_reply:
          $ref: '#/components/schemas/ExternalReplyInfo'
        quote:
          $ref: '#/components/schemas/TextQuote'
        text:
          type: string
          description: The text of a text message.
        entities:
          type: array
          minItems: 1
          description: >-
            Entities marked in the text, omitted when there are none: formatting the bot applied,
            and bot commands, which, as Telegram does in chats with bots, the emulator marks in text
            written by either participant. Other entity types Telegram detects, such
            as URLs and mentions, are not detected.
          items:
            $ref: '#/components/schemas/MessageEntity'
        photo:
          type: array
          minItems: 1
          description: >-
            The sizes of a photo message's photo, smallest first. Telegram converts a photo to
            JPEG and keeps it in several sizes; the emulator keeps the one size and the format it
            was sent in.
          items:
            $ref: '#/components/schemas/PhotoSize'
        document:
          $ref: '#/components/schemas/Document'
        caption:
          type: string
          minLength: 1
          description: The caption of a photo or document, omitted when it has none.
        caption_entities:
          type: array
          minItems: 1
          description: Entities marked in the caption, as in text; omitted when there are none.
          items:
            $ref: '#/components/schemas/MessageEntity'
        show_caption_above_media:
          type: boolean
          const: true
          description: Present when clients show the photo's caption above the photo.
        has_media_spoiler:
          type: boolean
          const: true
          description: Present when clients cover the photo until the user reveals it.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: >-
            The inline keyboard the bot attached, or the inline bot of a message sent through it;
            omitted when there is none.
        via_bot:
          $ref: '#/components/schemas/MessageSenderBot'
          description: >-
            The bot through whose inline mode the account sent the message, or the original of a
            forward; omitted for other messages.
        has_protected_content:
          type: boolean
          const: true
          description: >-
            Present when the bot protected the message from forwarding and saving with
            `protect_content`, or when the message belongs to a supergroup whose owner protects all
            its content.
        effect_id:
          type: string
          pattern: '^-?\d+$'
          description: >-
            The message effect the bot chose with `message_effect_id`, as the decimal text of its
            64-bit identifier; omitted for none.
    PhotoSize:
      type: object
      additionalProperties: false
      required:
        - file_id
        - file_unique_id
        - file_size
        - width
        - height
      properties:
        file_id:
          $ref: '#/components/schemas/FileId'
        file_unique_id:
          $ref: '#/components/schemas/FileUniqueId'
        file_size:
          type: integer
          minimum: 1
          description: Size of the file in bytes.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Document:
      type: object
      additionalProperties: false
      required:
        - file_name
        - mime_type
        - file_id
        - file_unique_id
        - file_size
      properties:
        file_name:
          type: string
          minLength: 1
          description: >-
            The file's name. The Bot API server cleans the name of a file a bot uploads, as TDLib's
            `clean_filename` does, and names a file whose name cleans to nothing `file`.
        mime_type:
          type: string
          minLength: 1
          description: >-
            The MIME type Telegram derives from the file name's extension, matched
            case-insensitively; `application/octet-stream` for an extension the emulator does not
            recognize.
        file_id:
          $ref: '#/components/schemas/FileId'
        file_unique_id:
          $ref: '#/components/schemas/FileUniqueId'
        file_size:
          type: integer
          minimum: 1
          description: Size of the file in bytes.
    FileId:
      type: string
      minLength: 1
      description: >-
        Identifier of a file for the user that sees it. As on Telegram, each user knows a file by a
        `file_id` of its own, so a bot can send or download a file only by its own `file_id`.
    FileUniqueId:
      type: string
      minLength: 1
      description: >-
        Identifier of a file that is the same for every user; it can neither send nor, through the
        Bot API, download the file.
    InlineKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - inline_keyboard
      properties:
        inline_keyboard:
          type: array
          description: >-
            Rows of buttons. As a request parameter, an empty array attaches no keyboard, as on
            Telegram; empty rows are rejected.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/InlineKeyboardButton'
    ButtonStyle:
      type: string
      description: >-
        How clients color the button: `primary`, `danger` or `success`. As a request field, the
        name is read in any ASCII letter case, and an empty name or `default` chooses the client's
        default style, which responses omit.
    ButtonIconCustomEmojiId:
      type: string
      pattern: '^-?\d+$'
      description: >-
        The 64-bit identifier of the custom emoji that clients show before the button's text, as
        decimal text; as a request field, `0` chooses none. Responses omit it for none. The
        emulator keeps the identifier for inspection without checking that the emoji exists.
    InlineKeyboardButton:
      description: >-
        A button with exactly one action. Telegram also accepts login, Web App, game and payment
        buttons, and buttons with several actions, using the first action it recognizes; the
        emulator rejects them.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
            - callback_data
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            callback_data:
              type: string
              minLength: 1
              description: >-
                Data sent to the bot in a callback query, at most 64 bytes when UTF-8 encoded.
        - type: object
          additionalProperties: false
          required:
            - text
            - url
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            url:
              type: string
              minLength: 1
              description: >-
                A link as Telegram reads it: an HTTP or HTTPS URL, whose scheme defaults to
                `http`, or a `tg:`, `ton:` or `tonsite:` link. Responses show it normalized, as
                `http://grammy.dev/` for `grammy.dev`; a `tg://user?id=` link opens the user's
                profile. A link Telegram refuses fails with `Bad Request: inline keyboard button
                URL '…' is invalid: …`.
        - type: object
          additionalProperties: false
          required:
            - text
            - copy_text
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            copy_text:
              type: object
              additionalProperties: false
              description: The text the button copies to the clipboard.
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 256
        - type: object
          additionalProperties: false
          required:
            - text
            - switch_inline_query
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            switch_inline_query:
              type: string
              description: >-
                The query that pressing the button puts after the bot's username in a chat the
                user chooses; empty for the username alone. Pressing the button involves only the
                user's client, so tests send the inline query itself.
        - type: object
          additionalProperties: false
          required:
            - text
            - switch_inline_query_current_chat
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            switch_inline_query_current_chat:
              type: string
              description: >-
                The query that pressing the button puts after the bot's username in the message's
                own chat.
        - type: object
          additionalProperties: false
          required:
            - text
            - switch_inline_query_chosen_chat
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            switch_inline_query_chosen_chat:
              type: object
              additionalProperties: false
              description: >-
                A query for a chat the user chooses among the allowed kinds. As a request field,
                omitted fields default to an empty query and to kinds that are not allowed; at
                least one kind must be allowed (`Bad Request: At least one chat type must be
                allowed`). As on Telegram, responses show a button that allows every kind as a
                `switch_inline_query` button, and every field of any other.
              properties:
                query:
                  type: string
                allow_user_chats:
                  type: boolean
                allow_bot_chats:
                  type: boolean
                allow_group_chats:
                  type: boolean
                allow_channel_chats:
                  type: boolean
        - type: object
          additionalProperties: false
          required:
            - text
            - disabled
          properties:
            text:
              type: string
              minLength: 1
            icon_custom_emoji_id:
              $ref: '#/components/schemas/ButtonIconCustomEmojiId'
            style:
              $ref: '#/components/schemas/ButtonStyle'
            disabled:
              type: object
              additionalProperties: false
              description: Marks a button that does nothing when pressed.
    MessageSenderBot:
      type: object
      additionalProperties: false
      description: A bot as a message sender, without the capabilities that only getMe reports.
      required:
        - id
        - is_bot
        - first_name
        - username
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    MessageEntity:
      type: object
      additionalProperties: false
      description: >-
        A marked span of message text. Formatting that overlaps other entities is split so that
        entities nest properly, as on Telegram. Mentions, hashtags, cashtags, bot commands, URLs,
        email addresses and bank card numbers are detected in the text as Telegram detects them,
        outside other entities; phone numbers are not detected.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
          enum:
            - mention
            - hashtag
            - cashtag
            - bot_command
            - url
            - email
            - bank_card_number
            - bold
            - italic
            - underline
            - strikethrough
            - spoiler
            - code
            - pre
            - text_link
            - text_mention
            - custom_emoji
            - date_time
            - blockquote
            - expandable_blockquote
        offset:
          type: integer
          minimum: 0
          description: Offset in UTF-16 code units to the start of the entity.
        length:
          type: integer
          minimum: 1
          description: Length of the entity in UTF-16 code units.
        language:
          type: string
          description: For `pre`, the programming language of the code, when one is given.
        url:
          type: string
          description: For `text_link`, the link as Telegram normalized it.
        user:
          description: For `text_mention`, the mentioned user.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        custom_emoji_id:
          type: string
          description: For `custom_emoji`, the custom emoji's identifier.
        unix_time:
          type: integer
          minimum: 1
          description: For `date_time`, the shown moment as a Unix time.
        date_time_format:
          type: string
          pattern: '^(r|w?[dD]?[tT]?)$'
          description: >-
            For `date_time`, how clients show it, as the official Bot API server reports it: `r`
            for relative time, otherwise `w` for the day of the week, `d` or `D` for a short or long
            date, then `t` or `T` for a short or long time; empty when the bot chose no format.
    MessageEntityParameter:
      type: object
      additionalProperties: false
      description: >-
        An entity a bot specifies, as a Bot API `MessageEntity`. Types that Telegram detects by
        itself (`mention`, `hashtag`, `cashtag`, `bot_command`, `url`, `email`, `phone_number`,
        and `bank_card_number`) are accepted and ignored, so entities of a received message can be
        sent back. Telegram reads numbers written as strings; the emulator rejects them.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
        offset:
          type: integer
        length:
          type: integer
        language:
          type: string
        url:
          type: string
          description: For `text_link`; a `tg://user?id=` link makes a text mention.
        user:
          type: object
          description: For `text_mention`; only its `id` is read, and it must be a session user.
          required:
            - id
          properties:
            id:
              type: integer
        custom_emoji_id:
          type: string
        unix_time:
          type: integer
          description: For `date_time`, a positive Unix time.
        date_time_format:
          type: string
          description: >-
            For `date_time`, how clients show it: `r` or `R` for relative time, or letters choosing
            the parts shown, `t` or `T` for a short or long time, `d` or `D` for a short or long
            date, and `w` or `W` for the day of the week. The last letter for a part decides its
            precision. Empty or omitted, no format is chosen.
    ParseMode:
      type: string
      description: >-
        Markup to read the text as, matched case-insensitively: `HTML`, `MarkdownV2`, or the
        legacy `Markdown`, parsed as Telegram does. `none` or omitting it leaves the text as it is.
    SentMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/PrivateMessage'
    MessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PrivateMessage'
    SentSupergroupMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/SupergroupMessage'
    SupergroupMessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SupergroupMessage'
    MessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - message
      properties:
        update_id:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/Message'
    EditedMessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - edited_message
      properties:
        update_id:
          type: integer
          minimum: 1
        edited_message:
          $ref: '#/components/schemas/Message'
          description: >-
            An account's message as its edit left it. A bot receives no update for bots' edits.
    MyChatMemberUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - my_chat_member
      properties:
        update_id:
          type: integer
          minimum: 1
        my_chat_member:
          oneOf:
            - $ref: '#/components/schemas/PrivateChatMemberUpdated'
            - $ref: '#/components/schemas/SupergroupChatMemberUpdated'
    ChatMemberUpdate:
      type: object
      additionalProperties: false
      description: >-
        Received only by a bot that requests `chat_member` in `allowed_updates` and is an
        administrator of the supergroup, as on Telegram.
      required:
        - update_id
        - chat_member
      properties:
        update_id:
          type: integer
          minimum: 1
        chat_member:
          $ref: '#/components/schemas/SupergroupMemberUpdated'
    SupergroupMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        A change of another user's standing in a supergroup: an account or bot joins, leaves, or
        is removed, promoted, demoted, banned, or unbanned. A change of the bot's own standing is a
        my_chat_member update instead.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        from:
          $ref: '#/components/schemas/MessageUser'
          description: The account or bot that made the change, or the member itself when it left.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/ChatMember'
        new_chat_member:
          $ref: '#/components/schemas/ChatMember'
    PrivateChatMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        A change of the bot's membership in an account's private chat: `member` becomes `kicked`
        when the account blocks the bot, and `kicked` becomes `member` when it unblocks the bot.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/PrivateChat'
        from:
          $ref: '#/components/schemas/Account'
          description: The account that blocked or unblocked the bot.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/PrivateChatBotMember'
        new_chat_member:
          $ref: '#/components/schemas/PrivateChatBotMember'
    SupergroupChatMemberUpdated:
      type: object
      additionalProperties: false
      description: >-
        A change of the bot's standing in a supergroup: it becomes `member` from `left`, or from
        `kicked` after a ban, when an account adds it; `administrator` when the owner promotes it
        or changes its rights, and `member` again when the owner demotes it; `left` when it leaves
        or a bot lifts its ban; and `kicked` when an account removes it or a bot bans it.
      required:
        - chat
        - from
        - date
        - old_chat_member
        - new_chat_member
      properties:
        chat:
          $ref: '#/components/schemas/SupergroupChat'
        from:
          $ref: '#/components/schemas/MessageUser'
          description: >-
            The account or bot that changed the bot's standing, or the bot itself when it left.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp of the change.
        old_chat_member:
          $ref: '#/components/schemas/ChatMember'
          description: The bot's standing before the change; a bot never owns a supergroup.
        new_chat_member:
          $ref: '#/components/schemas/ChatMember'
          description: The bot's standing after the change.
    ChatMember:
      description: >-
        A user's standing in a chat, in the field order Telegram uses. Member tags are not
        supported.
      oneOf:
        - type: object
          additionalProperties: false
          description: The supergroup's owner.
          required:
            - user
            - status
            - is_anonymous
          properties:
            user:
              $ref: '#/components/schemas/MessageUser'
            status:
              type: string
              const: creator
            custom_title:
              $ref: '#/components/schemas/CustomTitle'
            is_anonymous:
              type: boolean
              const: false
        - $ref: '#/components/schemas/ChatAdministrator'
        - type: object
          additionalProperties: false
          description: >-
            A member without administrator rights, or a user that left the supergroup or never
            joined it.
          required:
            - user
            - status
          properties:
            user:
              $ref: '#/components/schemas/MessageUser'
            status:
              type: string
              enum:
                - member
                - left
        - type: object
          additionalProperties: false
          description: A banned user, which cannot be a member until its ban is lifted.
          required:
            - user
            - status
            - until_date
          properties:
            user:
              $ref: '#/components/schemas/MessageUser'
            status:
              type: string
              const: kicked
            until_date:
              type: integer
              minimum: 0
              description: >-
                Unix timestamp when the ban ends, or 0 for a ban that lasts until it is lifted.
    ChatAdministrator:
      type: object
      additionalProperties: false
      description: >-
        A supergroup administrator with every right Telegram shows, held or not. No bot may change
        an administrator's rights, since only the owner promotes administrators here.
      required:
        - user
        - status
        - can_be_edited
        - can_manage_chat
        - can_change_info
        - can_delete_messages
        - can_invite_users
        - can_restrict_members
        - can_pin_messages
        - can_manage_topics
        - can_promote_members
        - can_manage_video_chats
        - can_post_stories
        - can_edit_stories
        - can_delete_stories
        - can_manage_tags
        - can_send_welcome_messages
        - is_anonymous
        - can_manage_voice_chats
      properties:
        user:
          $ref: '#/components/schemas/MessageUser'
        status:
          type: string
          const: administrator
        can_be_edited:
          type: boolean
          const: false
        can_manage_chat:
          type: boolean
        can_change_info:
          type: boolean
        can_delete_messages:
          type: boolean
        can_invite_users:
          type: boolean
        can_restrict_members:
          type: boolean
        can_pin_messages:
          type: boolean
        can_manage_topics:
          type: boolean
        can_promote_members:
          type: boolean
        can_manage_video_chats:
          type: boolean
        can_post_stories:
          type: boolean
        can_edit_stories:
          type: boolean
        can_delete_stories:
          type: boolean
        can_manage_tags:
          type: boolean
        can_send_welcome_messages:
          type: boolean
        is_anonymous:
          type: boolean
          const: false
        can_manage_voice_chats:
          type: boolean
          description: Legacy alias of `can_manage_video_chats`.
        custom_title:
          $ref: '#/components/schemas/CustomTitle'
    ChatIdentifier:
      description: >-
        A chat as a Bot API method names it: by its identifier, or, as the official server's
        `check_chat` reads it, by `@` followed by a public username. A username names a public
        supergroup, or the private chat with a bot; any other username fails with `Bad Request:
        chat not found`. The emulator resolves a username in `chat_id` or `from_chat_id` before
        reading the method's other parameters, so a request with another fault may fail for the
        username instead.
      oneOf:
        - type: integer
        - type: string
          pattern: '^@'
    CustomTitle:
      type: string
      minLength: 1
      maxLength: 16
      description: >-
        The title that clients show for the owner or an administrator in place of its role, which
        the owner sets; omitted for none.
    SetCustomTitleRequest:
      type: object
      additionalProperties: false
      required:
        - custom_title
      properties:
        custom_title:
          type: string
          maxLength: 16
          description: >-
            The new title, of at most 16 characters counted as Unicode code points and without
            emoji, as the Bot API documents it; empty removes the title.
    SetChatAdministratorCustomTitleRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            where the method is unavailable, the account's user ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
        custom_title:
          type: string
          description: The new title, which the method never applies here.
    PrivateChatBotMember:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - user
            - status
          properties:
            user:
              $ref: '#/components/schemas/MessageSenderBot'
            status:
              type: string
              const: member
        - type: object
          additionalProperties: false
          description: The bot while the account blocks it, which Telegram shows as banned forever.
          required:
            - user
            - status
            - until_date
          properties:
            user:
              $ref: '#/components/schemas/MessageSenderBot'
            status:
              type: string
              const: kicked
            until_date:
              type: integer
              const: 0
    InlineQueryUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - inline_query
      properties:
        update_id:
          type: integer
          minimum: 1
        inline_query:
          $ref: '#/components/schemas/BotApiInlineQuery'
    BotApiInlineQuery:
      type: object
      additionalProperties: false
      description: An inline query, in the field order Telegram uses.
      required:
        - id
        - from
        - chat_type
        - query
        - offset
      properties:
        id:
          type: string
          description: Identifier to pass to answerInlineQuery.
        from:
          $ref: '#/components/schemas/Account'
          description: The account that sent the query.
        location:
          $ref: '#/components/schemas/Location'
          description: >-
            Where the account is, present only when it shared its location with a bot created with
            `requests_inline_location`.
        chat_type:
          type: string
          enum:
            - sender
            - private
            - supergroup
          description: >-
            The chat where the account typed the query: `sender` for its private chat with the
            inline bot itself, `private` for its private chat with another bot.
        query:
          type: string
          maxLength: 256
        offset:
          type: string
          description: >-
            The `next_offset` of an earlier answer, requesting more results; empty for the first.
    ChosenInlineResultUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - chosen_inline_result
      properties:
        update_id:
          type: integer
          minimum: 1
        chosen_inline_result:
          $ref: '#/components/schemas/BotApiChosenInlineResult'
    BotApiChosenInlineResult:
      type: object
      additionalProperties: false
      description: >-
        An inline query result the account sent, in the field order Telegram uses. Only a bot
        created with `receives_chosen_inline_results` receives it.
      required:
        - from
        - query
        - result_id
      properties:
        from:
          $ref: '#/components/schemas/Account'
          description: The account that sent the result.
        location:
          $ref: '#/components/schemas/Location'
          description: The location the account shared with the query, if any.
        inline_message_id:
          type: string
          description: Identifier of the sent message, present only when it has an inline keyboard.
        query:
          type: string
          description: The query of the answer that held the result.
        result_id:
          type: string
    Location:
      type: object
      additionalProperties: false
      description: A point on Earth, in the field order Telegram uses.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        horizontal_accuracy:
          type: number
          minimum: 0
          maximum: 1500
          description: >-
            The radius of uncertainty in meters; omitted when unknown. As TDLib sends it to
            Telegram, a shared accuracy shows rounded up to whole meters, and an accuracy of 0 means
            unknown.
    CallbackQueryUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - callback_query
      properties:
        update_id:
          type: integer
          minimum: 1
        callback_query:
          $ref: '#/components/schemas/BotApiCallbackQuery'
    BotApiCallbackQuery:
      description: >-
        A press of a callback button: on a message of the bot's chat, which it carries, or on a
        message sent through the bot's inline mode, which the bot knows only by its
        `inline_message_id`.
      oneOf:
        - $ref: '#/components/schemas/ChatMessageCallbackQuery'
        - $ref: '#/components/schemas/InlineMessageCallbackQuery'
    InlineMessageCallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - from
        - inline_message_id
        - chat_instance
        - data
      properties:
        id:
          type: string
          description: Identifier to pass to answerCallbackQuery.
        from:
          $ref: '#/components/schemas/Account'
          description: The account that pressed the button.
        inline_message_id:
          type: string
          description: Identifier of the message carrying the button, by which the bot edits it.
        chat_instance:
          type: string
          description: Opaque signed 64-bit decimal identifying the chat the message was sent to.
        data:
          type: string
          description: The pressed button's callback data.
    ChatMessageCallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - from
        - message
        - chat_instance
        - data
      properties:
        id:
          type: string
          description: Identifier to pass to answerCallbackQuery.
        from:
          $ref: '#/components/schemas/Account'
          description: The account that pressed the button.
        message:
          $ref: '#/components/schemas/Message'
          description: The message carrying the button, as it was when the button was pressed.
        chat_instance:
          type: string
          description: >-
            Opaque signed 64-bit decimal identifying the message's chat, fixed for each private
            chat and each supergroup.
        data:
          type: string
          description: The pressed button's callback data.
    GetUpdatesRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          description: >-
            Identifier of the first update to return; earlier updates are confirmed and
            forgotten. A negative offset returns that many updates from the end of the queue and
            forgets the rest. As on Telegram, an offset more than 10 beyond the identifier the next
            update will receive is ignored, so a stale offset does not discard pending updates.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        timeout:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
        allowed_updates:
          description: >-
            Update types the bot subscribes to, matched case-insensitively. The subscription
            persists until a later request supplies this parameter and applies only to updates
            created afterward. Unrecognized names are ignored; a list with no recognized name
            selects Telegram's default, which excludes chat_member, message_reaction, and
            message_reaction_count.
          type: array
          items:
            type: string
    DeleteWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        drop_pending_updates:
          type: boolean
          default: false
          description: >-
            Discards the bot's pending updates; later updates continue its update ID sequence. As
            on Telegram, text values `true`, `yes`, and `1` are true, compared case-insensitively;
            the emulator also accepts `false`, `no`, and `0`, and rejects any other text.
    DeleteWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
        - description
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
        description:
          type: string
          enum:
            - Webhook was deleted
            - Webhook is already deleted
    SetWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          default: ''
          description: >-
            Where to post updates: an HTTP or HTTPS URL, with a missing scheme meaning HTTPS.
            Credentials in the URL are sent as a Basic `Authorization` header. An empty URL
            removes the webhook.
        max_connections:
          type: integer
          default: 40
          description: >-
            How many updates, each of a different queue, are sent at once; values outside 1 to 100
            are clamped, as on Telegram. Reported by getWebhookInfo.
        allowed_updates:
          description: >-
            Update types the bot subscribes to, as for getUpdates. Omitting it keeps the current
            subscription.
          type: array
          items:
            type: string
        drop_pending_updates:
          type: boolean
          default: false
          description: >-
            Discards the bot's pending updates, as for deleteWebhook. A request that drops
            updates always restarts delivery.
        secret_token:
          type: string
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]*$'
          default: ''
          description: Sent in the `X-Telegram-Bot-Api-Secret-Token` header of every webhook request.
    SetWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
        - description
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
        description:
          type: string
          enum:
            - Webhook was set
            - Webhook is already set
            - Webhook was deleted
            - Webhook is already deleted
    WebhookInfo:
      type: object
      additionalProperties: false
      required:
        - url
        - has_custom_certificate
        - pending_update_count
      properties:
        url:
          type: string
          description: The webhook URL as the bot specified it; empty without a webhook.
        has_custom_certificate:
          type: boolean
          const: false
        pending_update_count:
          type: integer
          description: Updates not yet delivered to the webhook or confirmed through getUpdates.
        last_error_date:
          type: integer
          description: Unix time of the latest failure to deliver an update to the current webhook.
        last_error_message:
          type: string
          description: >-
            Telegram's description of that failure, such as `Wrong response from the webhook: 500
            Internal Server Error` or `Can't connect to the webhook`.
        max_connections:
          type: integer
          description: Present while a webhook is set.
        allowed_updates:
          type: array
          items:
            type: string
          description: The bot's subscription, present only when it differs from Telegram's default.
    GetWebhookInfoResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/WebhookInfo'
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - text
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID, or `@` followed by the username of a public supergroup.
        text:
          type: string
          minLength: 1
          description: >-
            Message text, at most 32768 bytes before formatting is applied and 4096 characters
            after. As on Telegram, control characters become spaces, carriage returns are removed,
            and leading and trailing whitespace is trimmed, but leading whitespace only up to the
            first entity.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
        disable_notification:
          type: boolean
          default: false
          description: >-
            Makes the recipients' notifications of the message silent, as the chat's notifications
            show.
        protect_content:
          type: boolean
          default: false
          description: >-
            Protects the message from forwarding and saving, which its `has_protected_content`
            shows.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: >-
            Identifier of a message effect for a private chat, which the message's `effect_id`
            shows; `0` chooses none. Telegram refuses effects in supergroups (`Bad Request: can't
            use message effects in the chat`). The emulator has no catalogue of Telegram's
            effects, so any 64-bit identifier is accepted.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: >-
            The older form of `reply_parameters.message_id`, which Telegram still accepts; ignored
            when `reply_parameters` is given.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: >-
            The older form of `reply_parameters.allow_sending_without_reply`; ignored when
            `reply_parameters` is given.
        reply_markup:
          description: >-
            An inline keyboard to attach, or a change of the reply interface the account's client
            shows. Markup that combines kinds is rejected. In a supergroup, the change applies to
            every account member, or, with `selective`, only to the members the message mentions
            and the sender of the message it replies to; as on Telegram, `selective` has no effect
            in private chats. A keyboard removal removes only a keyboard or forced reply the same
            bot sent.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    ReplyKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - keyboard
      properties:
        keyboard:
          type: array
          description: >-
            Rows of buttons. As on Telegram, an empty array sends no reply markup; empty rows are
            rejected.
          items:
            type: array
            minItems: 1
            items:
              description: >-
                A text button, written as its text or as an object. Buttons that request a
                contact, location, poll, users, chat, or web app are not supported.
              oneOf:
                - type: string
                  minLength: 1
                - $ref: '#/components/schemas/ReplyKeyboardButton'
        is_persistent:
          type: boolean
          default: false
        resize_keyboard:
          type: boolean
          default: false
        one_time_keyboard:
          type: boolean
          default: false
        input_field_placeholder:
          type: string
          minLength: 1
          maxLength: 64
        selective:
          type: boolean
          default: false
          description: >-
            In a supergroup, applies the markup only to the members the message mentions and the
            sender of the message it replies to. It has no effect in private chats.
    ReplyKeyboardButton:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
        icon_custom_emoji_id:
          $ref: '#/components/schemas/ButtonIconCustomEmojiId'
        style:
          $ref: '#/components/schemas/ButtonStyle'
    ReplyKeyboardRemove:
      type: object
      additionalProperties: false
      required:
        - remove_keyboard
      properties:
        remove_keyboard:
          type: boolean
          const: true
        selective:
          type: boolean
          default: false
          description: >-
            In a supergroup, applies the markup only to the members the message mentions and the
            sender of the message it replies to. It has no effect in private chats.
    ForceReply:
      type: object
      additionalProperties: false
      required:
        - force_reply
      properties:
        force_reply:
          type: boolean
          const: true
        input_field_placeholder:
          type: string
          minLength: 1
          maxLength: 64
        selective:
          type: boolean
          default: false
          description: >-
            In a supergroup, applies the markup only to the members the message mentions and the
            sender of the message it replies to. It has no effect in private chats.
    AccountReplyInterface:
      type: object
      additionalProperties: false
      required:
        - reply_interface
      properties:
        reply_interface:
          oneOf:
            - $ref: '#/components/schemas/ReplyKeyboardInterface'
            - $ref: '#/components/schemas/ForceReplyInterface'
            - type: 'null'
    ReplyKeyboardInterface:
      type: object
      additionalProperties: false
      required:
        - type
        - message_id
        - keyboard
        - is_persistent
        - resize_keyboard
        - one_time_keyboard
      properties:
        type:
          type: string
          const: keyboard
        message_id:
          type: integer
          minimum: 1
          description: The ID of the bot message that sent the keyboard, as the bot sees it.
        keyboard:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/ReplyKeyboardButton'
        is_persistent:
          type: boolean
        resize_keyboard:
          type: boolean
        one_time_keyboard:
          type: boolean
          description: >-
            Whether clients hide the keyboard once it is used. The keyboard stays available, so
            its buttons can still be pressed.
        input_field_placeholder:
          type: string
    ForceReplyInterface:
      type: object
      additionalProperties: false
      required:
        - type
        - message_id
      properties:
        type:
          type: string
          const: force_reply
        message_id:
          type: integer
          minimum: 1
          description: >-
            The ID of the bot message the client shows a reply interface to, as the bot sees it.
        input_field_placeholder:
          type: string
    EditAccountMessageRequest:
      description: New text for a text message, or a new caption for a photo or document.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 4096
              description: >-
                The new plain text, normalized as when sending a message. It must differ from the
                message's current text after normalization.
        - type: object
          additionalProperties: false
          required:
            - caption
          properties:
            caption:
              type: string
              description: >-
                The new plain caption, normalized as when sending media; empty removes the
                caption. It must differ from the message's current caption after
                normalization.
    PressReplyKeyboardButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - text
      properties:
        chat:
          $ref: '#/components/schemas/MessageTarget'
        text:
          type: string
          minLength: 1
          description: The text of the button to press.
    ReplyParameters:
      type: object
      additionalProperties: false
      description: >-
        The message to reply to. An empty object, or a `message_id` that is not positive,
        specifies no reply. Checklist tasks and poll options are not supported.
      properties:
        message_id:
          type: integer
          description: Identifier of the replied message in the bot's chat.
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the replied message's chat, a private chat with an account that has
            written to the bot or a supergroup the bot is a member of; omitted for the chat the
            message is sent to. A reply to another chat's message shows it in `external_reply`
            and quotes its text or caption. As TDLib does, a message that cannot be forwarded,
            such as protected content or a service message, is silently not replied to.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: >-
            Sends the message as no reply, instead of failing, when the replied message is not
            found.
        quote:
          type: string
          description: >-
            The part of the replied message to quote, formatted by `quote_parse_mode` or
            `quote_entities`. As TDLib's `MessageQuote` does, it is normalized like message text,
            and ignored when that fails or leaves it empty. It must then be an exact part of the
            replied text or caption, including its bold, italic, underline, strikethrough,
            spoiler, custom emoji, and date and time entities, and at most 1,024 characters long,
            or the message is not sent (`Bad Request: QUOTE_TEXT_INVALID`). Other entities are
            left out of the quote.
        quote_parse_mode:
          type: string
          description: How to parse `quote`'s formatting, as `parse_mode` parses message text.
        quote_entities:
          type: array
          description: The entities of `quote`, instead of `quote_parse_mode`.
          items:
            $ref: '#/components/schemas/MessageEntity'
        quote_position:
          type: integer
          default: 0
          description: >-
            Where the quote starts in the replied text, in UTF-16 code units. The quote is placed
            at its occurrence nearest to this position, searching as TDLib's `search_quote` does.
    LinkPreviewOptions:
      type: object
      additionalProperties: false
      description: >-
        Telegram's link preview options, validated and without effect, because the emulator
        generates no link previews.
      properties:
        is_disabled:
          type: boolean
        url:
          type: string
        prefer_small_media:
          type: boolean
        prefer_large_media:
          type: boolean
        show_above_text:
          type: boolean
    EditMessageTextRequest:
      type: object
      additionalProperties: false
      description: >-
        Addresses a message of a chat by `chat_id` and `message_id`, or a message sent through the
        bot's inline mode by `inline_message_id`.
      required:
        - text
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        inline_message_id:
          type: string
          description: >-
            Identifier of a message sent through the bot's inline mode, used without `chat_id` and
            `message_id`.
        text:
          type: string
          minLength: 1
          description: New message text, read and normalized as by `sendMessage`.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the edited message shows; omitting it removes the keyboard.
    SendPhotoRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat, as for `sendMessage`: for a private chat, the account's user
            ID; for a supergroup, its negative chat ID.
        photo:
          type: string
          description: >-
            The `file_id` of a photo the bot knows, or `attach://<part name>` for a photo uploaded
            in that part. Without it, the photo is the part named `photo`.
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        show_caption_above_media:
          type: boolean
          default: false
          description: Shows the caption above the photo, which the message's field shows.
        has_spoiler:
          type: boolean
          default: false
          description: Covers the photo until the user reveals it, which `has_media_spoiler` shows.
        disable_notification:
          type: boolean
          default: false
          description: As for `sendMessage`.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: As for `sendMessage`.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: As for `sendMessage`.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_markup:
          description: As for `sendMessage`.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    ForwardMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - from_chat_id
        - message_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat to forward to, as for `sendMessage`: for a private chat, the
            account's user ID; for a supergroup, its negative chat ID.
        from_chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat of the forwarded message, as for `chat_id`.
        message_id:
          type: integer
          description: The forwarded message's ID in the bot's chat.
        disable_notification:
          type: boolean
          default: false
          description: As for `sendMessage`.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: As for `sendMessage`.
    ForwardMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - from_chat_id
        - message_ids
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat to forward to, as for `forwardMessage`.
        from_chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat of the forwarded messages, as for `chat_id`.
        message_ids:
          $ref: '#/components/schemas/RepeatedMessageIds'
        disable_notification:
          type: boolean
          default: false
          description: As for `sendMessage`.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: >-
            As for `sendMessage`. As on Telegram, only a request whose identifiers find a
            single message may use one (`Bad Request: can't use message effects in the
            method`).
    CopyMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - from_chat_id
        - message_ids
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat to copy to, as for `forwardMessage`.
        from_chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat of the copied messages, as for `chat_id`.
        message_ids:
          $ref: '#/components/schemas/RepeatedMessageIds'
        disable_notification:
          type: boolean
          default: false
          description: As for `sendMessage`.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: >-
            As for `sendMessage`. As on Telegram, only a request whose identifiers find a
            single message may use one (`Bad Request: can't use message effects in the
            method`).
        remove_caption:
          type: boolean
          default: false
          description: Sends copies of photos and documents without their captions.
    RepeatedMessageIds:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: integer
        minimum: 1
      description: >-
        Identifiers of messages in the bot's chat, in strictly increasing order. Identifiers of no
        message are skipped.
    CopyMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - from_chat_id
        - message_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat to copy to, as for `forwardMessage`.
        from_chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat of the copied message, as for `chat_id`.
        message_id:
          type: integer
          description: The copied message's ID in the bot's chat.
        caption:
          type: string
          maxLength: 1024
          description: >-
            A caption that replaces the caption of a copied photo or document; an empty caption
            removes it. Omitted, the caption is kept. Text messages ignore it.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        show_caption_above_media:
          type: boolean
          default: false
          description: With a new caption of a photo, shows it above the photo.
        disable_notification:
          type: boolean
          default: false
          description: As for `sendMessage`.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: As for `sendMessage`.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: As for `sendMessage`.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_markup:
          description: As for `sendMessage`; the copy never keeps the original's reply markup.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    SendDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Identifier of the chat, as for `sendMessage`.
        document:
          type: string
          description: >-
            The `file_id` of a document the bot knows, or `attach://<part name>` for a file
            uploaded in that part. Without it, the document is the part named `document`.
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        disable_content_type_detection:
          type: boolean
          description: >-
            Validated and without effect, because the emulator always sends files as documents.
        disable_notification:
          type: boolean
          default: false
          description: As for `sendMessage`.
        protect_content:
          type: boolean
          default: false
          description: As for `sendMessage`.
        message_effect_id:
          type: string
          pattern: '^-?\d+$'
          description: As for `sendMessage`.
        reply_parameters:
          $ref: '#/components/schemas/ReplyParameters'
        reply_to_message_id:
          type: integer
          description: As for `sendMessage`.
        allow_sending_without_reply:
          type: boolean
          default: false
          description: As for `sendMessage`.
        reply_markup:
          description: As for `sendMessage`.
          oneOf:
            - $ref: '#/components/schemas/InlineKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardMarkup'
            - $ref: '#/components/schemas/ReplyKeyboardRemove'
            - $ref: '#/components/schemas/ForceReply'
    Caption:
      type: string
      default: ''
      description: >-
        Text shown with the media, read and normalized as `sendMessage` reads text, and at most
        1024 characters after formatting. As on Telegram, a caption of only whitespace is none.
    CaptionEntitiesParameter:
      type: array
      description: Entities marking the caption; ignored when `parse_mode` formats it.
      items:
        $ref: '#/components/schemas/MessageEntityParameter'
    EditMessageCaptionRequest:
      type: object
      additionalProperties: false
      description: >-
        Addresses a message of a chat by `chat_id` and `message_id`, or a message sent through the
        bot's inline mode by `inline_message_id`.
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        inline_message_id:
          type: string
          description: >-
            Identifier of a message sent through the bot's inline mode, used without `chat_id` and
            `message_id`.
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        show_caption_above_media:
          type: boolean
          default: false
          description: Shows a photo's caption above the photo; a document ignores it.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the edited message shows; omitting it removes the keyboard.
    GetFileRequest:
      type: object
      additionalProperties: false
      required:
        - file_id
      properties:
        file_id:
          $ref: '#/components/schemas/FileId'
    FileResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: false
          required:
            - file_id
            - file_unique_id
            - file_size
            - file_path
          properties:
            file_id:
              $ref: '#/components/schemas/FileId'
            file_unique_id:
              $ref: '#/components/schemas/FileUniqueId'
            file_size:
              type: integer
              minimum: 1
              description: Size of the file in bytes.
            file_path:
              type: string
              description: >-
                Where the bot downloads the file under the Bot API file route: a directory for
                the file's type, `photos` or `documents`, and a numbered name, such as
                `documents/file_0.pdf`.
    EditMessageReplyMarkupRequest:
      type: object
      additionalProperties: false
      description: >-
        Addresses a message of a chat by `chat_id` and `message_id`, or a message sent through the
        bot's inline mode by `inline_message_id`.
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        inline_message_id:
          type: string
          description: >-
            Identifier of a message sent through the bot's inline mode, used without `chat_id` and
            `message_id`.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the message shows; omitting it removes the keyboard.
    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Message'
    MessageIdResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: false
          required:
            - message_id
          properties:
            message_id:
              type: integer
              minimum: 1
              description: The new message's ID in the bot's chat.
    MessageIdsResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - message_id
            properties:
              message_id:
                type: integer
                minimum: 1
                description: A new message's ID in the bot's chat.
    EditMessageResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          description: The edited message of a chat, or `true` for an edited inline message.
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: boolean
              const: true
    DeleteMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
    DeleteMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_ids
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        message_ids:
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 1
          description: Identifiers of the messages in the bot's chat.
    MessageDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AnswerCallbackQueryRequest:
      type: object
      additionalProperties: false
      required:
        - callback_query_id
      properties:
        callback_query_id:
          type: string
        text:
          type: string
          maxLength: 200
          description: Notification text; omitted or empty text shows no notification.
        show_alert:
          type: boolean
          default: false
          description: Shows the text as an alert instead of a transient notification.
        url:
          type: string
          description: >-
            A link for the account's client to open; empty for none. The Bot API allows a game's
            URL for a game button, and links like `t.me/<bot_username>?start=<parameter>` that
            start the bot. The emulator has no game buttons, so it accepts only a link that starts
            the answering bot: `t.me`, `telegram.me`, or `telegram.dog` links, with or without a
            scheme, and `tg://resolve?domain=<bot_username>&start=<parameter>`, where the start
            parameter has at most 64 letters, digits, underscores, and hyphens.
        cache_time:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 0
          description: Seconds for which the account's client may reuse the answer.
    AnswerCallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    PromoteSupergroupMemberRequest:
      type: object
      additionalProperties: false
      description: >-
        The rights the administrator holds, by the Bot API's names, of which at least one must be
        `true`; an omitted right is not held. Anonymous administrators are not supported.
      properties:
        can_manage_chat:
          type: boolean
          default: false
        can_change_info:
          type: boolean
          default: false
        can_delete_messages:
          type: boolean
          default: false
        can_invite_users:
          type: boolean
          default: false
        can_restrict_members:
          type: boolean
          default: false
        can_pin_messages:
          type: boolean
          default: false
        can_manage_topics:
          type: boolean
          default: false
        can_promote_members:
          type: boolean
          default: false
        can_manage_video_chats:
          type: boolean
          default: false
        can_post_stories:
          type: boolean
          default: false
        can_edit_stories:
          type: boolean
          default: false
        can_delete_stories:
          type: boolean
          default: false
        can_manage_tags:
          type: boolean
          default: false
        can_send_welcome_messages:
          type: boolean
          default: false
    GetChatMemberRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
    GetChatAdministratorsRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            which has no administrators, the account's user ID.
        return_bots:
          type: boolean
          default: false
          description: Whether to list administrators that are other bots too.
    GetChatMemberCountRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
    BanChatMemberRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            whose members cannot be banned, the account's user ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
        until_date:
          type: integer
          description: >-
            Unix timestamp when the ban ends; a ban shorter than 30 seconds or longer than 366 days
            lasts until it is lifted, as does one without an end.
        revoke_messages:
          type: boolean
          description: Accepted and ignored; Telegram always revokes access in supergroups.
    UnbanChatMemberRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - user_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            where the method is unavailable, the account's user ID.
        user_id:
          $ref: '#/components/schemas/TelegramUserId'
        only_if_banned:
          type: boolean
          default: false
          description: Changes nothing unless the user is banned, rather than removing a member.
    ChatMemberResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/ChatMember'
    ChatMembersResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
    IntegerResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: integer
          minimum: 0
    LeaveChatRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a supergroup, its negative chat ID; for a private chat,
            which cannot be left, the account's user ID.
    SendChatActionRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - action
      properties:
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: >-
            Identifier of the chat: for a private chat, the account's user ID; for a supergroup,
            its negative chat ID.
        action:
          type: string
          description: >-
            The action, matched case-insensitively. Telegram's older names `record_audio`,
            `upload_audio`, and `pick_up_location` are accepted too.
          enum:
            - typing
            - upload_photo
            - record_video
            - upload_video
            - record_voice
            - upload_voice
            - upload_document
            - choose_sticker
            - find_location
            - record_video_note
            - upload_video_note
            - cancel
    BotCommand:
      type: object
      additionalProperties: false
      required:
        - command
        - description
      properties:
        command:
          type: string
          description: >-
            The command, 1-32 lowercase English letters, digits, and underscores. As a request
            parameter, a leading slash and surrounding whitespace are removed first.
        description:
          type: string
          description: The description, 1-256 characters after surrounding whitespace is removed.
        is_ephemeral:
          type: boolean
          description: Telegram's ephemeral command flag, stored as given; omitted when false.
    BotCommandScope:
      type: object
      additionalProperties: false
      description: >-
        The users and chats a command list applies to; a missing scope is the default scope.
        Chat IDs must be numbers, and chat scopes can name only private chats.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - default
            - all_private_chats
            - all_group_chats
            - all_chat_administrators
            - chat
            - chat_administrators
            - chat_member
        chat_id:
          $ref: '#/components/schemas/ChatIdentifier'
          description: Required for `chat`, `chat_administrators`, and `chat_member`.
        user_id:
          type: integer
          minimum: 1
          description: Required for `chat_member`.
    MyCommandsTargetRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the list, or empty for users whose language has
            no dedicated list.
    SetMyCommandsRequest:
      type: object
      additionalProperties: false
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
    BotCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
    MyDescriptionTargetRequest:
      type: object
      additionalProperties: false
      properties:
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the text, or empty for users whose language has
            no dedicated text.
    SetMyDescriptionRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: The new description; empty removes the description for the language.
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the text, or empty for users whose language has
            no dedicated text.
    SetMyShortDescriptionRequest:
      type: object
      additionalProperties: false
      properties:
        short_description:
          type: string
          description: The new short description; empty removes it for the language.
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the text, or empty for users whose language has
            no dedicated text.
    BotDescriptionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: false
          required:
            - description
          properties:
            description:
              type: string
              description: Empty if none is set for the language.
    BotShortDescriptionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: false
          required:
            - short_description
          properties:
            short_description:
              type: string
              description: Empty if none is set for the language.
    ChatAdministratorRights:
      type: object
      additionalProperties: false
      description: >-
        Rights of an administrator; a missing right is false.
      properties:
        can_manage_chat:
          type: boolean
        can_change_info:
          type: boolean
        can_post_messages:
          type: boolean
        can_edit_messages:
          type: boolean
        can_delete_messages:
          type: boolean
        can_invite_users:
          type: boolean
        can_restrict_members:
          type: boolean
        can_pin_messages:
          type: boolean
        can_manage_topics:
          type: boolean
        can_promote_members:
          type: boolean
        can_manage_video_chats:
          type: boolean
        can_post_stories:
          type: boolean
        can_edit_stories:
          type: boolean
        can_delete_stories:
          type: boolean
        can_manage_direct_messages:
          type: boolean
        can_manage_tags:
          type: boolean
        can_send_welcome_messages:
          type: boolean
        is_anonymous:
          type: boolean
    SetMyDefaultAdministratorRightsRequest:
      type: object
      additionalProperties: false
      properties:
        rights:
          $ref: '#/components/schemas/ChatAdministratorRights'
        for_channels:
          type: boolean
          description: Whether the rights are for channels rather than groups.
    GetMyDefaultAdministratorRightsRequest:
      type: object
      additionalProperties: false
      properties:
        for_channels:
          type: boolean
          description: Whether to read the rights for channels rather than groups.
    DefaultAdministratorRightsResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: object
          additionalProperties: false
          description: >-
            Every right that applies to the kind of chat, in the Bot API's order. Groups show
            neither `can_post_messages`, `can_edit_messages` nor `can_manage_direct_messages`;
            channels show neither `can_pin_messages`, `can_manage_topics` nor `can_manage_tags`.
          properties:
            can_manage_chat:
              type: boolean
            can_change_info:
              type: boolean
            can_post_messages:
              type: boolean
            can_edit_messages:
              type: boolean
            can_delete_messages:
              type: boolean
            can_invite_users:
              type: boolean
            can_restrict_members:
              type: boolean
            can_pin_messages:
              type: boolean
            can_manage_topics:
              type: boolean
            can_promote_members:
              type: boolean
            can_manage_video_chats:
              type: boolean
            can_post_stories:
              type: boolean
            can_edit_stories:
              type: boolean
            can_delete_stories:
              type: boolean
            can_manage_direct_messages:
              type: boolean
            can_manage_tags:
              type: boolean
            can_send_welcome_messages:
              type: boolean
            is_anonymous:
              type: boolean
    TrueResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AccountBotCommands:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/AccountBotCommand'
    AccountBotCommand:
      type: object
      additionalProperties: false
      required:
        - command
        - description
        - is_ephemeral
      properties:
        command:
          type: string
        description:
          type: string
        is_ephemeral:
          type: boolean
    AccountNotifications:
      type: object
      additionalProperties: false
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - message_id
              - is_silent
            properties:
              message_id:
                type: integer
                minimum: 1
                description: The notifying message's ID, as the chat's bots see it.
              is_silent:
                type: boolean
                description: Whether the sender asked for the notification to play no sound.
    AccountChatActions:
      type: object
      additionalProperties: false
      required:
        - chat_actions
      properties:
        chat_actions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - bot_id
              - action
            properties:
              bot_id:
                type: integer
              action:
                type: string
                description: The action by its Bot API name, in lowercase.
                enum:
                  - typing
                  - record_video
                  - upload_video
                  - record_voice
                  - upload_voice
                  - upload_photo
                  - upload_document
                  - choose_sticker
                  - find_location
                  - record_video_note
                  - upload_video_note
    AccountSupergroupBotCommands:
      type: object
      additionalProperties: false
      required:
        - bot_commands
      properties:
        bot_commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - bot_id
              - commands
            properties:
              bot_id:
                type: integer
              commands:
                type: array
                items:
                  $ref: '#/components/schemas/AccountBotCommand'
    PressCallbackButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - message_id
        - callback_data
      properties:
        chat:
          $ref: '#/components/schemas/MessageTarget'
        message_id:
          type: integer
          minimum: 1
          description: >-
            Identifier of the message carrying the button, as message history shows it, which is
            its identifier in the bot's chat.
        callback_data:
          type: string
          minLength: 1
          description: Callback data of the button to press.
        expired:
          type: boolean
          default: false
          description: >-
            Creates the callback query already expired: the bot still receives it but cannot
            answer it.
    CallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - callback_data
        - status
        - answer
      properties:
        id:
          type: string
          description: Identifier the bot receives in its callback_query update.
        callback_data:
          type: string
        status:
          type: string
          enum:
            - awaiting_answer
            - answered
            - expired
          description: >-
            Whether the bot can still answer the query. A query is created awaiting an answer or
            already expired; the bot's accepted answer moves an awaiting query to answered. An
            answered or expired query accepts no answer.
        answer:
          description: The bot's answer when the status is `answered`, and null otherwise.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - show_alert
                - cache_time
              properties:
                text:
                  type: string
                  description: Notification text, omitted when the answer shows none.
                show_alert:
                  type: boolean
                url:
                  type: string
                  description: >-
                    The link that starts the bot, which the account's client opens; omitted when
                    the answer has none.
                cache_time:
                  type: integer
                  minimum: 0
    CallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - callback_query
      properties:
        callback_query:
          $ref: '#/components/schemas/CallbackQuery'
    SendInlineQueryRequest:
      type: object
      additionalProperties: false
      required:
        - bot_id
        - chat
      properties:
        bot_id:
          $ref: '#/components/schemas/TelegramUserId'
          description: The inline bot, whose username the account types before the query.
        chat:
          $ref: '#/components/schemas/MessageTarget'
          description: The chat where the account types the query, to which a chosen result is sent.
        query:
          type: string
          maxLength: 256
          default: ''
          description: >-
            The query text, of at most 256 characters counted as Unicode code points; empty when
            the account typed only the bot's username.
        offset:
          type: string
          default: ''
          description: >-
            The `next_offset` of an earlier answer, requesting more results; empty for the first.
        location:
          $ref: '#/components/schemas/Location'
          description: >-
            Where the account is, shared only with a bot created with `requests_inline_location`;
            omitted to share no location.
    ChooseInlineQueryResultRequest:
      type: object
      additionalProperties: false
      required:
        - result_id
      properties:
        result_id:
          type: string
          minLength: 1
          description: Identifier of the result in the bot's answer.
    InlineQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - bot_id
        - chat
        - query
        - offset
        - status
        - answer
      properties:
        id:
          type: string
          description: Identifier the bot receives in its inline_query update.
        bot_id:
          $ref: '#/components/schemas/TelegramUserId'
        chat:
          $ref: '#/components/schemas/MessageTarget'
        query:
          type: string
        offset:
          type: string
        location:
          $ref: '#/components/schemas/Location'
          description: The location the account shared with the bot; omitted for none.
        status:
          type: string
          enum:
            - awaiting_answer
            - answered
          description: Whether the bot has answered the query; the bot answers a query once.
        answer:
          description: The bot's answer when the status is `answered`, and null otherwise.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - results
                - cache_time
                - is_personal
                - next_offset
              properties:
                results:
                  type: array
                  maxItems: 50
                  description: >-
                    The results as the account's client lists them. What sending one writes shows
                    in the sent message.
                  items:
                    $ref: '#/components/schemas/AccountInlineQueryResult'
                cache_time:
                  type: integer
                  minimum: 0
                  maximum: 86400
                is_personal:
                  type: boolean
                next_offset:
                  type: string
                  description: The offset that requests more results; empty when there are no more.
                button:
                  $ref: '#/components/schemas/InlineQueryResultsButton'
    AccountInlineQueryResult:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - article
            - photo
            - document
        id:
          type: string
        title:
          type: string
          minLength: 1
          description: Omitted for a photo without a title.
        description:
          type: string
          minLength: 1
          description: Omitted when the bot gave none.
        url:
          type: string
          minLength: 1
          description: The URL of an article, omitted when the bot gave none or hid it.
    InlineQueryResponse:
      type: object
      additionalProperties: false
      required:
        - inline_query
      properties:
        inline_query:
          $ref: '#/components/schemas/InlineQuery'
    AnswerInlineQueryRequest:
      type: object
      additionalProperties: false
      required:
        - inline_query_id
        - results
      properties:
        inline_query_id:
          type: string
        results:
          type: array
          description: >-
            The results, whose `type` Telegram matches case-insensitively. Telegram reads a missing
            list as empty.
          items:
            $ref: '#/components/schemas/InlineQueryResult'
        cache_time:
          type: integer
          default: 300
          description: >-
            Seconds for which the same query receives this answer again instead of reaching the
            bot; Telegram clamps it to 0 through 86400.
        is_personal:
          type: boolean
          default: false
          description: >-
            Whether the answer is reused only for the account that sent the query; otherwise the
            same query from any account receives it.
        next_offset:
          type: string
          default: ''
          maxLength: 64
          description: The offset the client sends to request more results; empty for no more.
        button:
          $ref: '#/components/schemas/InlineQueryResultsButton'
        switch_pm_text:
          type: string
          description: >-
            The older form of a `button` that opens the bot's private chat, used when `button` is
            omitted.
        switch_pm_parameter:
          type: string
          description: The start parameter of the button that `switch_pm_text` forms.
    InlineQueryResultsButton:
      description: >-
        The button the account's client shows above the results: it opens the bot's private chat
        with a start parameter, or a Web App at an HTTPS URL.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
            - start_parameter
          properties:
            text:
              type: string
            start_parameter:
              type: string
              minLength: 1
              maxLength: 64
              pattern: '^[A-Za-z0-9_-]+$'
        - type: object
          additionalProperties: false
          required:
            - text
            - web_app
          properties:
            text:
              type: string
            web_app:
              type: object
              additionalProperties: false
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  pattern: '^https://'
    InlineQueryResult:
      description: An article, or a photo or document the bot knows by `file_id`.
      oneOf:
        - $ref: '#/components/schemas/InlineQueryResultArticle'
        - $ref: '#/components/schemas/InlineQueryResultCachedPhoto'
        - $ref: '#/components/schemas/InlineQueryResultCachedDocument'
    InlineQueryResultArticle:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - title
        - input_message_content
      properties:
        type:
          type: string
          const: article
        id:
          $ref: '#/components/schemas/InlineQueryResultId'
        title:
          type: string
          minLength: 1
        input_message_content:
          $ref: '#/components/schemas/InputTextMessageContent'
          description: The text message that sending the article writes, which must have text.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
        url:
          type: string
        hide_url:
          type: boolean
          description: The older way to omit `url`, which Telegram honors by not sending the URL.
        description:
          type: string
        thumbnail_url:
          type: string
        thumbnail_width:
          type: integer
        thumbnail_height:
          type: integer
    InlineQueryResultCachedPhoto:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - photo_file_id
      properties:
        type:
          type: string
          const: photo
        id:
          $ref: '#/components/schemas/InlineQueryResultId'
        photo_file_id:
          $ref: '#/components/schemas/FileId'
        title:
          type: string
        description:
          type: string
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        show_caption_above_media:
          type: boolean
          default: false
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
        input_message_content:
          $ref: '#/components/schemas/InputTextMessageContent'
          description: Text that sending the result writes instead of the photo, if it has text.
    InlineQueryResultCachedDocument:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - title
        - document_file_id
      properties:
        type:
          type: string
          const: document
        id:
          $ref: '#/components/schemas/InlineQueryResultId'
        title:
          type: string
          minLength: 1
        document_file_id:
          $ref: '#/components/schemas/FileId'
        description:
          type: string
        caption:
          $ref: '#/components/schemas/Caption'
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        caption_entities:
          $ref: '#/components/schemas/CaptionEntitiesParameter'
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
        input_message_content:
          $ref: '#/components/schemas/InputTextMessageContent'
          description: Text that sending the result writes instead of the document, if it has text.
    InlineQueryResultId:
      type: string
      minLength: 1
      description: The bot's identifier of the result, of 1 to 64 bytes and unique within its answer.
    InputTextMessageContent:
      type: object
      additionalProperties: false
      properties:
        message_text:
          type: string
          description: The text to send, read and normalized as by `sendMessage`; an empty text is none.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        link_preview_options:
          $ref: '#/components/schemas/LinkPreviewOptions'
        disable_web_page_preview:
          type: boolean
          description: The older form of `link_preview_options`, validated and without effect.
    GetUpdatesResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageUpdate'
              - $ref: '#/components/schemas/EditedMessageUpdate'
              - $ref: '#/components/schemas/InlineQueryUpdate'
              - $ref: '#/components/schemas/ChosenInlineResultUpdate'
              - $ref: '#/components/schemas/CallbackQueryUpdate'
              - $ref: '#/components/schemas/MyChatMemberUpdate'
              - $ref: '#/components/schemas/ChatMemberUpdate'
    GetMeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Bot'
    BotApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error_code
        - description
      properties:
        ok:
          type: boolean
          const: false
        error_code:
          type: integer
        description:
          type: string
        parameters:
          type: object
          additionalProperties: false
          description: Present on a `429` rate limit answer.
          required:
            - retry_after
          properties:
            retry_after:
              type: integer
              minimum: 1
              description: How many seconds the bot should wait before retrying.
    RateLimitResponses:
      type: object
      additionalProperties: false
      required:
        - retry_after
        - remaining_count
      properties:
        method:
          type: string
          description: >-
            The Bot API method whose calls receive the answers, by its current name, such as
            `banChatMember` for `kickChatMember`; omitted for calls of every method.
        retry_after:
          type: integer
          minimum: 1
          description: The `retry_after`, in seconds, of every answer.
        remaining_count:
          type: integer
          minimum: 1
          description: How many of the bot's next matching calls still receive an answer.
    QueueRateLimitResponsesRequest:
      type: object
      additionalProperties: false
      required:
        - retry_after
      properties:
        method:
          type: string
          description: >-
            An implemented Bot API method, by any name Telegram accepts for it, matched
            case-insensitively; omit it to limit calls of every method.
        retry_after:
          type: integer
          minimum: 1
          description: The `retry_after`, in seconds, of every answer.
        count:
          type: integer
          minimum: 1
          default: 1
          description: How many of the bot's next matching calls receive an answer.
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - botApiRoot
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier of the test session.
        botApiRoot:
          type: string
          format: uri
          description: Absolute API root for bots operating in this test session.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the test session that owns the addressed state.
      schema:
        type: string
    BotToken:
      name: token
      in: path
      required: true
      description: Token of a virtual bot owned by the addressed test session.
      schema:
        type: string
    BotId:
      name: botId
      in: path
      required: true
      description: Server-assigned identifier of a virtual bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    AccountId:
      name: accountId
      in: path
      required: true
      description: Server-assigned Telegram user identifier for a virtual account.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    MessageId:
      name: messageId
      in: path
      required: true
      description: >-
        ID of a message of the private conversation, as the conversation's bot and message
        history see it.
      schema:
        type: integer
        minimum: 1
    SupergroupChatId:
      name: chatId
      in: path
      required: true
      description: Bot API chat identifier of a supergroup.
      schema:
        $ref: '#/components/schemas/SupergroupChatId'
    SupergroupMessageId:
      name: messageId
      in: path
      required: true
      description: ID of a message of the supergroup, which every member sees alike.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Telegram user identifier of a virtual account or bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    CallbackQueryId:
      name: callbackQueryId
      in: path
      required: true
      description: Identifier of a callback query created by the addressed account.
      schema:
        type: string
    InlineQueryId:
      name: inlineQueryId
      in: path
      required: true
      description: Identifier of an inline query sent by the addressed account.
      schema:
        type: string
    FileUniqueId:
      name: fileUniqueId
      in: path
      required: true
      description: The `file_unique_id` of a file of the session's messages.
      schema:
        $ref: '#/components/schemas/FileUniqueId'
    FileDirectory:
      name: fileDirectory
      in: path
      required: true
      description: The directory part of a `file_path` that getFile returned.
      schema:
        type: string
        enum:
          - photos
          - documents
    FileName:
      name: fileName
      in: path
      required: true
      description: The file name part of a `file_path` that getFile returned.
      schema:
        type: string
    BotApiMethod:
      name: method
      in: path
      required: true
      description: Telegram Bot API method name.
      schema:
        type: string
  responses:
    BotApiRateLimited:
      description: >-
        A test queued a rate limit answer for this call with `queueRateLimitResponses`. As on
        Telegram, the `Retry-After` header and `parameters.retry_after` say how many seconds to
        wait before retrying.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BotApiErrorResponse'
