openapi: 3.1.1
info:
  title: grammY Testing Emulation Server
  version: 0.0.0
  description: >-
    HTTP interface for isolated Telegram Bot API test sessions. Objects marked with
    `x-implementation-status: unimplemented` describe agreed API surface that is not available
    from the server yet. Marked path items without operations record routing topology only.


    Bot API paths follow Telegram's request conventions, so each listed POST operation also
    accepts GET, and method names match case-insensitively. Parameters can be supplied in the
    query string or in an `application/json`, `application/x-www-form-urlencoded`, or
    `multipart/form-data` body; a query-string parameter takes precedence over a body parameter
    of the same name. Any parameter value can be sent as text, with array parameters such as
    `allowed_updates` as JSON text. Telegram tolerates unknown parameters, malformed values, and
    bodies it cannot decode; the emulator rejects them with a `400` Bot API error so that tests
    surface the mistake.


    As on Telegram, a method the emulator does not implement is answered, after the token is
    authenticated, with a `404` Bot API error described as `Not Found: method not found`. A path
    under a session's Bot API root that does not name both a bot token and a method is answered
    with a `404` Bot API error described as `Not Found`, before any token is checked.
servers:
  - url: http://{domain}:{port}
    variables:
      domain:
        default: localhost
        description: Domain advertised to clients.
      port:
        default: '8081'
        description: Port on which the standalone server listens.
paths:
  /sessions:
    description: Collection of isolated Telegram test sessions.
    post:
      operationId: createSession
      summary: Create an isolated test session
      responses:
        '201':
          description: The test session was created.
          headers:
            Location:
              description: Relative URL of the created test session.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /sessions/{sessionId}:
    description: One isolated Telegram test session and the lifecycle of everything it owns.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: deleteSession
      summary: End an isolated test session
      description: >-
        Discards the session and all virtual entities and state that it owns. Long polls that its bots
        hold are answered at once without updates.
      responses:
        '204':
          description: The test session and all of its state were discarded.
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bots:
    description: Virtual bots owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createBot
      summary: Create a virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: The virtual bot was created.
          headers:
            Location:
              description: Relative URL of the created virtual bot.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBot'
        '400':
          description: The request body is malformed or does not match the bot creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/bots/{botId}:
    description: One virtual bot owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotId'
  /sessions/{sessionId}/accounts:
    description: Virtual Telegram accounts owned by a test session.
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: createAccount
      summary: Create a virtual Telegram account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The virtual account was created.
          headers:
            Location:
              description: Relative URL of the created virtual account.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          description: The request body is malformed or does not match the account creation schema.
        '404':
          description: No active test session has the supplied identifier.
        '409':
          description: The username is already assigned within the test session.
        '507':
          description: The test session cannot allocate another Telegram user identifier.
  /sessions/{sessionId}/accounts/{accountId}:
    description: One virtual Telegram account owned by a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
  /sessions/{sessionId}/accounts/{accountId}/messages:
    description: Messages sent by one virtual account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: sendAccountMessage
      summary: Send a message as a virtual account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAccountMessageRequest'
      responses:
        '201':
          description: >-
            The message was stored and, unless the target bot's allowed_updates subscription
            excludes message updates, an update was enqueued for the target bot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          description: The request or message text is invalid.
        '404':
          description: The session, sending account, or target bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/messages:
    description: Stored messages in a private conversation between an account and bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateMessageHistory
      summary: Return the private conversation's stored messages
      description: >-
        Returns the messages written by either participant, oldest first, as the bot sees them:
        each message carries the bot's message ID, and its chat is the account. Messages the bot
        deleted are omitted.
      responses:
        '200':
          description: The participants exist; the message list may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistory'
        '400':
          description: An account or bot path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/conversations/private/{botId}/commands:
    description: The bot commands an account's client suggests in its private chat with a bot.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/BotId'
    get:
      operationId: getPrivateChatBotCommands
      summary: Return the commands the account sees in its private chat with the bot
      description: >-
        Resolves the bot's command lists as Telegram documents for private chats: the list for
        the chat, then for all private chats, then the default list, each preferring the list in
        the account's language, taken from the primary subtag of its `language_code`, over the
        list without a language. The account need not have written to the bot.
      responses:
        '200':
          description: The commands, which are empty if the bot set none that apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBotCommands'
        '400':
          description: A path identifier is invalid.
        '404':
          description: The session, account, or bot does not exist.
  /sessions/{sessionId}/accounts/{accountId}/callback-queries:
    description: Callback queries an account created by pressing callback buttons.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: pressCallbackButton
      summary: Press a callback button on a bot message as a virtual account
      description: >-
        Presses the button with the given callback data on a bot message in the account's private
        chat with the bot. Unless the bot's allowed_updates subscription excludes callback_query
        updates, the bot receives a callback_query update carrying the message as it is now. The
        bot answers asynchronously with answerCallbackQuery; read the answer from the created
        callback query. The press can create the query already expired, so that the bot receives
        it but cannot answer it, as when a bot that was offline catches up after the answer
        deadline has passed. The emulator never expires callback queries by time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PressCallbackButtonRequest'
      responses:
        '201':
          description: The button was pressed and the callback query created.
          headers:
            Location:
              description: Relative URL of the created callback query.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        '400':
          description: >-
            The request is invalid, or the message has no callback button with the given data.
        '404':
          description: >-
            The session, account, or bot does not exist, or the private chat has no message with
            the given ID.
  /sessions/{sessionId}/accounts/{accountId}/callback-queries/{callbackQueryId}:
    description: One callback query created by an account.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/CallbackQueryId'
    get:
      operationId: getCallbackQuery
      summary: Return a callback query with the bot's answer once given
      responses:
        '200':
          description: The callback query, answered or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        '400':
          description: The account path identifier is invalid.
        '404':
          description: The session does not exist, or the account created no such callback query.
  /sessions/{sessionId}/bot-api/bot{token}/getMe:
    description: Telegram Bot API method for retrieving the authenticated virtual bot's profile.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getMe
      summary: Return the authenticated virtual bot's profile
      responses:
        '200':
          description: The virtual bot was authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeResponse'
        '400':
          description: The request body cannot be decoded, or getMe received a parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/getUpdates:
    description: Telegram Bot API long-polling method for receiving pending bot updates.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getUpdates
      summary: Return pending updates for the authenticated virtual bot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
            encoding:
              allowed_updates:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetUpdatesRequest'
            encoding:
              allowed_updates:
                contentType: application/json
      responses:
        '200':
          description: Pending updates, limited and confirmed according to the supplied offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUpdatesResponse'
        '400':
          description: The request body cannot be decoded, or the getUpdates parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '409':
          description: >-
            Another getUpdates request for the same bot began waiting for updates while this one
            was waiting, and replaced it. A bot has at most one waiting request; requests answered
            immediately do not replace it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/deleteWebhook:
    description: >-
      Telegram Bot API method for removing the bot's webhook. Virtual bots never have a webhook,
      so the method only discards pending updates when asked to. A waiting getUpdates request is
      not interrupted.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteWebhook
      summary: Confirm that the authenticated virtual bot has no webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteWebhookRequest'
      responses:
        '200':
          description: The bot has no webhook, and pending updates were discarded if requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookResponse'
        '400':
          description: The request body cannot be decoded, or the deleteWebhook parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/sendMessage:
    description: >-
      Telegram Bot API method for sending a text message. The emulator supports text sent to a
      private chat with an account that has written to the bot, formatted with `parse_mode` or
      `entities` and optionally with an inline keyboard of callback and URL buttons; reply
      parameters and other options are not supported yet. As on Telegram, the text and its
      entities are normalized before the message is stored, and the bot receives no update for its
      own message.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: sendMessage
      summary: Send text from the authenticated virtual bot to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            encoding:
              entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            encoding:
              entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: The message was stored in the private conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the text is empty (`Bad Request: message text is empty`);
            the text or its formatting cannot be read (for example `Bad Request: unsupported
            parse_mode`, `Bad Request: can't parse entities: …`, or `Bad Request: can't parse
            MessageEntity: …`); `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is
            not a private chat with an account that has written to the bot (`Bad Request: chat not
            found`); the text and its entities cannot be normalized (for example `Bad Request: text
            must be non-empty`, `Bad Request: entity URL '…' is invalid: …`, or `Bad Request: user
            not found`); the normalized text is longer than 4096 characters (`Bad Request: message
            is too long`); or a button's callback data exceeds 64 bytes (`Bad Request:
            BUTTON_DATA_INVALID`). Date and time entities are not supported (`Bad Request:
            date_time entities are not supported`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/editMessageText:
    description: >-
      Telegram Bot API method for editing the text of a message the bot sent to a private chat.
      As on Telegram, the text is formatted and normalized as by `sendMessage`, the edited message
      keeps only the inline keyboard given in `reply_markup`, and the bot receives no update for
      its own edit. The edit date changes only when the text or its entities do. Messages sent
      through inline mode, which `inline_message_id` identifies, are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageText
      summary: Edit the text of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
            encoding:
              entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageTextRequest'
            encoding:
              entities:
                contentType: application/json
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: The message was edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the text is empty (`Bad Request: message text is empty`);
            the text or its formatting cannot be read, as for `sendMessage`; neither `chat_id` nor
            a positive `message_id` is given (`Bad Request: message identifier is not specified`);
            `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is not a private chat
            with an account that has written to the bot (`Bad Request: chat not found`); the chat
            has no message with that ID (`Bad Request: message to edit not found`); the account
            wrote the message (`Bad Request: message can't be edited`); the text and its entities
            cannot be normalized, as for `sendMessage`; the normalized text is longer than 4096
            characters (`Bad Request: message is too long`); a button's callback data exceeds 64
            bytes (`Bad Request: BUTTON_DATA_INVALID`); or the text, entities, and keyboard are
            unchanged (`Bad Request: message is not modified: specified new message content and
            reply markup are exactly the same as a current content and reply markup of the
            message`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/editMessageReplyMarkup:
    description: >-
      Telegram Bot API method for replacing the inline keyboard of a message the bot sent to a
      private chat. Omitting `reply_markup` removes the keyboard. The text and edit date are
      unchanged, and the bot receives no update for its own edit. Messages sent through inline
      mode are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: editMessageReplyMarkup
      summary: Replace the inline keyboard of a message the authenticated virtual bot sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageReplyMarkupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditMessageReplyMarkupRequest'
            encoding:
              reply_markup:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditMessageReplyMarkupRequest'
            encoding:
              reply_markup:
                contentType: application/json
      responses:
        '200':
          description: The message's keyboard was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it for the reasons editMessageText gives, apart from those about the text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/deleteMessage:
    description: >-
      Telegram Bot API method for deleting a message of a private chat for both participants. As
      on Telegram, a bot can delete messages either participant wrote, and receives no update for
      the deletion. The deleted message leaves the conversation history, and its buttons can no
      longer be pressed; message IDs are never reused. The emulator does not age messages, so
      Telegram's 48-hour deletion limit never applies.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteMessage
      summary: Delete a message of the authenticated virtual bot's private chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteMessageRequest'
      responses:
        '200':
          description: The message was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeletionResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `chat_id` is missing (`Bad Request: chat_id is empty`);
            the chat is not a private chat with an account that has written to the bot (`Bad
            Request: chat not found`); or `message_id` is missing, not positive, or identifies no
            message of the chat, including a deleted one (`Bad Request: message to delete not
            found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/deleteMessages:
    description: >-
      Telegram Bot API method for deleting several messages of a private chat at once, as
      deleteMessage deletes one. As on Telegram, identifiers that identify no message of the chat
      are skipped.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteMessages
      summary: Delete several messages of the authenticated virtual bot's private chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMessagesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteMessagesRequest'
            encoding:
              message_ids:
                contentType: application/json
      responses:
        '200':
          description: The messages that the identifiers found were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeletionResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: `message_ids` is missing (`Bad Request: message
            identifiers are not specified`); it has more than 100 identifiers (`Bad Request: too
            many message identifiers specified`); an identifier is not positive (`Bad Request:
            invalid message identifier specified`); `chat_id` is missing (`Bad Request: chat_id is
            empty`); or the chat is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/answerCallbackQuery:
    description: >-
      Telegram Bot API method for answering a callback query the bot received. The account that
      pressed the button can read the answer from its callback query. Answer URLs, which Telegram
      allows only for game buttons and bot links, are not supported.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: answerCallbackQuery
      summary: Answer a callback query sent to the authenticated virtual bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCallbackQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerCallbackQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerCallbackQueryRequest'
      responses:
        '200':
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCallbackQueryResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or the callback query
            does not exist, was sent to another bot, is already answered, or has expired (`Bad
            Request: query is too old and response timeout expired or query ID is invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/setMyCommands:
    description: >-
      Telegram Bot API method for replacing the bot's command list for a scope and language. As on
      Telegram, commands are cleaned of control characters, trimmed, and stripped of a leading
      slash, and an empty or missing `commands` list deletes the list. Chat scopes can address only
      private chats with accounts that have written to the bot; group chats are not available to
      bots yet.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: setMyCommands
      summary: Replace one of the authenticated virtual bot's command lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMyCommandsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetMyCommandsRequest'
            encoding:
              commands:
                contentType: application/json
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetMyCommandsRequest'
            encoding:
              commands:
                contentType: application/json
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`). Each command is then checked for UTF-8 text, a nonempty command of at most
            32 characters (`Bad Request: command must be non-empty`, `Bad Request: command length
            must not exceed 32`), and a nonempty description of at most 256 characters (`Bad
            Request: command description must be non-empty`, `Bad Request: command description
            length must not exceed 256`); finally, more than 100 commands (`Bad Request:
            BOT_COMMANDS_TOO_MUCH`) or a command with characters other than lowercase English
            letters, digits, and underscores (`Bad Request: BOT_COMMAND_INVALID`) are rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/getMyCommands:
    description: >-
      Telegram Bot API method for reading the bot's command list for exactly one scope and
      language, without falling back to other scopes or languages.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: getMyCommands
      summary: Return one of the authenticated virtual bot's command lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list, which is empty if none is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCommandsResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/deleteMyCommands:
    description: >-
      Telegram Bot API method for deleting the bot's command list for a scope and language, so
      that users see the list of the next broader scope.
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
    post:
      operationId: deleteMyCommands
      summary: Delete one of the authenticated virtual bot's command lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyCommandsTargetRequest'
            encoding:
              scope:
                contentType: application/json
      responses:
        '200':
          description: The command list was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrueResultResponse'
        '400':
          description: >-
            The request cannot be decoded or has unsupported parameters, or Telegram would reject
            it, checking in this order: the scope is not a known type (`Bad Request: can't parse
            BotCommandScope: Unsupported type specified`) or names a user ID that is not positive
            (`Bad Request: can't parse BotCommandScope: Invalid user_id specified`); a chat scope
            names a chat that is not a private chat with an account that has written to the bot
            (`Bad Request: chat not found`); an administrator or member scope names a private chat
            (`Bad Request: can't use specified scope in private chats`); or the language code is
            neither empty nor two lowercase letters (`Bad Request: invalid language code
            specified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '401':
          description: The token does not belong to a virtual bot in the addressed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotApiErrorResponse'
        '404':
          description: No active test session has the supplied identifier.
  /sessions/{sessionId}/bot-api/bot{token}/{method}:
    description: Telegram Bot API methods invoked for a virtual bot within a test session.
    x-implementation-status: unimplemented
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/BotToken'
      - $ref: '#/components/parameters/BotApiMethod'
components:
  schemas:
    TelegramUserId:
      type: integer
      minimum: 1
      maximum: 1099511627775
    Bot:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
        - username
        - can_join_groups
        - can_read_all_group_messages
        - supports_inline_queries
        - can_connect_to_business
        - has_main_web_app
        - has_topics_enabled
        - allows_users_to_create_topics
        - can_manage_bots
        - supports_join_request_queries
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the bot.
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        username:
          type: string
        can_join_groups:
          type: boolean
        can_read_all_group_messages:
          type: boolean
        supports_guest_queries:
          type: boolean
        supports_inline_queries:
          type: boolean
        can_connect_to_business:
          type: boolean
        has_main_web_app:
          type: boolean
        has_topics_enabled:
          type: boolean
        allows_users_to_create_topics:
          type: boolean
        can_manage_bots:
          type: boolean
        supports_join_request_queries:
          type: boolean
    CreateBotRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - username
      properties:
        first_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
    CreatedBot:
      type: object
      additionalProperties: false
      required:
        - token
        - bot
      properties:
        token:
          type: string
          description: Emulator-issued token used to call the Bot API as this bot.
        bot:
          $ref: '#/components/schemas/Bot'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - is_bot
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
          description: Server-assigned Telegram user identifier for the account.
        is_bot:
          type: boolean
          const: false
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        language_code:
          type: string
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        language_code:
          type: string
          minLength: 1
    CreatedAccount:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          $ref: '#/components/schemas/Account'
    PrivateMessageTarget:
      type: object
      additionalProperties: false
      required:
        - type
        - botId
      properties:
        type:
          type: string
          const: private
        botId:
          $ref: '#/components/schemas/TelegramUserId'
    SendAccountMessageRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - text
      properties:
        to:
          $ref: '#/components/schemas/PrivateMessageTarget'
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: >-
            Plain text, normalized as a Telegram client does: control characters become spaces,
            carriage returns are removed, and leading and trailing whitespace is trimmed. Text with
            no visible characters is rejected.
    PrivateChat:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - first_name
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        type:
          type: string
          const: private
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    PrivateTextMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - from
        - chat
        - date
        - text
      properties:
        message_id:
          type: integer
          minimum: 1
          description: >-
            Message ID in the conversation bot's message sequence, which spans all of that bot's
            private chats. Other observers can number the same message differently.
        from:
          description: The account or bot that wrote the message.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        chat:
          $ref: '#/components/schemas/PrivateChat'
          description: The account's private chat, whichever participant wrote the message.
        date:
          type: integer
          minimum: 0
          description: Unix timestamp when the emulator accepted the message.
        edit_date:
          type: integer
          minimum: 0
          description: >-
            Unix timestamp of the last edit of the text, omitted if the text was never edited.
            Replacing only the inline keyboard does not change it.
        text:
          type: string
        entities:
          type: array
          minItems: 1
          description: >-
            Entities marked in the text, omitted when there are none: formatting the bot applied,
            and bot commands, which, as Telegram does in private chats with bots, the emulator
            marks in text written by either participant. Other entity types Telegram detects, such
            as URLs and mentions, are not detected.
          items:
            $ref: '#/components/schemas/MessageEntity'
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: The inline keyboard the bot attached, omitted when there is none.
    InlineKeyboardMarkup:
      type: object
      additionalProperties: false
      required:
        - inline_keyboard
      properties:
        inline_keyboard:
          type: array
          description: >-
            Rows of buttons. As a request parameter, an empty array attaches no keyboard, as on
            Telegram; empty rows are rejected.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/InlineKeyboardButton'
    InlineKeyboardButton:
      description: >-
        A button with exactly one action. Telegram also accepts other button types and buttons
        with several actions, using the first action it recognizes; the emulator rejects them.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
            - callback_data
          properties:
            text:
              type: string
              minLength: 1
            callback_data:
              type: string
              minLength: 1
              description: >-
                Data sent to the bot in a callback query, at most 64 bytes when UTF-8 encoded.
        - type: object
          additionalProperties: false
          required:
            - text
            - url
          properties:
            text:
              type: string
              minLength: 1
            url:
              type: string
              format: uri
              description: An absolute URL.
    MessageSenderBot:
      type: object
      additionalProperties: false
      description: A bot as a message sender, without the capabilities that only getMe reports.
      required:
        - id
        - is_bot
        - first_name
        - username
      properties:
        id:
          $ref: '#/components/schemas/TelegramUserId'
        is_bot:
          type: boolean
          const: true
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
    MessageEntity:
      type: object
      additionalProperties: false
      description: >-
        A marked span of message text. Formatting that overlaps other entities is split so that
        entities nest properly, as on Telegram.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
          enum:
            - bot_command
            - bold
            - italic
            - underline
            - strikethrough
            - spoiler
            - code
            - pre
            - text_link
            - text_mention
            - custom_emoji
            - blockquote
            - expandable_blockquote
        offset:
          type: integer
          minimum: 0
          description: Offset in UTF-16 code units to the start of the entity.
        length:
          type: integer
          minimum: 1
          description: Length of the entity in UTF-16 code units.
        language:
          type: string
          description: For `pre`, the programming language of the code, when one is given.
        url:
          type: string
          description: For `text_link`, the link as Telegram normalized it.
        user:
          description: For `text_mention`, the mentioned user.
          oneOf:
            - $ref: '#/components/schemas/Account'
            - $ref: '#/components/schemas/MessageSenderBot'
        custom_emoji_id:
          type: string
          description: For `custom_emoji`, the custom emoji's identifier.
    MessageEntityParameter:
      type: object
      additionalProperties: false
      description: >-
        An entity a bot specifies, as a Bot API `MessageEntity`. Types that Telegram detects by
        itself (`mention`, `hashtag`, `cashtag`, `bot_command`, `url`, `email`, `phone_number`,
        and `bank_card_number`) are accepted and ignored, so entities of a received message can be
        sent back. `date_time` entities are not supported. Telegram reads numbers written as
        strings; the emulator rejects them.
      required:
        - type
        - offset
        - length
      properties:
        type:
          type: string
        offset:
          type: integer
        length:
          type: integer
        language:
          type: string
        url:
          type: string
          description: For `text_link`; a `tg://user?id=` link makes a text mention.
        user:
          type: object
          description: For `text_mention`; only its `id` is read, and it must be a session user.
          required:
            - id
          properties:
            id:
              type: integer
        custom_emoji_id:
          type: string
    ParseMode:
      type: string
      description: >-
        Markup to read the text as, matched case-insensitively: `HTML`, `MarkdownV2`, or the
        legacy `Markdown`, parsed as Telegram does. `none` or omitting it leaves the text as it is.
        Date and time markup (`<tg-time>` or a `tg://time` link) is not supported.
    SentMessage:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/PrivateTextMessage'
    MessageHistory:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PrivateTextMessage'
    MessageUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - message
      properties:
        update_id:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/PrivateTextMessage'
    CallbackQueryUpdate:
      type: object
      additionalProperties: false
      required:
        - update_id
        - callback_query
      properties:
        update_id:
          type: integer
          minimum: 1
        callback_query:
          $ref: '#/components/schemas/BotApiCallbackQuery'
    BotApiCallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - from
        - message
        - chat_instance
        - data
      properties:
        id:
          type: string
          description: Identifier to pass to answerCallbackQuery.
        from:
          $ref: '#/components/schemas/Account'
          description: The account that pressed the button.
        message:
          $ref: '#/components/schemas/PrivateTextMessage'
          description: The message carrying the button, as it was when the button was pressed.
        chat_instance:
          type: string
          description: >-
            Opaque signed 64-bit decimal identifying the message's chat, fixed for each private
            chat.
        data:
          type: string
          description: The pressed button's callback data.
    GetUpdatesRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          description: >-
            Identifier of the first update to return; earlier updates are confirmed and
            forgotten. A negative offset returns that many updates from the end of the queue and
            forgets the rest. As on Telegram, an offset more than 10 beyond the identifier the next
            update will receive is ignored, so a stale offset does not discard pending updates.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        timeout:
          type: integer
          minimum: 0
          maximum: 50
          default: 0
        allowed_updates:
          description: >-
            Update types the bot subscribes to, matched case-insensitively. The subscription
            persists until a later request supplies this parameter and applies only to updates
            created afterward. Unrecognized names are ignored; a list with no recognized name
            selects Telegram's default, which excludes chat_member, message_reaction, and
            message_reaction_count.
          type: array
          items:
            type: string
    DeleteWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        drop_pending_updates:
          type: boolean
          default: false
          description: >-
            Discards the bot's pending updates; later updates continue its update ID sequence. As
            on Telegram, text values `true`, `yes`, and `1` are true, compared case-insensitively;
            the emulator also accepts `false`, `no`, and `0`, and rejects any other text.
    DeleteWebhookResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
        - description
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
        description:
          type: string
          const: Webhook is already deleted
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - text
      properties:
        chat_id:
          type: integer
          description: >-
            Identifier of the private chat, which is the account's user ID. Telegram's
            `@username` form is not accepted, because Telegram resolves it only for bots,
            supergroups, and channels.
        text:
          type: string
          minLength: 1
          description: >-
            Message text, at most 32768 bytes before formatting is applied and 4096 characters
            after. As on Telegram, control characters become spaces, carriage returns are removed,
            and leading and trailing whitespace is trimmed, but leading whitespace only up to the
            first entity.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: >-
            Inline keyboard to attach. Reply keyboards, keyboard removal, and forced replies are
            not supported.
    EditMessageTextRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
        - text
      properties:
        chat_id:
          type: integer
          description: Identifier of the private chat, which is the account's user ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        text:
          type: string
          minLength: 1
          description: New message text, read and normalized as by `sendMessage`.
        parse_mode:
          $ref: '#/components/schemas/ParseMode'
        entities:
          type: array
          description: Entities marking the text; ignored when `parse_mode` formats it.
          items:
            $ref: '#/components/schemas/MessageEntityParameter'
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the edited message shows; omitting it removes the keyboard.
    EditMessageReplyMarkupRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: Identifier of the private chat, which is the account's user ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
        reply_markup:
          $ref: '#/components/schemas/InlineKeyboardMarkup'
          description: Keyboard the message shows; omitting it removes the keyboard.
    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/PrivateTextMessage'
    DeleteMessageRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_id
      properties:
        chat_id:
          type: integer
          description: Identifier of the private chat, which is the account's user ID.
        message_id:
          type: integer
          description: Identifier of the message in the bot's chat.
    DeleteMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - chat_id
        - message_ids
      properties:
        chat_id:
          type: integer
          description: Identifier of the private chat, which is the account's user ID.
        message_ids:
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 1
          description: Identifiers of the messages in the bot's chat.
    MessageDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AnswerCallbackQueryRequest:
      type: object
      additionalProperties: false
      required:
        - callback_query_id
      properties:
        callback_query_id:
          type: string
        text:
          type: string
          maxLength: 200
          description: Notification text; omitted or empty text shows no notification.
        show_alert:
          type: boolean
          default: false
          description: Shows the text as an alert instead of a transient notification.
        cache_time:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 0
          description: Seconds for which the account's client may reuse the answer.
    AnswerCallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    BotCommand:
      type: object
      additionalProperties: false
      required:
        - command
        - description
      properties:
        command:
          type: string
          description: >-
            The command, 1-32 lowercase English letters, digits, and underscores. As a request
            parameter, a leading slash and surrounding whitespace are removed first.
        description:
          type: string
          description: The description, 1-256 characters after surrounding whitespace is removed.
        is_ephemeral:
          type: boolean
          description: Telegram's ephemeral command flag, stored as given; omitted when false.
    BotCommandScope:
      type: object
      additionalProperties: false
      description: >-
        The users and chats a command list applies to; a missing scope is the default scope.
        Chat IDs must be numbers, and chat scopes can name only private chats.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - default
            - all_private_chats
            - all_group_chats
            - all_chat_administrators
            - chat
            - chat_administrators
            - chat_member
        chat_id:
          type: integer
          description: Required for `chat`, `chat_administrators`, and `chat_member`.
        user_id:
          type: integer
          minimum: 1
          description: Required for `chat_member`.
    MyCommandsTargetRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
          description: >-
            Two-letter ISO 639-1 language code of the list, or empty for users whose language has
            no dedicated list.
    SetMyCommandsRequest:
      type: object
      additionalProperties: false
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
        scope:
          $ref: '#/components/schemas/BotCommandScope'
        language_code:
          type: string
          pattern: '^([a-z]{2})?$'
    BotCommandsResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/BotCommand'
    TrueResultResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: boolean
          const: true
    AccountBotCommands:
      type: object
      additionalProperties: false
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - command
              - description
              - is_ephemeral
            properties:
              command:
                type: string
              description:
                type: string
              is_ephemeral:
                type: boolean
    PressCallbackButtonRequest:
      type: object
      additionalProperties: false
      required:
        - chat
        - message_id
        - callback_data
      properties:
        chat:
          $ref: '#/components/schemas/PrivateMessageTarget'
        message_id:
          type: integer
          minimum: 1
          description: >-
            Identifier of the message carrying the button, as message history shows it, which is
            its identifier in the bot's chat.
        callback_data:
          type: string
          minLength: 1
          description: Callback data of the button to press.
        expired:
          type: boolean
          default: false
          description: >-
            Creates the callback query already expired: the bot still receives it but cannot
            answer it.
    CallbackQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - callback_data
        - status
        - answer
      properties:
        id:
          type: string
          description: Identifier the bot receives in its callback_query update.
        callback_data:
          type: string
        status:
          type: string
          enum:
            - awaiting_answer
            - answered
            - expired
          description: >-
            Whether the bot can still answer the query. A query is created awaiting an answer or
            already expired; the bot's accepted answer moves an awaiting query to answered. An
            answered or expired query accepts no answer.
        answer:
          description: The bot's answer when the status is `answered`, and null otherwise.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                - show_alert
                - cache_time
              properties:
                text:
                  type: string
                  description: Notification text, omitted when the answer shows none.
                show_alert:
                  type: boolean
                cache_time:
                  type: integer
                  minimum: 0
    CallbackQueryResponse:
      type: object
      additionalProperties: false
      required:
        - callback_query
      properties:
        callback_query:
          $ref: '#/components/schemas/CallbackQuery'
    GetUpdatesResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessageUpdate'
              - $ref: '#/components/schemas/CallbackQueryUpdate'
    GetMeResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/Bot'
    BotApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - error_code
        - description
      properties:
        ok:
          type: boolean
          const: false
        error_code:
          type: integer
        description:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - botApiRoot
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier of the test session.
        botApiRoot:
          type: string
          format: uri
          description: Absolute API root for bots operating in this test session.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifier of the test session that owns the addressed state.
      schema:
        type: string
    BotToken:
      name: token
      in: path
      required: true
      description: Token of a virtual bot owned by the addressed test session.
      schema:
        type: string
    BotId:
      name: botId
      in: path
      required: true
      description: Server-assigned identifier of a virtual bot.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    AccountId:
      name: accountId
      in: path
      required: true
      description: Server-assigned Telegram user identifier for a virtual account.
      schema:
        $ref: '#/components/schemas/TelegramUserId'
    CallbackQueryId:
      name: callbackQueryId
      in: path
      required: true
      description: Identifier of a callback query created by the addressed account.
      schema:
        type: string
    BotApiMethod:
      name: method
      in: path
      required: true
      description: Telegram Bot API method name.
      schema:
        type: string
