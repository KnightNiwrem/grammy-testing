            `chat_id` is missing (`Bad Request: chat_id is empty`); the chat is neither a private
            chat with an account that has written to the bot nor a supergroup the bot is or was a
            member of (`Bad Request: chat not found`); the chat is a private chat (`Bad Request:
            method is available only in groups and supergroups`); the user is no user of the
            session (`Bad Request: member not found`); the user is the owner (`Bad Request: only
            the owner can edit their custom title`); the user is not an administrator (`Bad
