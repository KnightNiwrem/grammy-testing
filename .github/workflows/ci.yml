name: Deno CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.task_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task_name: fmt:check
            task: fmt:check
          - task_name: lint
            task: lint
          - task_name: check
            task: check
          - task_name: test
            task: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start emulation server
        if: matrix.task == 'test'
        run: |
          deno task serve &
          for attempt in $(seq 1 50); do
            curl --silent --fail --request POST http://localhost:8081/admin/sessions > /dev/null && break
            sleep 0.2
          done

      - name: ${{ matrix.task_name }}
        run: deno task ${{ matrix.task }}
        env:
          BOT_API_EMULATOR_URL: ${{ matrix.task == 'test' && 'http://localhost:8081' || '' }}
