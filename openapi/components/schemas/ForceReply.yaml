type: object
additionalProperties: false
required:
  - force_reply
properties:
  force_reply:
    type: boolean
    const: true
  input_field_placeholder:
    type: string
    minLength: 1
    maxLength: 64
  selective:
    type: boolean
    default: false
    description: >-
      In a supergroup, applies the markup only to the members the message mentions and the
      sender of the message it replies to. It has no effect in private chats.
