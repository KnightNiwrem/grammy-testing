type: object
additionalProperties: false
description: >-
  The rights the administrator holds, by the Bot API's names, of which at least one must be
  `true`; an omitted right is not held. Anonymous administrators are not supported.
properties:
  can_manage_chat:
    type: boolean
    default: false
  can_change_info:
    type: boolean
    default: false
  can_delete_messages:
    type: boolean
    default: false
  can_invite_users:
    type: boolean
    default: false
  can_restrict_members:
    type: boolean
    default: false
  can_pin_messages:
    type: boolean
    default: false
  can_manage_topics:
    type: boolean
    default: false
  can_promote_members:
    type: boolean
    default: false
  can_manage_video_chats:
    type: boolean
    default: false
  can_post_stories:
    type: boolean
    default: false
  can_edit_stories:
    type: boolean
    default: false
  can_delete_stories:
    type: boolean
    default: false
  can_manage_tags:
    type: boolean
    default: false
  can_send_welcome_messages:
    type: boolean
    default: false
