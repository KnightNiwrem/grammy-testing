type: object
additionalProperties: false
required:
  - type
  - id
  - photo_file_id
properties:
  type:
    type: string
    const: photo
  id:
    $ref: ./InlineQueryResultId.yaml
  photo_file_id:
    $ref: ./FileId.yaml
  title:
    type: string
  description:
    type: string
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  show_caption_above_media:
    type: boolean
    default: false
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  input_message_content:
    $ref: ./InputTextMessageContent.yaml
    description: Text that sending the result writes instead of the photo, if it has text.
