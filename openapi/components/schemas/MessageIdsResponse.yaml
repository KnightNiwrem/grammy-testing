type: object
additionalProperties: false
required:
  - ok
  - result
properties:
  ok:
    type: boolean
    const: true
  result:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required:
        - message_id
      properties:
        message_id:
          type: integer
          minimum: 1
          description: A new message's ID in the bot's chat.
