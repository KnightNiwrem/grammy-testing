type: object
additionalProperties: false
required:
  - type
  - id
  - title
  - document_file_id
properties:
  type:
    type: string
    const: document
  id:
    $ref: ./InlineQueryResultId.yaml
  title:
    type: string
    minLength: 1
  document_file_id:
    $ref: ./FileId.yaml
  description:
    type: string
  caption:
    $ref: ./Caption.yaml
  parse_mode:
    $ref: ./ParseMode.yaml
  caption_entities:
    $ref: ./CaptionEntitiesParameter.yaml
  reply_markup:
    $ref: ./InlineKeyboardMarkup.yaml
  input_message_content:
    $ref: ./InputTextMessageContent.yaml
    description: Text that sending the result writes instead of the document, if it has text.
