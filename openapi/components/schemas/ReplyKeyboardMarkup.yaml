type: object
additionalProperties: false
required:
  - keyboard
properties:
  keyboard:
    type: array
    description: >-
      Rows of buttons. As on Telegram, an empty array sends no reply markup; empty rows are
      rejected.
    items:
      type: array
      minItems: 1
      items:
        description: >-
          A text button, written as its text or as an object. Buttons that request a
          contact, location, poll, users, chat, or web app are not supported.
        oneOf:
          - type: string
            minLength: 1
          - $ref: ./ReplyKeyboardButton.yaml
  is_persistent:
    type: boolean
    default: false
  resize_keyboard:
    type: boolean
    default: false
  one_time_keyboard:
    type: boolean
    default: false
  input_field_placeholder:
    type: string
    minLength: 1
    maxLength: 64
  selective:
    type: boolean
    default: false
    description: >-
      In a supergroup, applies the markup only to the members the message mentions and the
      sender of the message it replies to. It has no effect in private chats.
