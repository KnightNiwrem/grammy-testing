description: Stored messages of a supergroup the account is a member of.
parameters:
  - $ref: ../components/parameters/SessionId.yaml
  - $ref: ../components/parameters/AccountId.yaml
  - $ref: ../components/parameters/SupergroupChatId.yaml
get:
  operationId: getSupergroupMessageHistory
  summary: Return the supergroup's stored messages
  description: >-
    Returns the messages every member wrote, oldest first, as the account sees them. A
    supergroup numbers its messages once, so every member, account or bot, sees the same
    message IDs; each member knows a file by a `file_id` of its own. Deleted messages are
    omitted.
  responses:
    '200':
      description: The account is a member; the message list may be empty.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupergroupMessageHistory.yaml
    '400':
      description: An account or supergroup path identifier is invalid.
    '403':
      description: The account is not a member of the supergroup.
    '404':
      description: The session, account, or supergroup does not exist.
